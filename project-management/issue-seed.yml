issues:
  - id: PM-001
    title: Bootstrap GitHub Issues, milestones, and project board from the roadmap
    milestone: MCP/Trac Control Plane
    labels:
      - type:roadmap-task
      - area:mcp-trac-control-plane
      - status:active
      - priority:high
    body: |
      Create the repo-native issue templates, milestone catalog, label catalog,
      and dry-run-first GitHub seeding workflow used while Trac and custom MCP
      integrations are evaluated.

      Removal condition: labels, milestones, seeded issues, and project board
      are reproducible from repo data without using GitHub Actions.
  - id: PM-002
    title: Enable GitHub Projects v2 board creation scope
    milestone: MCP/Trac Control Plane
    labels:
      - type:blocker
      - area:mcp-trac-control-plane
      - status:blocked
      - priority:high
    body: |
      GitHub issue, label, and milestone seeding works with the current Forge
      token. GitHub Projects v2 board creation is blocked because the token is
      missing `project` / `read:project` scope.

      Removal condition: a token with GitHub Projects v2 scope is available to
      the local seed workflow and `scripts/github_project_seed.py --apply
      --create-project` creates or confirms the project board.
  - id: MCP-001
    title: Evaluate self-hosted MCP runtime and safe Trac integration
    milestone: MCP/Trac Control Plane
    labels:
      - type:roadmap-task
      - area:mcp-trac-control-plane
      - status:ready
      - priority:normal
    body: |
      Keep Trac and MCP integration in design/evaluation while current project
      tracking uses GitHub Issues and milestones.

      Removal condition: self-hosted MCP runtime and Trac wrapper design are
      accepted with explicit read/write tool allowlists and audit controls.
