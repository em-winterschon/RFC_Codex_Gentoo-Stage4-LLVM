settings:
  project_title: RFC Codex Infrastructure Roadmap
  roadmap_source: docs/ROADMAP-AND-TODO.md
  exclude_statuses:
    - completed
  prefix_milestones:
    AAA: Identity/RBAC/AAA
    CI: Builder Farm
    CP: Critical Path
    DNS: DNS Automation
    FMT2: FMT2 Recovery
    LLM: LLM/RAG Services
    LOG: Logging/Search
    MT: Critical Path
    OBS: Observability
    PNR: NetBox/IPAM/DCIM
    REPO: Repository Proxy
    ST: Container Services
    WS: Workstation Stage5
  prefix_areas:
    AAA: identity-aaa
    CI: builder-farm
    CP: critical-path
    DNS: dns-automation
    FMT2: fmt2-recovery
    LLM: llm-rag-services
    LOG: logging-search
