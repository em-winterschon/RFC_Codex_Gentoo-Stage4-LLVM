<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1496px" preserveAspectRatio="none" style="width:1015px;height:1496px;background:#FFFFFF;" version="1.1" viewBox="0 0 1015 1496" width="1015px" zoomAndPan="magnify"><title>Atlas Core Functional Task Processing - Requirement to Actions</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="430.1924" x="290.9526" y="33.1318">Atlas Core Functional Task Processing - Requirement to Actions</text></g><ellipse cx="658.1656" cy="57.0986" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="178.748" x="568.7916" y="87.0986"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.748" x="578.7916" y="108.3545">Receive operator requirement</text><rect fill="#F7F7F7" height="75.1953" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="206.7793" x="554.776" y="140.8975"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="114.7148" x="564.776" y="162.1533">Classify request type:</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.7793" x="564.776" y="175.9521">documentation, live host validation,</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="168.7852" x="564.776" y="189.751">repo publication, package build,</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="79.3828" x="564.776" y="203.5498">or coordination</text><rect fill="#F7F7F7" height="61.3965" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="195.4121" x="560.4596" y="236.0928"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="122.7305" x="570.4596" y="257.3486">Load local context first:</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.7617" x="570.4596" y="271.1475">repo docs, git state, host aliases,</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="175.4121" x="570.4596" y="284.9463">FCP notes, and live service state</text><polygon fill="#F7F7F7" points="591.2123,317.4893,725.119,317.4893,737.119,329.4893,725.119,341.4893,591.2123,341.4893,579.2123,329.4893,591.2123,317.4893" style="stroke:#444444;stroke-width:0.5;"/><text fill="#111111" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="133.9067" x="591.2123" y="333.4827">Live host or package work?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="562.0946" y="327.1582">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="737.119" y="327.1582">no</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="170.7383" x="348.2454" y="351.4893"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.7383" x="358.2454" y="372.7451">Use SSH config aliases only</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="206.0879" x="330.5706" y="405.2881"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.0879" x="340.5706" y="426.5439">Check source-of-truth expectations</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.7578" x="340.5706" y="440.3428">against NetBox/repo inventory</text><polygon fill="#F7F7F7" points="326.907,472.8857,540.322,472.8857,552.322,484.8857,540.322,496.8857,326.907,496.8857,314.907,484.8857,326.907,472.8857" style="stroke:#444444;stroke-width:0.5;"/><text fill="#111111" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="213.415" x="326.907" y="488.8792">Portage atom or dependency tree involved?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="297.7893" y="482.5547">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="552.322" y="482.5547">no</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="216.1016" x="138.562" y="506.8857"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.1016" x="148.562" y="528.1416">Inspect package visibility and current</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.043" x="148.562" y="541.9404">Portage policy</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="226.0918" x="133.5669" y="574.4834"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="206.0918" x="143.5669" y="595.7393">Prefer binary package or remote distcc</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.4277" x="143.5669" y="609.5381">compile capacity when available</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="307.4551" x="92.8853" y="642.0811"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="204.0703" x="102.8853" y="663.3369">Run emerge with explicit MAKEOPTS,</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="287.4551" x="102.8853" y="677.1357">FEATURES, and DISTCC_HOSTS only when needed</text><polygon fill="#F7F7F7" points="214.8159,709.6787,278.4097,709.6787,290.4097,721.6787,278.4097,733.6787,214.8159,733.6787,202.8159,721.6787,214.8159,709.6787" style="stroke:#444444;stroke-width:0.5;"/><text fill="#111111" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="63.5938" x="214.8159" y="725.6721">Build failure?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="185.6982" y="719.3477">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="290.4097" y="719.3477">no</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="217.4668" x="15.6553" y="743.6787"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="197.4668" x="25.6553" y="764.9346">Read build log and isolate root cause</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="194.0938" x="27.3418" y="797.4775"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.0938" x="37.3418" y="818.7334">Patch durable inventory or policy</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.7383" x="37.3418" y="832.5322">instead of retrying blindly</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="226.7773" x="11" y="865.0752"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="206.7773" x="21" y="886.3311">Rerun the minimum package operation</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="222.1191" x="257.7773" y="743.6787"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.1191" x="267.7773" y="764.9346">Record package and version outcome</text><polygon fill="#F7F7F7" points="246.6128,904.874,258.6128,916.874,246.6128,928.874,234.6128,916.874,246.6128,904.874" style="stroke:#444444;stroke-width:0.5;"/><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="221.4395" x="509.8965" y="506.8857"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.4395" x="519.8965" y="528.1416">Run scoped live validation commands</text><polygon fill="#F7F7F7" points="433.6145,934.874,445.6145,946.874,433.6145,958.874,421.6145,946.874,433.6145,934.874" style="stroke:#444444;stroke-width:0.5;"/><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="242.7617" x="761.3359" y="351.4893"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.7617" x="771.3359" y="372.7451">Inspect docs, tests, and previous commits</text><polygon fill="#F7F7F7" points="658.1656,964.874,670.1656,976.874,658.1656,988.874,646.1656,976.874,658.1656,964.874" style="stroke:#444444;stroke-width:0.5;"/><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="244.7891" x="535.7711" y="1008.874"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="224.7891" x="545.7711" y="1030.1299">Design minimal repo change that captures</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.1094" x="545.7711" y="1043.9287">the observable action and result</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="234.0723" x="541.1295" y="1076.4717"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.0723" x="551.1295" y="1097.7275">Write docs, diagrams, inventory, or tests</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="148.0684" x="584.1315" y="1130.2705"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.0684" x="594.1315" y="1151.5264">Run focused verification</text><polygon fill="#F7F7F7" points="608.9449,1184.0693,707.3864,1184.0693,719.3864,1196.0693,707.3864,1208.0693,608.9449,1208.0693,596.9449,1196.0693,608.9449,1184.0693" style="stroke:#444444;stroke-width:0.5;"/><text fill="#111111" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="98.4414" x="608.9449" y="1200.0627">Verification passes?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="579.8273" y="1193.7383">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="719.3864" y="1193.7383">no</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="180.0605" x="435.5797" y="1218.0693"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.0605" x="445.5797" y="1239.3252">Commit with scoped message</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="87.377" x="481.9215" y="1271.8682"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="67.377" x="491.9215" y="1293.124">Push branch</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="123.4004" x="463.9098" y="1325.667"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="103.4004" x="473.9098" y="1346.9229">Open or update PR</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style=