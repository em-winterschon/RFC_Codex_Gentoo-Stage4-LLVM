<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1131px" preserveAspectRatio="none" style="width:1474px;height:1131px;background:#FFFFFF;" version="1.1" viewBox="0 0 1474 1131" width="1474px" zoomAndPan="magnify"><title>CCP - M70 VPP/LACP Benchmark Promotion Gates</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="339.9648" x="565.9341" y="33.1318">CCP - M70 VPP/LACP Benchmark Promotion Gates</text></g><rect fill="none" height="20.6982" style="stroke:none;stroke-width:1;" width="1441.833" x="15" y="49.4131"/><ellipse cx="139.7148" cy="85.1113" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="237.4297" x="21" y="115.1113"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="217.4297" x="31" y="136.3672">Prove more than single-member line rate</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="173.4082" x="31" y="150.166">for the M70 OVS workload fabric</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="49.4131" y2="1119.8809"/><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="206.7441" x="280.7813" y="182.709"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.7441" x="290.7813" y="203.9648">Confirm NetBox device/interface/IP</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.082" x="290.7813" y="217.7637">records for each traffic generator</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="231.4473" x="268.4297" y="250.3066"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.1016" x="278.4297" y="271.5625">Confirm no production IP is assigned</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.4473" x="278.4297" y="285.3613">to vpp_canary ovs-vpp0 without NetBox</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="230.0938" x="269.1064" y="317.9043"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="210.0938" x="279.1064" y="339.1602">Confirm CSS326/CCR2004 LACP state</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7656" x="279.1064" y="352.959">is not changed outside a CCP</text><line style="stroke:#000000;stroke-width:1.5;" x1="262.4297" x2="262.4297" y1="49.4131" y2="1119.8809"/><rect fill="#F7F7F7" height="61.3965" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="212.7441" x="509.877" y="385.502"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.7441" x="519.877" y="406.7578">Choose two or more workload-fabric</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="175.459" x="519.877" y="420.5566">endpoints, or one endpoint faster</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="60.709" x="519.877" y="434.3555">than 1 GbE</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="197.416" x="517.541" y="466.8984"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="177.416" x="527.541" y="488.1543">Install iperf3 or VPP traffic tooling</text><line style="stroke:#000000;stroke-width:1.5;" x1="503.877" x2="503.877" y1="49.4131" y2="1119.8809"/><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="193.4668" x="763.2686" y="520.6973"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="173.4668" x="773.2686" y="541.9531">Keep eno1-eno4 on kernel ixgbe</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.752" x="773.2686" y="555.752">and OVS balance-tcp LACP</text><rect fill="#F7F7F7" height="61.3965" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="254.7617" x="732.6211" y="588.2949"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="119.3965" x="742.6211" y="609.5508">Do not bind to vfio-pci,</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="234.7617" x="742.6211" y="623.3496">uio_pci_generic, OVS-DPDK, or VPP DPDK</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.7715" x="742.6211" y="637.1484">until a separate DPDK CCP is approved</text><line style="stroke:#000000;stroke-width:1.5;" x1="726.6211" x2="726.6211" y1="49.4131" y2="1119.8809"/><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="192.7402" x="1129.6589" y="669.6914"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.7402" x="1139.6589" y="690.9473">Run TCP single-stream baseline</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="166.7188" x="1142.6697" y="723.4902"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.7188" x="1152.6697" y="744.7461">Run parallel TCP flows with</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="83.373" x="1152.6697" y="758.5449">distinct 5-tuples</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="166.0625" x="1142.9978" y="791.0879"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.0625" x="1152.9978" y="812.3438">Run reverse and UDP tests</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="217.4434" x="1117.3074" y="844.8867"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="197.4434" x="1127.3074" y="866.1426">Capture OVS member hash/load and</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="73.3711" x="1127.3074" y="879.9414">VPP counters</text><polygon fill="#F7F7F7" points="1121.7734,912.4844,1330.2847,912.4844,1342.2847,924.4844,1330.2847,936.4844,1121.7734,936.4844,1109.7734,924.4844,1121.7734,912.4844" style="stroke:#444444;stroke-width:0.5;"/><text fill="#111111" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="208.5112" x="1121.7734" y="928.4778">Aggregate exceeds one-member line rate?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="1092.6558" y="922.1533">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="1342.2847" y="922.1533">no</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="204.7813" x="997.3828" y="946.4844"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="184.7813" x="1007.3828" y="967.7402">Record aggregate LACP validation</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="171.4063" x="1014.0703" y="1000.2832"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.4063" x="1024.0703" y="1021.5391">Promote benchmark method</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="192.0605" x="1256.2544" y="946.4844"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.0605" x="1266.2544" y="967.7402">Record single-member limitation</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="198.0957" x="1253.2368" y="1000.2832"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.0957" x="1263.2368" y="1021.5391">Plan multi-endpoint or higher-rate</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.7266" x="1263.2368" y="1035.3379">generator follow-up</text><polygon fill="#F7F7F7" points="1226.0291,1053.8809,1238.0291,1065.8809,1226.0291,1077.8809,1214.0291,1065.8809,1226.0291,1053.8809" style="stroke:#444444;stroke-width:0.5;"/><ellipse cx="1226.0291" cy="1108.8809" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="1226.0291" cy="1108.8809" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="991.3828" x2="991.3828" y1="49.4131" y2="1119.8809"/><line style="stroke:#000000;stroke-width:1.5;" x1="1455.3325" x2="1455.3325" y1="49.4131" y2="1119.8809"/><line style="stroke:#333333;stroke-width:1;" x1="139.7148" x2="139.7148" y1="95.1113" y2="115.1113"/><polygon fill="#333333" points="135.7148,105.1113,139.7148,115.1113,143.7148,105.1113,139.7148,109.1113" style="stroke:#333333;stroke-width:1;"/><line style="stroke:#333333;stroke-width:1;" x1="384.1533" x2="384.1533" y1="230.3066" y2="250.3066"/><polygon fill="#333333" points="380.1533,240.3066,384.1533,250.3066,388.1533,240.3066,384.1533,244.3066" style="stroke:#333333;stroke-