<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1442px" preserveAspectRatio="none" style="width:1653px;height:1442px;background:#FFFFFF;" version="1.1" viewBox="0 0 1653 1442" width="1653px" zoomAndPan="magnify"><title>Atlas Observable Reasoning Workflow - 2026-05-26 Closeout</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="404.5576" x="622.8054" y="33.1318">Atlas Observable Reasoning Workflow - 2026-05-26 Closeout</text></g><rect fill="none" height="20.6982" style="stroke:none;stroke-width:1;" width="1620.1685" x="15" y="49.4131"/><ellipse cx="132.376" cy="85.1113" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F7F7F7" height="61.3965" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="218.0469" x="23.3525" y="115.1113"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.418" x="33.3525" y="136.3672">Parse operator request into</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.0469" x="33.3525" y="150.166">EOD, commits, PRs, docs, diagrams,</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.0957" x="33.3525" y="163.9648">FCP reconciliation, and validation</text><rect fill="#F7F7F7" height="75.1953" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="222.752" x="21" y="196.5078"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="130.7344" x="31" y="217.7637">Identify hard constraints:</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.752" x="31" y="231.5625">no raw SSH IPs, no NetworkManager,</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.084" x="31" y="245.3613">NetBox/repo as source of truth,</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="188.7832" x="31" y="259.1602">no force-push of diverged branches</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="49.4131" y2="1430.2715"/><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="206.7793" x="254.0859" y="291.7031"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.7793" x="264.0859" y="312.959">Read git branch state and PR state</text><rect fill="#F7F7F7" height="61.3965" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="195.3887" x="259.7813" y="345.502"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.7559" x="269.7813" y="366.7578">Read FCP outbox, audit log,</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="175.3887" x="269.7813" y="380.5566">LTC Forge reply, firmware notes,</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.7539" x="269.7813" y="394.3555">and M70 networking note</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="207.4473" x="253.752" y="426.8984"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127.3652" x="263.752" y="448.1543">Query live primary M70,</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.4473" x="263.752" y="461.9531">m70_canary, and vpp_canary state</text><line style="stroke:#000000;stroke-width:1.5;" x1="247.752" x2="247.752" y1="49.4131" y2="1430.2715"/><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="208.748" x="601.4565" y="494.4961"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="188.748" x="611.4565" y="515.752">Compare FCP approved policy with</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="168.7734" x="611.4565" y="529.5508">observed live package behavior</text><polygon fill="#F7F7F7" points="655.0737,562.0938,756.5874,562.0938,768.5874,574.0938,756.5874,586.0938,655.0737,586.0938,643.0737,574.0938,655.0737,562.0938" style="stroke:#444444;stroke-width:0.5;"/><text fill="#111111" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="101.5137" x="655.0737" y="578.0872">Contradiction found?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="625.9561" y="571.7627">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="768.5874" y="571.7627">no</text><rect fill="#F7F7F7" height="61.3965" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="233.4629" x="471.1992" y="596.0938"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.0859" x="481.1992" y="617.3496">Classify as operational concern:</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="213.4629" x="481.1992" y="631.1484">localhost/2 approved by FCP but unsafe</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.0762" x="481.1992" y="644.9473">on canary wrapper path</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="179.4043" x="498.2285" y="677.4902"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="159.4043" x="508.2285" y="698.7461">Prefer durable canary-specific</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="104.7129" x="508.2285" y="712.5449">inventory correction</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="198.1367" x="724.6621" y="596.0938"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.1367" x="734.6621" y="617.3496">Keep approved policy unchanged</text><polygon fill="#F7F7F7" points="705.8306,731.0879,717.8306,743.0879,705.8306,755.0879,693.8306,743.0879,705.8306,731.0879" style="stroke:#444444;stroke-width:0.5;"/><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="199.4375" x="606.1118" y="775.0879"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.082" x="616.1118" y="796.3438">Separate validated facts from</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="179.4375" x="616.1118" y="810.1426">remaining gates and assumptions</text><line style="stroke:#000000;stroke-width:1.5;" x1="465.1992" x2="465.1992" y1="49.4131" y2="1430.2715"/><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="207.4648" x="937.1055" y="842.6855"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.4648" x="947.1055" y="863.9414">Patch documentation and rendered</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="92.0273" x="947.1055" y="877.7402">workflow sources</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="148.7246" x="966.4756" y="910.2832"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.7246" x="976.4756" y="931.5391">Ren