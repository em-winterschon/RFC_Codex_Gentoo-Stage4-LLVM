<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="889px" preserveAspectRatio="none" style="width:1290px;height:889px;background:#FFFFFF;" version="1.1" viewBox="0 0 1290 889" width="1290px" zoomAndPan="magnify"><title>CCP - Documentation Diagram Rendering Workflow</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="343.7998" x="471.7869" y="33.1318">CCP - Documentation Diagram Rendering Workflow</text></g><rect fill="none" height="20.6982" style="stroke:none;stroke-width:1;" width="1257.3735" x="15" y="49.4131"/><ellipse cx="130.7236" cy="85.1113" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="219.4473" x="21" y="115.1113"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="199.4473" x="31" y="136.3672">Request documentation, architecture,</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7188" x="31" y="150.166">or EOD workflow visualization</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="49.4131" y2="877.0879"/><rect fill="#F7F7F7" height="61.3965" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="209.4336" x="344.8232" y="182.709"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="189.4336" x="354.8232" y="203.9648">Classify whether the change affects</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="189.4277" x="354.8232" y="217.7637">architecture, network, boot, identity,</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="177.4336" x="354.8232" y="231.5625">package policy, or live operations</text><polygon fill="#F7F7F7" points="385.9436,264.1055,513.1365,264.1055,525.1365,276.1055,513.1365,288.1055,385.9436,288.1055,373.9436,276.1055,385.9436,264.1055" style="stroke:#444444;stroke-width:0.5;"/><text fill="#111111" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="127.1929" x="385.9436" y="280.0989">CCP annotation required?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="356.8259" y="273.7744">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="525.1365" y="273.7744">no</text><rect fill="#F7F7F7" height="61.3965" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="181.4258" x="255.1172" y="298.1055"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.0742" x="265.1172" y="319.3613">Add a structured CCP table</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.4023" x="265.1172" y="333.1602">with scope, approval class,</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.4258" x="265.1172" y="346.959">rollback, validation, and owner</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="190.7656" x="250.4473" y="379.502"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.7656" x="260.4473" y="400.7578">Add or update PlantUML source</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="115.3945" x="260.4473" y="414.5566">under docs/diagrams/</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="184.0742" x="461.2129" y="298.1055"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.0742" x="471.2129" y="319.3613">Use normal prose or table-only</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="78.7207" x="471.2129" y="333.1602">documentation</text><polygon fill="#F7F7F7" points="449.54,433.0996,461.54,445.0996,449.54,457.0996,437.54,445.0996,449.54,433.0996" style="stroke:#444444;stroke-width:0.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="244.4473" x2="244.4473" y1="49.4131" y2="877.0879"/><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="176.7324" x="662.3037" y="477.0996"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.7324" x="672.3037" y="498.3555">Render PlantUML locally with</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.3965" x="672.3037" y="512.1543">PlantUML + Graphviz dot</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="190.7656" x="655.2871" y="544.6973"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.6875" x="665.2871" y="565.9531">Emit PNG for wiki-first viewing</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.7656" x="665.2871" y="579.752">and SVG for scalable inspection</text><line style="stroke:#000000;stroke-width:1.5;" x1="649.2871" x2="649.2871" y1="49.4131" y2="877.0879"/><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="190.748" x="860.0518" y="612.2949"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136.043" x="870.0518" y="633.5508">Commit .puml, .png, .svg,</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.748" x="870.0518" y="647.3496">Markdown references, and tests</text><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="198.7461" x="856.0527" y="679.8926"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.7461" x="866.0527" y="701.1484">Keep docs/wiki as the wiki source</text><line style="stroke:#000000;stroke-width:1.5;" x1="850.0527" x2="850.0527" y1="49.4131" y2="877.0879"/><rect fill="#F7F7F7" height="33.7988" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="123.4004" x="1104.1357" y="733.6914"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="103.4004" x="1114.1357" y="754.9473">Open or update PR</text><rect fill="#F7F7F7" height="47.5977" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:0.5;" width="202.0742" x="1064.7988" y="787.4902"/><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="182.0742" x="1074.7988" y="808.7461">Reviewer confirms docs, rendered</text><text fill="#111111" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.7754" x="1074.7988" y="822.5449">assets, and validation evidence</text><ellipse cx="1165.8359" cy="866.0879" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="1165.8359" cy="866.0879" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="1058.7988" x2="1058.7988" y1="49.4131" y2="877.0879"/><line style="stroke:#000000;stroke-width:1.5;" x1="1270.873" x2="1270.873" y1="49.4131" y2="877.0879"/><line style="stroke:#333333;stroke-width:1;" x1="130.7236" x2="130.7236" y1="95.1113" y2="115.1113"/><polygon fill="#333333" points="126.7236,105.1113,130.7236,115.1113,134.7236,105.1113,130.7236,109.1113" style="stroke:#333333;stroke-width:1;"/><line style="stroke:#333333;strok