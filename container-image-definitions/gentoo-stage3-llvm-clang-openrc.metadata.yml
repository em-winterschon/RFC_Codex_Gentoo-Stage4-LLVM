---
container_image_definition:
  name: gentoo-stage3-llvm-clang-openrc
  profile_taxonomy:
    stage: stage5
    role_class: service-container
    role_name: gentoo-stage3-llvm-clang-openrc
  source_stage3:
    target: amd64-llvm-openrc
    mirror_root: https://distfiles.gentoo.org/releases
    latest_metadata: https://distfiles.gentoo.org/releases/amd64/autobuilds/current-stage3-amd64-llvm-openrc/latest-stage3-amd64-llvm-openrc.txt
  package_list: container-image-definitions/gentoo-stage3-llvm-clang-openrc.packages
  use_override_file: container-image-definitions/gentoo-stage3-llvm-clang-openrc.use
  package_use_file: container-image-definitions/gentoo-stage3-llvm-clang-openrc.package.use
  binpkg_repo:
    repo_id: stage3-llvm_clang_openrc__stage5-service_container-base__amd64__x86_64_v2_generic
    remote_root: /srv/stage5-binpkgs
    pkgdir: /var/lib/container-services-ephemeral/images/gentoo-stage3-llvm-clang-openrc-binpkgs
  labels:
    org.opencontainers.image.title: Gentoo Stage3 LLVM/Clang OpenRC Base
    org.opencontainers.image.description: Gentoo base container extracted from the official llvm-clang OpenRC stage3, with stage5 service-container packages layered on top.
    org.opencontainers.image.licenses: GPL-2.0-only
  notes:
    - This is the active base-container path while the hardened Stage4 image remains deferred.
    - The extracted stage3 profile is preserved; package layering must not synthesize a hardened or split-usr compatibility profile unless explicitly requested.
    - Publish validated images through scripts/publish-container-ghcr.sh after image import or commit.
