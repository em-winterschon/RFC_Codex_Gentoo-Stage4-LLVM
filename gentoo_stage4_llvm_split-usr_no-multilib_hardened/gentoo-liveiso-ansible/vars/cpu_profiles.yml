---
cpu_profile_policy:
  source_provenance:
    requested_inventory: /tmp/docs/cpu-arch/RFC1918-CPU-Architectures.md
    requested_datasheets: /tmp/docs/cpu-arch/datasheets
    status: local-reference-reviewed
  cpuid2cpuflags_capture_required: true
  cpu_flags_x86_override:
    policy: capture-on-hardware-before-live-use
    reason: CPU_FLAGS_X86 should be exact for the installed CPU stepping, microcode, and Portage profile; do not infer final flag strings from datasheet names alone.
  optimization_scopes:
    portable: Reproducible across the named baseline ISA family; appropriate for shared binpkgs and generic VMs.
    native_reviewed: Hardware class has a selected `-march` and `-mtune`, but CPU_FLAGS_X86 must still be confirmed by `cpuid2cpuflags`.
    native_host: Host-specific profile generated from live `cpuid2cpuflags`, `gcc -march=native -Q --help=target`, and LLVM target support.
  host_capture_commands:
    cpuid2cpuflags: cpuid2cpuflags
    gcc_native: gcc -march=native -Q --help=target
    clang_targets: clang --print-targets
  architecture_gap_summary:
    x86_64: Define portable binpkg baselines first, then native reviewed profiles per CPU generation.
    arm64: Requires CHOST and `-mcpu` support in the Portage template before enabling architecture-specific profiles.
    ppc64le: Requires CHOST and ABI validation before adding POWER9 optimized profiles.

