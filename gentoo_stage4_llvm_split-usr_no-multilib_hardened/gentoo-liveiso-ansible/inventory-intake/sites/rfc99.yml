---
inventory_intake_version: 1

datacenters:
  - name: RFC99
    slug: rfc99
    timezone: America/Los_Angeles
    facility: operator-confirmed
    management_prefixes:
      - 172.16.99.0/24
      - 192.168.1.0/24
    access_paths:
      - local-management-lan
      - serial-console
      - future-zerotier-overlay
    owners:
      - codex-ops

prefixes:
  - prefix: 172.16.99.0/24
    site: rfc99
    status: active
    role: rfc99-lan-management
    gateway: 172.16.99.1
  - prefix: 192.168.1.0/24
    site: rfc99
    status: active
    role: upstream-provider-router-lan
    gateway: 192.168.1.254
  - prefix: 99.7.56.156/32
    site: rfc99
    status: provider-assigned
    role: fiber-wan-public-ip

devices:
  - name: gw_rfc99_mkcrs309
    site: rfc99
    role: routeros-gateway
    manufacturer: MikroTik
    model: CRS309-1G-8S+IN
    status: planned
    management_ip: 172.16.99.1
    management_interface: ether1
    fqdn: gw-rfc99-mkcrs309.rfc1918.host
    serial_console: /dev/ttyUSB2
    interfaces:
      - name: ether1
        type: 1000base-t
        purpose: poe-management
      - name: sfp-sfpplus1
        type: 10gbase-x-sfpp
        purpose: wan-uplink
      - name: sfp-sfpplus2
        type: 10gbase-x-sfpp
        purpose: lan-bridge-member
      - name: sfp-sfpplus3
        type: 10gbase-x-sfpp
        purpose: lan-bridge-member
      - name: sfp-sfpplus4
        type: 10gbase-x-sfpp
        purpose: lan-bridge-member
      - name: sfp-sfpplus5
        type: 10gbase-x-sfpp
        purpose: lan-bridge-member
      - name: sfp-sfpplus6
        type: 10gbase-x-sfpp
        purpose: lan-bridge-member
      - name: sfp-sfpplus7
        type: 10gbase-x-sfpp
        purpose: lan-bridge-member
      - name: sfp-sfpplus8
        type: 10gbase-x-sfpp
        purpose: lan-bridge-member
    notes:
      - Source file listed CRS309 LAN as 172.16.99.1/16, but staged prefix is 172.16.99.0/24 until final router policy is confirmed.
      - Import script /tmp/crs309-router-mode-idc.wip.rsc is destructive and must be applied in gated phases only.
      - Replace IDC moniker with RFC99 before any RouterOS import.
      - Admin password and all device credentials are excluded from repo intake and must be stored in Ansible Vault.
  - name: gw_rfc99_mkccr2004_16g
    site: rfc99
    role: routeros-gateway
    manufacturer: MikroTik
    model: CCR2004-16G-2S+PC
    status: active
    management_ip: 172.16.99.1
    fqdn: gw-rfc99-mkccr2004-16g.rfc1918.host
    serial_console: /dev/ttyUSB2
    interfaces:
      - name: ether1
        type: 1000base-t
        purpose: unassigned
        mac_address: d0:ea:11:4e:bd:59
      - name: ether2
        type: 1000base-t
        purpose: unassigned
        mac_address: d0:ea:11:4e:bd:5a
      - name: ether3
        type: 1000base-t
        purpose: unassigned
        mac_address: d0:ea:11:4e:bd:5b
