      - name: ether14
        type: 1000base-t
        purpose: unassigned
        mac_address: d0:ea:11:4e:bd:66
      - name: ether15
        type: 1000base-t
        purpose: factory-default-management
        mac_address: d0:ea:11:4e:bd:67
      - name: ether16
        type: 1000base-t
        purpose: unassigned
        mac_address: d0:ea:11:4e:bd:68
      - name: sfp-sfpplus1
        type: 10gbase-x-sfpp
        purpose: unassigned
        mac_address: d0:ea:11:4e:bd:69
      - name: sfp-sfpplus2
        type: 10gbase-x-sfpp
        purpose: unassigned
        mac_address: d0:ea:11:4e:bd:6a
    notes:
      - Planned rackable RouterOS replacement for gw_rfc99_mkcrs309.
      - Observed board-name is CCR2004-16G-2S+ on RouterOS 7.19.6, arm64, 4 cores, 4096 MiB RAM.
      - Factory default IP is 192.168.88.1/24 on ether15; management IP is intentionally unassigned until management-only bootstrap is applied.
      - Admin bootstrap credential is stored in Ansible Vault as vault_rfc99_ccr2004_16g_admin_password.
      - Serial discovery archive is stored outside the repo under /root/operator-private/routeros/ccr2004-16g.
  - name: gw_rfc99_att_bgw320
    site: rfc99
    role: provider-wan-router
    manufacturer: HUMAX
    model: BGW320-500
    status: active
    management_ip: 192.168.1.254
    management_interface: lan
    fqdn: gw-xgs-pon-att5ge.rfc1918.io
    interfaces:
      - name: lan
        type: 10gbase-t
        purpose: provider-lan-ip-passthrough
        mac_address: ec:c3:02:f2:a1:50
    notes:
      - Fiber WAN router public IP is 99.7.56.156.
      - IP passthrough mode is DHCPS-fixed.
      - Packet filter blocks IPv6 WAN ingress and LAN egress.
  - name: sw_rfc99_xgs1250_pri
    site: rfc99
    role: administrative-switch
    manufacturer: Zyxel
    model: XGS1250-12
    status: active
    management_ip: 172.16.99.250
    fqdn: sw-xgs-1250-pri.rfc1918.io
    interfaces:
