    site: fmt2
    role: border-switch
    manufacturer: Aruba
    model: 2530-24G
    status: planned
    management_ip: 172.18.20.5
    notes:
      - Imported from legacy SFO-200 switch access reference.
  - name: sw-ipmi-sfo200-ein-2004
    site: fmt2
    role: oob-switch
    manufacturer: Aruba
    model: 2530-24G
    status: planned
    management_ip: 172.18.20.4
    notes:
      - Imported from legacy SFO-200 switch access reference.
  - name: sw-sfo200-7060cx32s-2010
    site: fmt2
    role: data-center-switch
    manufacturer: Arista
    model: DCS-7060CX-32S
    status: planned
    management_ip: 172.18.20.10
    notes:
      - Legacy record used 172.16.40.10; live FMT2 access on 2026-05-19 reached HTTPS/eAPI at 172.18.20.10:443.
      - SSH on 22/tcp is restricted by mgmt-acl. Permitted live sources include CheckMK 10.200.99.27 and Prometheus 10.200.99.46; M70 172.16.99.70 and NASA 10.200.99.18 are not permitted.
      - M70 alias 7060 reaches SSH read-only by ProxyJump through CheckMK using the verwalterin.vernetzen.id_rsa key.
      - Access user should be verwalterin, not root. Typo alias sw-sfo200-7060cx32s-2010.vernetzezn.io should resolve to this device to avoid root fallback from unmatched SSH config.
      - Live Management1 state on 2026-05-19 was 172.18.20.10/24 by DHCP with default route through 172.18.20.1.
      - Provides the 2x50GbE ConnectX-4 RDMA/RoCEv2 fabric for the R630 HCI hosts; snapshot configuration before any MTU/PFC/ECN/LACP change.
  - name: gw-sfo200-pri
    site: fmt2
    role: ha-wan-router
    manufacturer: Dell
    model: PowerEdge R630
    status: planned
    management_ip: 10.200.99.2
    serial: 86WS282
    interfaces:
      - name: wan-igb0
        mac: e4:43:4b:5e:67:30
      - name: idrac
        mac: 64:00:6A:C1:EC:D4
    notes:
      - WAN address 66.160.146.146/28; public gateway 66.160.146.145.
  - name: gw-sfo200-sec
    site: fmt2
    role: ha-wan-router
    manufacturer: Dell
    model: PowerEdge R630
    status: planned
    management_ip: 10.200.99.3
    serial: 86XL282
    interfaces:
      - name: wan-igb0
        mac: e4:43:4b:56:2b:90
      - name: idrac
        mac: 64:00:6A:C1:F3:C8
    notes:
      - WAN address 66.160.146.147/28; public gateway 66.160.146.145.
  - name: kvm-sfo200-pri-9922
    site: fmt2
    role: virtualization-host
    manufacturer: Dell
    model: PowerEdge R630
    status: planned
    management_ip: 10.200.99.22
    serial: 162DDH2
    interfaces:
      - name: mgmt
        mac: 24:6e:96:42:65:d2
      - name: idrac
        mac: 84:7b:eb:f3:a9:2e
  - name: kvm-sfo200-sec-9923
    site: fmt2
    role: virtualization-host
    manufacturer: Dell
    model: PowerEdge R630
    status: planned
    management_ip: 10.200.99.23
    serial: 7Q25CH2
    interfaces:
      - name: mgmt
        mac: 24:6e:96:42:83:b2
      - name: idrac
        mac: 84:7b:eb:d8:f3:c6
    notes:
      - Intended NIC policy is eno1+eno2 for host-management LACP, eno3+eno4 for VM front-end LACP/OVS/SR-IOV, and enp130s0f0np0+enp130s0f1np1 for 2x50GbE RDMA/RoCEv2.
      - Live 2026-05-19 discovery showed X710 ports up at 10G with 32 SR-IOV VFs per port, ConnectX-4 ports up at 50G with RDMA ACTIVE, and ConnectX SR-IOV VFs not exposed.
      - Live 2026-05-19 discovery showed ofed_info absent and mlx5 modules loaded from the kernel tree; production RDMA admission requires vendor OFED/DOCA driver validation.
      - ConnectX MACs reported as 00:00:00:00:12:34 and 00:00:00:00:12:35; fix or explain firmware state before using those MACs in IPAM, DHCP, ACL, or switch automation.
  - name: kvm-sfo200-ter-9924
    site: fmt2
    role: virtualization-host
    manufacturer: Dell
    model: PowerEdge R630
    status: planned
    management_ip: 10.200.99.24
    serial: JK9SDB2
    interfaces:
      - name: mgmt
        mac: 24:6e:96:38:0a:d8
      - name: idrac
        mac: 64:00:6a:c3:82:2a
    notes:
      - Storage-preserving FMT2 rebuild anchor. Existing ZFS pool dstore is used for VM images, zvols, backups, staging, ISO caches, and provisioning artifacts.
      - OS RAID1 SATA SSDs are OS-only and must not be used for VM or backup payloads.
      - Intended NIC policy is eno1+eno2 for host-management LACP, eno3+eno4 for VM front-end LACP/OVS/SR-IOV, and enp130s0f0np0+enp130s0f1np1 for 2x50GbE RDMA/RoCEv2.
      - Live 2026-05-19 discovery showed X710 ports up at 10G, ConnectX-4 ports up at 50G, and RDMA ACTIVE on mlx5_0/mlx5_1; X710 and ConnectX SR-IOV VFs were not exposed on the temporary Rocky install.
      - Live 2026-05-19 discovery showed ofed_info absent and mlx5 modules loaded from the kernel tree; production RDMA admission requires vendor OFED/DOCA driver validation.
  - name: kvm-sfo200-nasa-9918
    site: fmt2
