    manufacturer: Dell
    model: PowerEdge R730xd
    status: planned
    management_ip: 10.200.99.18
    serial: H6XBRD2
    interfaces:
      - name: mgmt
        mac: e4:43:4b:16:e9:c4
      - name: idrac
        mac: 18:66:da:67:18:d9
  - name: tty-console-sfo200-ein-2011
    site: fmt2
    role: serial-console
    manufacturer: Digi
    model: console-server
    status: planned
    notes:
      - Legacy references identify this as the SFO-200 IP-access serial console path.
  - name: vpn_rfc99_fmt2_openvpn_bridge
    site: fmt2
    role: vpn-bridge-vm
    manufacturer: Generic
    model: openvpn-compatibility-vm
    status: planned
    notes:
      - RouterOS OpenVPN does not support the current static-key AES-256-CBC/SHA512/LZ4-v2 tunnel profile.
      - Build a compatibility VPN VM and route RFC99/SUN99 to FMT2 through it.

