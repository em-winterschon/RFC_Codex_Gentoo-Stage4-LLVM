---
gentoo_profile_definition:
  package_list_files:
    - profile-package-lists/stage5-base-minimal-nox.packages
    - profile-package-lists/stage5-base-hypervisor-common.packages
    - profile-package-lists/stage5-base-hypervisor-xen.packages
    - profile-package-lists/stage5-base-hypervisor-qemu-libvirt.packages
  make_conf_append: |
    QEMU_SOFTMMU_TARGETS="x86_64 aarch64"
    QEMU_USER_TARGETS="x86_64 aarch64"
    USE="${USE} aio curl gnutls infiniband iscsi numa python sasl seccomp ssl vhost-net virtfs xen zfs"
  package_use_files:
    20-hypervisor-xen-qemu-libvirt: |
      app-emulation/qemu aio curl gnutls iscsi ncurses numa pin-upstream-blobs ssh vhost-net virtfs xen
      app-emulation/libvirt libvirtd lvm numa parted qemu virt-network xen zfs
      app-emulation/xen uefi
      app-emulation/xen-tools hvm ipxe ovmf qemu system-ipxe system-qemu
      media-libs/netpbm png
      net-dns/dnsmasq script
      net-libs/gnutls pkcs11 tools
      net-misc/openvswitch modules ssl
      sys-cluster/rdma-core -python
      sys-block/parted device-mapper
      sys-block/open-iscsi rdma
      sys-apps/util-linux caps
      sys-fs/lvm2 lvm
      sys-fs/zfs rootfs
  package_accept_keywords_files:
    20-hypervisor-xen-qemu-libvirt-testing: |
      =net-misc/openvswitch-3.3.8-r1 ~amd64
      =dev-python/ovs-3.3.8 ~amd64
      =sys-fs/zfs-2.4.1 ~amd64
      =sys-fs/zfs-kmod-2.4.0_rc2-r1 ~amd64
  modules_load_files:
    base-hypervisor-xen-qemu-libvirt.conf: |
      ib_uverbs
      kvm
      kvm_amd
      kvm_intel
      mlx5_core
      mlx5_ib
      nvme
      nvme-fabrics
      nvme-rdma
      openvswitch
      qede
      vhost_net
      xen-evtchn
      xen-gntdev
      zfs
  openrc_services_enable:
    - chronyd
    - libvirtd
    - openvswitch
    - rsyslog
    - sshd
    - xenconsoled
    - xendomains
    - xenstored
