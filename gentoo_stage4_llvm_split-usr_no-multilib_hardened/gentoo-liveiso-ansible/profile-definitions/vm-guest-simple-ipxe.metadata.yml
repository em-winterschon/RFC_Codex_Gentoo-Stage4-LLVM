---
gentoo_system_profile_metadata:
  id: vm-guest-simple-ipxe
  purpose: Minimal Gentoo VM guest profile for validating the iPXE Path B provisioning workflow.
  package_pins:
    gentoo_tree_exact_atoms:
      - =app-emulation/cloud-init-25.1
      - =app-emulation/qemu-guest-agent-9.2.0
    support_packages:
      - sys-apps/ethtool
  kernel_modules:
    - virtio_blk
    - virtio_net
    - virtio_pci
  cloud_init:
    datasource: NoCloud
    enabled_by_profile: true
    notes: Intended for throwaway validation VMs rather than long-lived application instances.
  source_references:
    - https://packages.gentoo.org/packages/app-emulation/cloud-init
    - https://packages.gentoo.org/packages/app-emulation/qemu-guest-agent
