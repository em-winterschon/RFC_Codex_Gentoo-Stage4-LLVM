---
gentoo_profile_definition:
  container_app_profiles:
    redfish_exporter:
      enabled: false
      image: docker.io/sapcc/redfish-exporter:latest
      network: mgmt
      ip_address: 10.77.0.51
      published_ports:
        - 9220:9220/tcp
      listen_port: 9220
      username: monitor
      password: change-me
      timeout: 40
      job: redfish-stage5
  haproxy_service_types:
    - name: redfish-exporter-http
      bind: "*:9220"
      mode: http
      backend_name: be_redfish_exporter_http
      servers:
        - name: redfish-exporter
          address: 10.77.0.51
          port: 9220
