---
gentoo_profile_definition:
  package_list_files:
    - profile-package-lists/stage5-virtual-host-kibana-interface.packages
  kibana:
    enabled: true
    install_method: upstream_tarball
    version: "9.3.1"
    tarball_url: https://artifacts.elastic.co/downloads/kibana/kibana-9.3.1-linux-x86_64.tar.gz
    tarball_sha512: abe6628dd58cbd2f878d0d158aa9e93c415cf6a39b5812adb8ac9dcfe6b8ec610fd0e802b75a8398c50b243a732aa53547ae253d6bd1a6f579c51c2ffef0499a
    install_root: /opt/kibana
    service_user: kibana
    timezone: UTC
    node_options: --max-old-space-size=2048
    server_host: 0.0.0.0
    server_port: 5601
    elasticsearch_hosts:
      - http://elastic-vip.example.internal:9200
    data_views:
      - id: stage5-syslog
        title: stage5-syslog*
        name: Stage5 Syslog
        time_field: "@timestamp"
  rsyslog:
    enabled: true
    forward_enabled: true
    forward_hostname: log-sun99-rsyslog.rfc1918.host
    forward_protocol: tcp
    forward_port: 6514
  haproxy_service_types:
    - name: kibana-http
      bind: "*:5601"
      mode: http
      backend_name: be_kibana_http
      servers:
        - name: kibana
          address: 127.0.0.1
          port: 5601
