---
gentoo_system_profile_metadata:
  id: hardened-llvm-stage4-split-usr
  purpose: Split-usr Stage4 baseline for metal and compatibility-sensitive VM installs.
  profile_taxonomy:
    stage: stage4
    role_class: base-system
    role_name: llvm-clang-hardened-split-usr
    usr_layout: split-usr
  base_profile:
    intended_overlay_on:
      - gentoo:default/linux/amd64/23.0/llvm
      - gentoo:default/linux/amd64/23.0/split-usr/no-multilib/hardened
  package_pins:
    tracked_atoms:
      - sys-apps/baselayout
      - sys-apps/openrc
      - sys-devel/clang
      - sys-devel/llvm
    upstream_profile: gentoo:default/linux/amd64/23.0/split-usr/no-multilib/hardened
    usr_layout: split-usr
