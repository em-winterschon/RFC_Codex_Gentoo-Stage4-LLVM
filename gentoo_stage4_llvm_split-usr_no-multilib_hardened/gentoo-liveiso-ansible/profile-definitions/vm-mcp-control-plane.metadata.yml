---
gentoo_system_profile_metadata:
  id: vm-mcp-control-plane
  purpose: Stage5 virtual-host profile for MCP-enabled infrastructure services behind HAProxy plus MCP server admission registry and promotion policy.
  profile_taxonomy:
    stage: stage5
    role_class: virtual-host
    role_name: mcp-control-plane
    package_layers:
      - profile-package-lists/stage5-virtual-host-base.packages
      - profile-package-lists/cloud-init-base.packages
      - profile-package-lists/stage5-virtual-host-container-services.packages
      - profile-package-lists/stage5-virtual-host-mcp-control-plane.packages
  base_profile:
    intended_overlay_on:
      - llvm-clang-openrc-stage3
      - vm-guest-simple-ipxe
      - cloud-init-vm
  app_profiles:
    - nginx_ui
    - mcp_generic
    - haproxy
  package_pins:
    tracked_atoms:
      - app-containers/podman
      - app-containers/netavark
      - app-containers/aardvark-dns
      - net-proxy/haproxy
      - net-firewall/nftables
      - dev-python/pyyaml
      - dev-python/requests
      - net-misc/curl
      - dev-vcs/git
    upstream_images:
      - name: nginx-ui
        image: docker.io/uozi/nginx-ui:latest
        pin_status: floating-until-live-validation
    pin_gaps:
      - The Nginx-UI upstream image must be digest-pinned before live production use.
      - The generic MCP backend has no selected image yet and remains disabled by default.
  security_notes:
    - Nginx-UI MCP access is privileged tooling and must remain LAN-only until RBAC and private CA validation are complete.
    - Docker socket mounting is disabled by default; enable it only through a separate mutation-gated change.
    - Node, OpenAI, JWT, and crypto secrets are referenced through Ansible Vault variables only.
  deployment_notes:
    - The MCP admission registry implementation is render-only and does not install third-party MCP services.
    - Default mode is read-only; write-capable integrations require explicit change-control promotion.
    - Secrets are referenced by Ansible Vault variable name only and must not be rendered into repo-managed docs.
  source_references:
    - https://nginxui.com/guide/mcp
    - https://nginxui.com/guide/config-openai.html
    - https://nginxui.com/guide/env
