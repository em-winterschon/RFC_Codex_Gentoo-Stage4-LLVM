---
gentoo_profile_definition:
  package_list_files:
    - profile-package-lists/stage5-virtual-host-jenkins-controller.packages
  jenkins_controller:
    enabled: true
    home: /var/lib/jenkins
    webroot: /var/cache/jenkins/war
    http_port: 8080
    http_listen_address: 0.0.0.0
    prefix: /
    agent_port: 50000
    service_user: jenkins
    service_group: jenkins
    url: http://jenkins.example.invalid:8080/
    admin_email: ci-admin@example.invalid
    executors: 0
    plugin_catalog:
      - configuration-as-code
      - git
      - github
      - credentials
      - ssh-slaves
      - workflow-aggregator
      - job-dsl
      - matrix-auth
      - ws-cleanup
      - antisamy-markup-formatter
    folders:
      - name: stage4
        description: Stage4 and Stage5 build pipelines.
      - name: containers
        description: Container image and GHCR publication pipelines.
      - name: binpkgs
        description: Binpkg rebuild and package-host publication pipelines.
    job_seed_manifests:
      - id: rfc1918-infra-control-plane
        description: Repo-safe seed contract for CA packages, SLURM builds, DistCC, Nexus publication, and DNS propagation.
        source_workflow: docs/workflows/rfc1918-infra-control-plane.json
        issue_refs:
          - 216
          - 217
          - 218
          - 220
        jobs:
          - name: stage4-stage5-build-via-slurm
            folder: stage4
            scheduler: slurm
            slurm_submit_wrapper: scripts/slurm-submit-ansible-playbook.sh
            distcc_manifest: /var/lib/jenkins/builder-farm/builder-farm.json
            command: scripts/run-container-base-build-pathb.sh --dry-run
          - name: rfc99-atlasforge-ca-certs-gentoo
            folder: binpkgs
            package_atom: app-misc/rfc99-atlasforge-ca-certs
            repository: rfc99-atlasforge-gentoo
            publish_target: nexus://rfc99-gentoo-overlay
            command: scripts/build-rfc1918-ca-packages.sh --format gentoo --dry-run
          - name: rfc99-atlasforge-ca-certs-rpm
            folder: binpkgs
            package_name: rfc99-atlasforge-ca-certs
            repository: rfc99-atlasforge-rpm
            publish_target: nexus://rfc99-yum-hosted
            command: scripts/build-rfc1918-ca-packages.sh --format rpm --dry-run
          - name: netbox-dns-propagation-plan
            folder: stage4
            source_of_truth: netbox
            public_dns: hetzner
            local_dns: coredns
            command: ansible-playbook -i inventories/local-network/hosts.yml playbooks/hetzner-dns-plan-from-netbox.yml --check
  distcc_farm:
    enabled: true
    client_enabled: true
    worker_enabled: false
    builder_fabric_name: bluefield-builder-fabric
  haproxy_service_types:
    - name: jenkins-http
      bind: "*:8080"
      mode: http
      backend_name: be_jenkins_http
      servers:
        - name: jenkins-controller
          address: 127.0.0.1
          port: 8080
    - name: jenkins-agent-tcp
      bind: "*:50000"
      mode: tcp
      backend_name: be_jenkins_agent_tcp
      servers:
        - name: jenkins-controller
          address: 127.0.0.1
          port: 50000
