---
gentoo_profile_definition:
  package_list_files:
    - profile-package-lists/stage5-domain-client.packages
  package_use_files:
    30-aaa-domain-client-sssd: |
      dev-libs/cyrus-sasl kerberos
      net-dns/bind gssapi
      net-libs/ngtcp2 gnutls
      net-fs/samba winbind
      net-nds/openldap experimental sasl
      sys-auth/sssd samba
  aaa_policy_files:
    - aaa-policy-definitions/site-baseline.yml
  # SSSD is enabled by the FreeIPA enrollment apply path after it writes
  # /etc/sssd/sssd.conf. Enabling it in the base profile makes pre-enrollment
  # hosts boot with a known-bad service.
  ipa_client:
    enabled: true
    domain_join_mode: manual
    mkhomedir: true
    cache_credentials: true
    configure_krb5: true
    configure_sssd: true
    ssh_trust_ipa_keys: true
    access_provider: ipa
    hbac_provider: ipa
    sudo_provider: ipa
