---
gentoo_profile_definition:
  package_list_files:
    - profile-package-lists/stage5-virtual-host-binpkg-repository.packages
  binpkg_repo:
    enabled: true
    repository_root: /srv/stage5-binpkgs
    repo_id: stage4-hardened-llvm-merged_usr__stage5-service_container-gentoo_stage4_llvm_clang_hardened__amd64__x86_64_v2_generic
    listen_address: 0.0.0.0
    listen_port: 8088
    server_name: binpkgs.example.internal
    autoindex: true
    runlevel: default
  openrc_services_enable:
    - nginx
