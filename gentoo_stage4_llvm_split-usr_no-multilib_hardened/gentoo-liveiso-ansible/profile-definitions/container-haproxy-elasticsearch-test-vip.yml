---
gentoo_profile_definition:
  container_app_profiles:
    haproxy:
      published_ports:
        - 80:80/tcp
        - 443:443/tcp
        - 6514:6514/tcp
        - 9200:9200/tcp
  haproxy_service_types:
    - name: elasticsearch-test-http
      bind: "*:9200"
      mode: http
      backend_name: be_elasticsearch_test_http
      servers:
        - name: elasticsearch-test
          address: 10.9.8.91
          port: 9200
  service_readiness:
    enabled: true
    checks:
      - name: elasticsearch-test-vip-http
        target: 172.16.99.92
        port: 9200
        protocol: tcp
        retries: 24
        delay: 5
