---
gentoo_profile_definition:
  package_list_files:
    - profile-package-lists/stage5-base-minimal-nox.packages
    - profile-package-lists/stage5-virt-minimal.packages
  make_conf_append: |
    USE="${USE} -X -gtk -pulseaudio -qt5 -qt6 -sdl -spice -wayland"
  modules_load_files:
    virt-minimal.conf: |
      virtio_blk
      virtio_net
      virtio_pci
  openrc_services_enable:
    - chronyd
    - qemu-guest-agent
    - rsyslog
    - sshd
