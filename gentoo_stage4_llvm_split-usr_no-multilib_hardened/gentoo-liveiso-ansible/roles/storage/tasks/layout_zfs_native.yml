---
- name: Build root vdev specification for native ZFS
  ansible.builtin.set_fact:
    zpool_root_vdev_spec: >-
      {% if storage_layout == 'single-drive' %}
      {{ root_partitions | join(' ') }}
      {% elif storage_layout in ['zfs-mirror', 'zfs-boot-root-mirror'] %}
      mirror {{ root_partitions | join(' ') }}
      {% elif storage_layout == 'zraid1' %}
      raidz1 {{ root_partitions | join(' ') }}
      {% elif storage_layout == 'zraid2' %}
      raidz2 {{ root_partitions | join(' ') }}
      {% elif storage_layout == 'zraid3' %}
      raidz3 {{ root_partitions | join(' ') }}
      {% elif storage_layout == 'draid' and (draid_vdev_spec_override | default('')) | length > 0 %}
      {{ draid_vdev_spec_override }}
      {% elif storage_layout == 'draid' %}
      draid{{ draid_parity }}:{{ (root_partitions | length - draid_parity) | int }}d:1s:{{ root_partitions | length }}c {{ root_partitions | join(' ') }}
      {% else %}
      {{ root_partitions | join(' ') }}
      {% endif %}

- name: Build boot pool vdev specification for split boot/root native ZFS
  ansible.builtin.set_fact:
    zpool_boot_vdev_spec: "mirror {{ boot_pool_partitions | join(' ') }}"
  when: storage_layout == 'zfs-boot-root-mirror'

- name: Create swap on the first swap partition only
  ansible.builtin.command: "mkswap {{ swap_partitions[0] }}"
  when: swap_partitions | length > 0

- name: Enable swap on the first swap partition
  ansible.builtin.command: "swapon {{ swap_partitions[0] }}"
  when: swap_partitions | length > 0

- name: Generate hostid for root-on-ZFS
  ansible.builtin.command: "zgenhostid -f"

- name: Create native ZFS boot pool
  ansible.builtin.shell: |
    set -euo pipefail
    zpool create -f \
      -R {{ install_target_root }} \
      -o ashift={{ zfs_boot_pool_properties.ashift }} \
      -o autotrim={{ zfs_boot_pool_properties.autotrim }} \
      -o compatibility={{ zfs_boot_pool_properties.compatibility }} \
      -O acltype={{ zfs_boot_fs_properties.acltype }} \
      -O compression={{ zfs_boot_fs_properties.compression }} \
      -O dnodesize={{ zfs_boot_fs_properties.dnodesize }} \
      -O relatime={{ zfs_boot_fs_properties.relatime }} \
      -O xattr={{ zfs_boot_fs_properties.xattr }} \
      -O mountpoint={{ zfs_boot_fs_properties.mountpoint }} \
      -m none \
      {{ zfs_boot_pool_name }} {{ zpool_boot_vdev_spec }}
  args:
    executable: /bin/bash
  when: storage_layout == 'zfs-boot-root-mirror'

- name: Create native ZFS root pool
  ansible.builtin.shell: |
    set -euo pipefail
    zpool create -f \
      -R {{ install_target_root }} \
      -o ashift={{ zfs_pool_properties.ashift }} \
      -o autotrim={{ zfs_pool_properties.autotrim }} \
      -o compatibility={{ zfs_pool_properties.compatibility }} \
      -O acltype={{ zfs_fs_properties.acltype }} \
      -O compression={{ zfs_fs_properties.compression }} \
      -O dnodesize={{ zfs_fs_properties.dnodesize }} \
      -O relatime={{ zfs_fs_properties.relatime }} \
      -O xattr={{ zfs_fs_properties.xattr }} \
      -O mountpoint={{ zfs_fs_properties.mountpoint }} \
      -m none \
      {{ zpool_name }} {{ zpool_root_vdev_spec }}
  args:
    executable: /bin/bash

- name: Create base ZFS boot datasets
  ansible.builtin.shell: |
    set -euo pipefail
    zfs create {{ item.extra }} {{ item.name }}
  loop: "{{ zfs_boot_datasets }}"
  args:
    executable: /bin/bash
  when: storage_layout == 'zfs-boot-root-mirror'

- name: Create base ZFS datasets
  ansible.builtin.shell: |
    set -euo pipefail
    zfs create {{ item.extra }} {{ item.name }}
  loop: "{{ zfs_root_datasets }}"
  args:
    executable: /bin/bash

- name: Ensure root dataset contains mountpoint stubs for child ZFS datasets
  ansible.builtin.shell: |
    set -euo pipefail
    zfs list -H -o name,canmount -r {{ zpool_name }} | while IFS=$'\t' read -r dataset canmount; do
      mountpoint="$(zfs get -H -o value mountpoint "${dataset}")"
      [[ "${dataset}" != "{{ zpool_name }}/ROOT/gentoo" ]] || continue
      [[ "${mountpoint}" != "none" && "${mountpoint}" != "legacy" && "${mountpoint}" != "/" ]] || continue
      [[ "${canmount}" != "off" ]] || continue
      zfs unmount "${dataset}" >/dev/null 2>&1 || true
      mkdir -p "{{ install_target_root }}${mountpoint}"
    done
    zfs mount -a
  args:
    executable: /bin/bash

- name: Set bootfs on root pool
  ansible.builtin.command: "zpool set bootfs={{ zpool_name }}/ROOT/gentoo {{ zpool_name }}"

- name: Mount root dataset
  ansible.builtin.shell: |
    set -euo pipefail
    if [[ "$(zfs get -H -o value mounted {{ zpool_name }}/ROOT/gentoo)" == 'yes' ]]; then
      exit 0
    fi
    zfs mount {{ zpool_name }}/ROOT/gentoo
    echo mounted
  args:
    executable: /bin/bash
  register: root_dataset_mount_result
  changed_when: "'mounted' in root_dataset_mount_result.stdout"

- name: Mount target child ZFS datasets after root dataset
  ansible.builtin.command: "zfs mount -a"
  changed_when: false

- name: Ensure target /etc exists for root-on-ZFS hostid
  ansible.builtin.file:
    path: "{{ install_target_root }}/etc"
    state: directory
    mode: '0755'

- name: Preserve provisioning hostid for target root-on-ZFS imports
  ansible.builtin.copy:
    src: /etc/hostid
    dest: "{{ install_target_root }}/etc/hostid"
    remote_src: true
    mode: '0644'

- name: Mount boot dataset for split boot/root ZFS
  ansible.builtin.shell: |
    set -euo pipefail
    if [[ "$(zfs get -H -o value mounted {{ zfs_boot_pool_name }}/BOOT/gentoo)" == 'yes' ]]; then
      exit 0
    fi
    zfs mount {{ zfs_boot_pool_name }}/BOOT/gentoo
    echo mounted
  args:
    executable: /bin/bash
  register: boot_dataset_mount_result
  changed_when: "'mounted' in boot_dataset_mount_result.stdout"
  when: storage_layout == 'zfs-boot-root-mirror'

- name: Create EFI mountpoint in target root
  ansible.builtin.file:
    path: "{{ install_target_root }}/efi"
    state: directory
    mode: '0755'

- name: Mount first EFI partition
  ansible.builtin.shell: |
    set -euo pipefail
    if mountpoint -q "{{ install_target_root }}/efi"; then
      exit 0
    fi
    mount -t vfat -o defaults,noatime "{{ esp_partitions[0] }}" "{{ install_target_root }}/efi"
    echo mounted
  args:
    executable: /bin/bash
  register: efi_mount_result
  changed_when: "'mounted' in efi_mount_result.stdout"
