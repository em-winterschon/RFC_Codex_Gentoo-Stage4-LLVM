---
- name: Resolve generic MCP container application profile
  ansible.builtin.set_fact:
    container_mcp_generic_profile: "{{ resolved_profile_container_app_profiles.mcp_generic | default({}) }}"
    container_services_enabled: "{{ resolved_profile_container_services.enabled | default(false) | bool }}"

- name: Assert generic MCP image is set when enabled
  ansible.builtin.assert:
    that:
      - container_mcp_generic_profile.image is defined
      - container_mcp_generic_profile.image | length > 0
    fail_msg: "container_app_profiles.mcp_generic.image must be set when mcp_generic is enabled."
  when:
    - container_services_enabled
    - container_mcp_generic_profile.enabled | default(false) | bool

- name: Register generic MCP runtime application
  ansible.builtin.set_fact:
    container_runtime_applications: >-
      {{
        (container_runtime_applications | default([]))
        + [
            {
              'name': container_mcp_generic_profile.name | default(container_mcp_generic_default_name),
              'description': container_mcp_generic_profile.description | default('Generic HTTP/SSE MCP server'),
              'image': container_mcp_generic_profile.image,
              'pull_policy': container_mcp_generic_profile.pull_policy | default('missing'),
              'network': container_mcp_generic_profile.network | default('apps'),
              'ip_address': container_mcp_generic_profile.ip_address | default(''),
              'backend_port': container_mcp_generic_profile.backend_port | default(3000),
              'hostnames': container_mcp_generic_profile.hostnames | default(['mcp-generic.local']),
              'published_ports': container_mcp_generic_profile.published_ports | default([]),
              'cap_add': container_mcp_generic_profile.cap_add | default([]),
              'environment': (
                {
                  'MCP_SERVER_TRANSPORT': container_mcp_generic_profile.transport | default('sse'),
                  'MCP_SERVER_BIND': '0.0.0.0',
                  'MCP_SERVER_PORT': (container_mcp_generic_profile.backend_port | default(3000) | string)
                }
                | combine(container_mcp_generic_profile.env | default({}))
              ),
              'tmpfs': container_mcp_generic_profile.tmpfs | default(['/tmp:rw,noexec,nosuid,size=64m', '/run:rw,noexec,nosuid,size=16m']),
              'volumes': container_mcp_generic_profile.volumes | default([]),
              'command': container_mcp_generic_profile.command | default([]),
              'enabled': true
            }
          ]
      }}
  when:
    - container_services_enabled
    - container_mcp_generic_profile.enabled | default(false) | bool
