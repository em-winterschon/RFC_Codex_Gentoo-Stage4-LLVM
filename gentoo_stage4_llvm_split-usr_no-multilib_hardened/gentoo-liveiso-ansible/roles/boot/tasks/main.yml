---
- name: Resolve EFI partition device paths by GPT PARTLABEL when needed
  ansible.builtin.shell: |
    set -euo pipefail
    for n in $(seq 1 {{ (storage_layout == 'zfs-boot-root-mirror') | ternary(zfs_boot_pool_devices | length, storage_devices | length) }}); do
      blkid -t PARTLABEL="EFI_SYSTEM_${n}" -o device
    done
  args:
    executable: /bin/bash
  register: boot_esp_partition_lookup
  changed_when: false
  when: esp_partitions is not defined

- name: Cache EFI partition paths for the boot role
  ansible.builtin.set_fact:
    esp_partitions: "{{ boot_esp_partition_lookup.stdout_lines }}"
  when: esp_partitions is not defined

- name: Resolve swap partition device paths by GPT PARTLABEL when needed
  ansible.builtin.shell: |
    set -euo pipefail
    for n in $(seq 1 {{ (storage_layout == 'zfs-boot-root-mirror') | ternary(zfs_root_pool_devices | length, storage_devices | length) }}); do
      blkid -t PARTLABEL="SWAP_${n}" -o device
    done
  args:
    executable: /bin/bash
  register: boot_swap_partition_lookup
  changed_when: false
  when: swap_partitions is not defined

- name: Cache swap partition paths for the boot role
  ansible.builtin.set_fact:
    swap_partitions: "{{ boot_swap_partition_lookup.stdout_lines }}"
  when: swap_partitions is not defined

- name: Assert that boot partitions were resolved
  ansible.builtin.assert:
    that:
      - esp_partitions | length > 0
      - swap_partitions is defined
    fail_msg: Boot role could not resolve EFI or swap partitions. Run the storage role first or provision matching GPT labels.

- name: Write fstab for EFI and swap
  ansible.builtin.template:
    src: fstab.j2
    dest: "{{ install_target_root }}/etc/fstab"
    mode: '0644'

- name: Configure OpenRC ZFS services
  ansible.builtin.command: >-
    {{ liveiso_work_dir }}/chroot-runner.sh
    {{ boot_service_command | quote }}
  loop:
    - rc-update add zfs-import sysinit
    - rc-update add zfs-mount sysinit
    - rc-update add zfs-zed default
  loop_control:
    loop_var: boot_service_command

- name: Ensure target ZFS cache directory exists
  ansible.builtin.file:
    path: "{{ install_target_root }}/etc/zfs"
    state: directory
    mode: '0755'
  when: boot_strategy == 'zfsbootmenu'

- name: Ensure target /etc exists for ZFS host identity
  ansible.builtin.file:
    path: "{{ install_target_root }}/etc"
    state: directory
    mode: '0755'
  when: boot_strategy == 'zfsbootmenu'

- name: Generate target hostid for root-on-ZFS imports
  ansible.builtin.command: >-
    {{ liveiso_work_dir }}/chroot-runner.sh
    {{ 'zgenhostid -f' | quote }}
  args:
    creates: "{{ install_target_root }}/etc/hostid"
  when: boot_strategy == 'zfsbootmenu'

- name: Ensure target dracut config directory exists
  ansible.builtin.file:
    path: "{{ install_target_root }}/etc/dracut.conf.d"
    state: directory
    mode: '0755'
  when: boot_strategy == 'zfsbootmenu'

- name: Force dracut to carry /etc/hostid into the initramfs
  ansible.builtin.copy:
    dest: "{{ install_target_root }}/etc/dracut.conf.d/90-zfs-hostid.conf"
    content: |
      install_items+=" /etc/hostid "
    mode: '0644'
  when: boot_strategy == 'zfsbootmenu'

- name: Resolve target ZFS hostid for dracut-compatible kernel command line
  ansible.builtin.shell: |
    set -euo pipefail
    od -An -tx4 "{{ install_target_root }}/etc/hostid" | tr -d ' \n'
  args:
    executable: /bin/bash
  register: boot_target_hostid
  changed_when: false
  when: boot_strategy == 'zfsbootmenu'

- name: Build effective ZFSBootMenu root command line
  ansible.builtin.set_fact:
    zfsbootmenu_root_commandline_effective: >-
      {{
        (
          zfsbootmenu_root_commandline
          ~ ' spl_hostid='
          ~ (boot_target_hostid.stdout | trim)
        )
        | regex_replace('\\s+', ' ')
        | trim
      }}
  when: boot_strategy == 'zfsbootmenu'

- name: Persist root pool in target zpool.cache
  ansible.builtin.command: >-
    zpool set cachefile={{ install_target_root }}/etc/zfs/zpool.cache {{ zpool_name }}
  when: boot_strategy == 'zfsbootmenu'

- name: Persist boot pool in target zpool.cache
  ansible.builtin.command: >-
    zpool set cachefile={{ install_target_root }}/etc/zfs/zpool.cache {{ zfs_boot_pool_name }}
  when:
    - boot_strategy == 'zfsbootmenu'
    - storage_layout == 'zfs-boot-root-mirror'

- name: Resolve installed kernel version for boot artifact generation
  ansible.builtin.shell: |
    set -euo pipefail
    kernel_version="$(
      find "{{ install_target_root }}/usr/lib/modules" \
        -mindepth 2 \
        -maxdepth 2 \
        \( -type f -o -xtype f \) \
        -name vmlinuz \
        -printf '%h\n' |
      xargs -r -n1 basename |
      sort -V |
      tail -n1
    )"
    test -n "${kernel_version}"
    printf '%s\n' "${kernel_version}"
  args:
    executable: /bin/bash
  register: boot_kernel_version
  changed_when: false
  when: boot_strategy == 'zfsbootmenu'

- name: Ensure dracut configuration directory exists
  ansible.builtin.file:
    path: "{{ install_target_root }}/etc/dracut.conf.d"
    state: directory
    mode: '0755'
  when: boot_strategy == 'zfsbootmenu'

- name: Force ZFS support into generated root initramfs
  ansible.builtin.copy:
    dest: "{{ install_target_root }}/etc/dracut.conf.d/90-zfs-root.conf"
    mode: '0644'
    content: |
      add_dracutmodules+=" zfs "
      force_drivers+=" zfs "
      install_items+=" /etc/zfs/zpool.cache "
  when: boot_strategy == 'zfsbootmenu'

- name: Check whether ZFS module exists for the selected target kernel
  ansible.builtin.stat:
    path: "{{ install_target_root }}/usr/lib/modules/{{ boot_kernel_version.stdout | trim }}/extra/zfs.ko"
  register: boot_target_zfs_module
  when: boot_strategy == 'zfsbootmenu'

- name: Rebuild ZFS kernel module against the selected target kernel when needed
  ansible.builtin.command: >-
    {{ liveiso_work_dir }}/chroot-runner.sh
    {{ 'KERNEL_DIR=/usr/src/linux emerge --oneshot --usepkg-exclude sys-fs/zfs-kmod sys-fs/zfs-kmod' | quote }}
  when:
    - boot_strategy == 'zfsbootmenu'
    - not (boot_target_zfs_module.stat.exists | default(false))

- name: Recheck ZFS module for the selected target kernel
  ansible.builtin.stat:
    path: "{{ install_target_root }}/usr/lib/modules/{{ boot_kernel_version.stdout | trim }}/extra/zfs.ko"
  register: boot_target_zfs_module_recheck
  when: boot_strategy == 'zfsbootmenu'

- name: Assert selected target kernel has a ZFS module
  ansible.builtin.assert:
    that:
      - boot_target_zfs_module_recheck.stat.exists | default(false)
    fail_msg: >-
      ZFS module is missing for {{ boot_kernel_version.stdout | trim }} after
      zfs-kmod rebuild. Refusing to generate a root-on-ZFS initramfs that cannot
      import the root pool.
  when: boot_strategy == 'zfsbootmenu'

- name: Materialize kernel and initramfs into /boot for ZFSBootMenu
  ansible.builtin.shell: |
    set -euo pipefail
    kernel_version="{{ boot_kernel_version.stdout | trim }}"
    cp -Lf "{{ install_target_root }}/usr/lib/modules/${kernel_version}/vmlinuz" "{{ install_target_root }}/boot/vmlinuz-${kernel_version}"
    {{ liveiso_work_dir }}/chroot-runner.sh {{ ('depmod -a ' + (boot_kernel_version.stdout | trim)) | quote }}
    {{ liveiso_work_dir }}/chroot-runner.sh {{ ('dracut --force --no-hostonly --early-microcode /boot/initramfs-' + (boot_kernel_version.stdout | trim) + '.img ' + (boot_kernel_version.stdout | trim)) | quote }}
  args:
    executable: /bin/bash
  when: boot_strategy == 'zfsbootmenu'

- name: Mirror boot artifacts into the root dataset for ZFSBootMenu discovery
  ansible.builtin.shell: |
    set -euo pipefail
    tmp_dir="{{ liveiso_work_dir }}/zfsbootmenu-root-boot"
    cleanup() {
      zfs mount {{ zfs_boot_pool_name }}/BOOT/gentoo >/dev/null 2>&1 || true
    }
    trap cleanup EXIT

    rm -rf "${tmp_dir}"
    mkdir -p "${tmp_dir}"
    cp -a "{{ install_target_root }}/boot/." "${tmp_dir}/"

    if mountpoint -q "{{ install_target_root }}/boot"; then
      umount -l "{{ install_target_root }}/boot" || true
    fi
    mkdir -p "{{ install_target_root }}/boot"
    find "{{ install_target_root }}/boot" -mindepth 1 -exec rm -rf {} +
    cp -a "${tmp_dir}/." "{{ install_target_root }}/boot/"

    trap - EXIT
    zfs mount {{ zfs_boot_pool_name }}/BOOT/gentoo || true
  args:
    executable: /bin/bash
  when:
    - boot_strategy == 'zfsbootmenu'
    - storage_layout == 'zfs-boot-root-mirror'

- name: Set inherited ZFSBootMenu kernel command line on the root dataset tree
  ansible.builtin.command: >-
    zfs set org.zfsbootmenu:commandline={{ zfsbootmenu_root_commandline_effective | quote }} {{ zpool_name }}/ROOT
  when: boot_strategy == 'zfsbootmenu'

- name: Set ZFSBootMenu kernel command line on the selected root dataset
  ansible.builtin.command: >-
    zfs set org.zfsbootmenu:commandline={{ zfsbootmenu_root_commandline_effective | quote }} {{ zpool_name }}/ROOT/gentoo
  when: boot_strategy == 'zfsbootmenu'

- name: Ensure the ZFSBootMenu EFI directory exists
  ansible.builtin.file:
    path: "{{ install_target_root }}{{ zfsbootmenu_efi_directory }}"
    state: directory
    mode: '0755'
  when: boot_strategy == 'zfsbootmenu'

- name: Ensure the EFI fallback directory exists for ZFSBootMenu
  ansible.builtin.file:
    path: "{{ install_target_root }}{{ zfsbootmenu_fallback_directory }}"
    state: directory
    mode: '0755'
  when: boot_strategy == 'zfsbootmenu'

- name: Check for existing ZFSBootMenu EFI executable
  ansible.builtin.stat:
    path: "{{ install_target_root }}{{ zfsbootmenu_efi_directory }}/{{ zfsbootmenu_efi_filename }}"
  register: zfsbootmenu_existing_efi
  when: boot_strategy == 'zfsbootmenu'

- name: Download prebuilt ZFSBootMenu EFI executable
  ansible.builtin.get_url:
    url: "{{ zfsbootmenu_efi_url }}"
    dest: "{{ install_target_root }}{{ zfsbootmenu_efi_directory }}/{{ zfsbootmenu_efi_filename }}"
    mode: '0755'
  when:
    - boot_strategy == 'zfsbootmenu'
    - zfsbootmenu_efi_refresh | bool or not (zfsbootmenu_existing_efi.stat.exists | default(false))

- name: Write ZFSBootMenu EFI fallback command line
  ansible.builtin.copy:
    dest: "{{ liveiso_work_dir }}/zfsbootmenu-efi.cmdline"
    mode: '0644'
    content: "{{ zfsbootmenu_efi_commandline | trim }}"
  when:
    - boot_strategy == 'zfsbootmenu'
    - zfsbootmenu_embed_efi_commandline | bool

- name: Embed ZFSBootMenu command line into fallback EFI executable
  ansible.builtin.shell: |
    set -euo pipefail
    efi="{{ install_target_root }}{{ zfsbootmenu_efi_directory }}/{{ zfsbootmenu_efi_filename }}"
    cmdline="{{ liveiso_work_dir }}/zfsbootmenu-efi.cmdline"
    objcopy_bin="$(command -v objcopy || true)"
    objdump_bin="$(command -v objdump || true)"
    if [[ -z "${objcopy_bin}" || -z "${objdump_bin}" ]]; then
      printf 'GNU objcopy and objdump are required to grow the ZFSBootMenu .cmdline PE section\n' >&2
      exit 1
    fi
    cmdline_vma="$("${objdump_bin}" -h "${efi}" | awk '$2 == ".cmdline" { print "0x" $4; exit }')"
    if [[ -z "${cmdline_vma}" ]]; then
      printf 'ZFSBootMenu EFI executable is missing a .cmdline section: %s\n' "${efi}" >&2
      exit 1
    fi
    "${objcopy_bin}" \
      --remove-section .cmdline \
      --add-section .cmdline="${cmdline}" \
      --change-section-vma .cmdline="${cmdline_vma}" \
      "${efi}"
  args:
    executable: /bin/bash
  when:
    - boot_strategy == 'zfsbootmenu'
    - zfsbootmenu_embed_efi_commandline | bool

- name: Install EFI removable-path fallback for ZFSBootMenu
  ansible.builtin.copy:
    src: "{{ install_target_root }}{{ zfsbootmenu_efi_directory }}/{{ zfsbootmenu_efi_filename }}"
    dest: "{{ install_target_root }}{{ zfsbootmenu_fallback_directory }}/{{ zfsbootmenu_fallback_filename }}"
    remote_src: true
    mode: '0755'
  when: boot_strategy == 'zfsbootmenu'

- name: Create ZFSBootMenu boot entry
  ansible.builtin.command: >-
    efibootmgr
    -c
    -d {{ storage_devices[0] }}
    -p 1
    -L {{ zfsbootmenu_boot_label }}
    -l \\EFI\\ZBM\\{{ zfsbootmenu_efi_filename }}
    -u {{ zfsbootmenu_efi_commandline | quote }}
  when:
    - boot_strategy == 'zfsbootmenu'
    - install_boot_mode == 'uefi'
    - boot_create_efi_nvram_entry | default(true) | bool

- name: Install direct EFI stub helper
  ansible.builtin.copy:
    dest: "{{ install_target_root }}/usr/local/sbin/install-efistub-kernel.sh"
    mode: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      kernel="${1:?kernel image path required}"
      target="/efi/EFI/Gentoo/gentoo.efi"
      mkdir -p /efi/EFI/Gentoo
      cp -f "$kernel" "$target"
  when: boot_strategy == 'efistub'
