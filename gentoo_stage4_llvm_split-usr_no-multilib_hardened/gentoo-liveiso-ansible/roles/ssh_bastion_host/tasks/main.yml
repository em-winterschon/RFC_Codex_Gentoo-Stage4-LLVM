---
- name: Resolve SSH bastion host runtime paths
  ansible.builtin.set_fact:
    ssh_bastion_host_live_root: "{{ ssh_bastion_host_install_root in ['', '/'] }}"
    ssh_bastion_host_root_prefix: "{{ '' if ssh_bastion_host_install_root in ['', '/'] else ssh_bastion_host_install_root }}"

- name: Report SSH bastion host dry-run state
  ansible.builtin.debug:
    msg:
      enabled: "{{ ssh_bastion_host_enabled | bool }}"
      apply: "{{ ssh_bastion_host_apply | bool }}"
      manage_packages: "{{ ssh_bastion_host_manage_packages | bool }}"
      sshd_dropin_path: "{{ ssh_bastion_host_sshd_dropin_path }}"
      validation_user: "{{ ssh_bastion_host_validation_user }}"
  when: not ssh_bastion_host_enabled | bool

- name: Refuse SSH bastion host mutation without explicit apply gate
  ansible.builtin.assert:
    that:
      - ssh_bastion_host_apply | bool
    fail_msg: >-
      SSH bastion host requires ssh_bastion_host_enabled=true and
      ssh_bastion_host_apply=true before mutating sshd configuration.
  when: ssh_bastion_host_enabled | bool

- name: Install SSH bastion host package dependencies
  ansible.builtin.package:
    name: "{{ ssh_bastion_host_packages_by_os_family[ansible_os_family] | default(ssh_bastion_host_packages_default) }}"
    state: present
  when:
    - ssh_bastion_host_enabled | bool
    - ssh_bastion_host_apply | bool
    - ssh_bastion_host_manage_packages | bool

- name: Ensure SSH bastion host configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ ssh_bastion_host_root_prefix }}{{ ssh_bastion_host_sshd_config_dir }}"
    - "{{ ssh_bastion_host_root_prefix }}{{ ssh_bastion_host_backup_dir }}"
  when:
    - ssh_bastion_host_enabled | bool
    - ssh_bastion_host_apply | bool

- name: Inspect base sshd_config for backup
  ansible.builtin.stat:
    path: "{{ ssh_bastion_host_root_prefix }}{{ ssh_bastion_host_sshd_config_path }}"
  register: ssh_bastion_host_base_config
  when:
    - ssh_bastion_host_enabled | bool
    - ssh_bastion_host_apply | bool

- name: Back up base sshd_config before SSH bastion mutation
  ansible.builtin.copy:
    src: "{{ ssh_bastion_host_root_prefix }}{{ ssh_bastion_host_sshd_config_path }}"
    dest: "{{ ssh_bastion_host_root_prefix }}{{ ssh_bastion_host_backup_dir }}/sshd_config.pre-yukon"
    remote_src: true
    force: false
    owner: root
    group: root
    mode: "0644"
  when:
    - ssh_bastion_host_enabled | bool
    - ssh_bastion_host_apply | bool
    - not ansible_check_mode
    - ssh_bastion_host_base_config.stat.exists | default(false)

- name: Ensure sshd includes drop-in directory
  ansible.builtin.lineinfile:
    path: "{{ ssh_bastion_host_root_prefix }}{{ ssh_bastion_host_sshd_config_path }}"
    regexp: "^\\s*Include\\s+{{ ssh_bastion_host_sshd_config_dir | regex_escape }}/\\*.conf\\s*$"
    line: "Include {{ ssh_bastion_host_sshd_config_dir }}/*.conf"
    insertbefore: BOF
    backup: true
    validate: "sshd -t -f %s"
  notify: Restart SSH bastion host sshd service
  when:
    - ssh_bastion_host_enabled | bool
    - ssh_bastion_host_apply | bool
    - ssh_bastion_host_manage_sshd_include | bool
    - ssh_bastion_host_live_root | bool

- name: Render YukonSYS SSH bastion sshd policy
  ansible.builtin.template:
    src: sshd-bastion.conf.j2
    dest: "{{ ssh_bastion_host_root_prefix }}{{ ssh_bastion_host_sshd_dropin_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart SSH bastion host sshd service
  when:
    - ssh_bastion_host_enabled | bool
    - ssh_bastion_host_apply | bool

- name: Validate effective SSH bastion sshd configuration
  ansible.builtin.command: "sshd -t -f {{ ssh_bastion_host_sshd_config_path }}"
  changed_when: false
  when:
    - ssh_bastion_host_enabled | bool
    - ssh_bastion_host_apply | bool
    - ssh_bastion_host_live_root | bool

- name: Read effective SSH bastion sshd policy
  ansible.builtin.command: sshd -T
  register: ssh_bastion_host_effective
  changed_when: false
  when:
    - ssh_bastion_host_enabled | bool
    - ssh_bastion_host_apply | bool
    - ssh_bastion_host_live_root | bool

- name: Report effective SSH bastion sshd policy after apply
  ansible.builtin.debug:
    msg: "{{ ssh_bastion_host_effective.stdout_lines | select('match', '^(allowtcpforwarding|gatewayports|x11forwarding|allowagentforwarding|passwordauthentication|authorizedkeyscommand) ') | list }}"
  when:
    - ssh_bastion_host_enabled | bool
    - ssh_bastion_host_apply | bool
    - ssh_bastion_host_live_root | bool
    - ssh_bastion_host_effective is defined

- name: Validate FreeIPA user resolution on SSH bastion host
  ansible.builtin.command: "getent passwd {{ ssh_bastion_host_validation_user }}"
  changed_when: false
  when:
    - ssh_bastion_host_enabled | bool
    - ssh_bastion_host_apply | bool
    - ssh_bastion_host_live_root | bool
    - ssh_bastion_host_validation_user | length > 0
