---
- name: Resolve Redfish exporter container application profile
  ansible.builtin.set_fact:
    container_redfish_exporter_profile: "{{ resolved_profile_container_app_profiles.redfish_exporter | default({}) }}"
    container_services_enabled: "{{ resolved_profile_container_services.enabled | default(false) | bool }}"

- name: Ensure Redfish exporter configuration directory exists
  ansible.builtin.file:
    path: "{{ install_target_root }}{{ container_redfish_exporter_config_dir }}"
    state: directory
    mode: '0755'
  when:
    - container_services_enabled
    - container_redfish_exporter_profile.enabled | default(false) | bool

- name: Render Redfish exporter configuration
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ install_target_root }}{{ container_redfish_exporter_config_dir }}/config.yml"
    mode: '0644'
  when:
    - container_services_enabled
    - container_redfish_exporter_profile.enabled | default(false) | bool

- name: Register Redfish exporter runtime application
  ansible.builtin.set_fact:
    container_runtime_applications: >-
      {{
        (container_runtime_applications | default([]))
        + [
            {
              'name': 'redfish-exporter',
              'description': 'Prometheus Redfish exporter',
              'image': container_redfish_exporter_profile.image,
              'network': container_redfish_exporter_profile.network | default('mgmt'),
              'ip_address': container_redfish_exporter_profile.ip_address | default(''),
              'published_ports': container_redfish_exporter_profile.published_ports | default(['9220:9220/tcp']),
              'cap_add': container_redfish_exporter_profile.cap_add | default([]),
              'environment': container_redfish_exporter_profile.env | default({}),
              'volumes': [
                container_redfish_exporter_config_dir + '/config.yml:/redfish_exporter/config.yml:ro'
              ],
              'enabled': true
            }
          ]
      }}
  when:
    - container_services_enabled
    - container_redfish_exporter_profile.enabled | default(false) | bool
