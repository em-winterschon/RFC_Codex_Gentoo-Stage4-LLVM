---
- name: Resolve blackbox exporter telemetry settings
  ansible.builtin.set_fact:
    telemetry_blackbox_exporter_enabled: >-
      {{
        resolved_profile_telemetry.blackbox_exporter.enabled
        | default(telemetry_blackbox_exporter_default_enabled)
        | bool
      }}
    resolved_blackbox_exporter_telemetry: >-
      {{
        {
          'listen_address': resolved_profile_telemetry.blackbox_exporter.listen_address | default(telemetry_blackbox_exporter_default_listen_address),
          'listen_port': resolved_profile_telemetry.blackbox_exporter.listen_port | default(telemetry_blackbox_exporter_default_listen_port),
          'modules': resolved_profile_telemetry.blackbox_exporter.modules | default(telemetry_blackbox_exporter_default_modules),
          'extra_args': resolved_profile_telemetry.blackbox_exporter.extra_args | default(telemetry_blackbox_exporter_default_extra_args)
        }
      }}

- name: Ensure blackbox exporter configuration directory exists
  ansible.builtin.file:
    path: "{{ install_target_root }}/etc/blackbox_exporter"
    state: directory
    mode: '0755'
  when: telemetry_blackbox_exporter_enabled

- name: Render blackbox exporter configuration
  ansible.builtin.copy:
    dest: "{{ install_target_root }}/etc/blackbox_exporter/blackbox.yml"
    mode: '0644'
    content: "{{ {'modules': resolved_blackbox_exporter_telemetry.modules} | to_nice_yaml(indent=2, sort_keys=False) }}"
  when: telemetry_blackbox_exporter_enabled

- name: Render blackbox exporter OpenRC configuration
  ansible.builtin.template:
    src: blackbox_exporter.confd.j2
    dest: "{{ install_target_root }}/etc/conf.d/blackbox_exporter"
    mode: '0644'
  when: telemetry_blackbox_exporter_enabled

- name: Enable blackbox exporter service
  ansible.builtin.set_fact:
    resolved_profile_openrc_services_enable: >-
      {{
        (resolved_profile_openrc_services_enable | default([]) + ['blackbox_exporter']) | unique
      }}
  when: telemetry_blackbox_exporter_enabled
