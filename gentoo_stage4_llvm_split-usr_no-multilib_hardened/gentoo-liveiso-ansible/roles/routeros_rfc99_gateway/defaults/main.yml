    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: NPi-Cluster CephNet
  - address: 172.16.0.1/24
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: TestNet
  - address: 172.16.17.1/24
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: VMM route
  - address: 172.16.20.1/24
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: DHCP traffic
  - address: 172.16.22.1/24
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: DHCP Admin traffic
  - address: 172.16.40.1/24
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: SFO200 legacy remote admin
  - address: 172.16.66.1/24
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: Sensor network route
  - address: 172.16.88.1/24
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: LAN gateway primary
  - address: 172.16.199.1/24
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: IPMI traffic
  - address: 172.16.228.1/22
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: NPi-Cluster traffic normalized
  - address: 172.16.254.1/24
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: iSCSI traffic
  - address: 172.28.0.1/16
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: Yukon L2 network core
  - address: 172.28.10.1/24
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: Yukon L3 metal hosts
  - address: 172.28.20.1/24
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: Yukon app front-end
  - address: 172.28.25.1/24
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: Yukon app front-end pods
  - address: 172.28.30.1/24
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: Yukon app back-end
  - address: 172.28.35.1/24
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: Yukon app back-end pods
  - address: 172.28.40.1/24
    interface: "{{ routeros_rfc99_gateway_lan_bridge }}"
    comment: Yukon GPU nodes

routeros_rfc99_gateway_nat_enabled: true
routeros_rfc99_gateway_firewall_enabled: true
routeros_rfc99_gateway_firewall_comment_prefix: RFC99
routeros_rfc99_gateway_send_redirects: false
routeros_rfc99_gateway_accept_redirects: false
routeros_rfc99_gateway_secure_redirects: false
routeros_rfc99_gateway_suppress_lan_icmp_redirects: true

routeros_rfc99_gateway_ssh_enabled: true
routeros_rfc99_gateway_ssh_port: 22
routeros_rfc99_gateway_ssh_strong_crypto: true
routeros_rfc99_gateway_ssh_forwarding: false
routeros_rfc99_gateway_https_enabled: true
routeros_rfc99_gateway_https_port: 443
routeros_rfc99_gateway_http_enabled: false
routeros_rfc99_gateway_api_enabled: false
routeros_rfc99_gateway_api_ssl_enabled: true
routeros_rfc99_gateway_api_ssl_port: 8729
routeros_rfc99_gateway_winbox_enabled: false
routeros_rfc99_gateway_winbox_port: 8291

routeros_rfc99_gateway_certificate_name: rfc99-gw-selfsigned
routeros_rfc99_gateway_certificate_common_name: "{{ routeros_rfc99_gateway_identity }}.rfc1918.host"
routeros_rfc99_gateway_certificate_days_valid: 3650
routeros_rfc99_gateway_certificate_key_size: 4096
routeros_rfc99_gateway_certificate_subject_alt_names:
  - "DNS:{{ routeros_rfc99_gateway_identity }}.rfc1918.host"
  - "IP:172.16.99.1"
  - "IP:10.9.8.1"
  - "IP:10.128.128.1"

routeros_rfc99_gateway_syslog_enabled: true
routeros_rfc99_gateway_syslog_remote_host: 172.16.99.80
routeros_rfc99_gateway_syslog_remote_port_udp: 514
routeros_rfc99_gateway_syslog_topics:
  - info
  - warning
  - error
  - critical

routeros_rfc99_gateway_snmp_enabled: false
routeros_rfc99_gateway_snmp_contact: RFC99
routeros_rfc99_gateway_snmp_location: CCR2004-16G-2S+PC
routeros_rfc99_gateway_snmp_disable_public: true
routeros_rfc99_gateway_snmp_v2c_enabled: false
routeros_rfc99_gateway_snmp_v2c_community: rfc99-ro
routeros_rfc99_gateway_snmp_v2c_addresses: "{{ routeros_rfc99_gateway_management_cidrs }}"
routeros_rfc99_gateway_snmp_v2c_write_access: false

routeros_rfc99_gateway_wireguard_enabled: true
routeros_rfc99_gateway_wireguard_interface: wg-srv
routeros_rfc99_gateway_wireguard_listen_port: 13231
routeros_rfc99_gateway_wireguard_cidr: 172.31.255.1/24

routeros_rfc99_gateway_zerotier_scaffold_enabled: true
routeros_rfc99_gateway_zerotier_instance: zt1
routeros_rfc99_gateway_zerotier_interface: zt-idc

routeros_rfc99_gateway_rip_enabled: false
routeros_rfc99_gateway_rip_note: >-
  CRS309 draft included RIP redistribution. This role leaves RIP disabled until
  the route redistribution scope is explicitly approved for the CCR2004 cutover.
