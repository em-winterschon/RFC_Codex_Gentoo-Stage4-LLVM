---
routeros_rfc99_gateway_apply: false
routeros_rfc99_gateway_render_root: /tmp/routeros-rfc99-gateway
routeros_rfc99_gateway_remote_script_name: "{{ inventory_hostname }}-rfc99-gateway.rsc"
routeros_rfc99_gateway_render_manifest_name: "{{ inventory_hostname }}-rfc99-gateway.json"

routeros_rfc99_gateway_cfg_tag: RFC99-CCR2004-16G.001
routeros_rfc99_gateway_expected_model: CCR2004-16G-2S+PC
routeros_rfc99_gateway_expected_board_name: CCR2004-16G-2S+
routeros_rfc99_gateway_routeros_arch: arm64
routeros_rfc99_gateway_identity: "{{ routeros_identity | default(inventory_hostname | replace('_', '-')) }}"
routeros_rfc99_gateway_timezone: America/Los_Angeles
routeros_rfc99_gateway_note: >-
  Managed by RFC Codex RouterOS RFC99 gateway role. Rendered config is staged
  for operator-reviewed serial or SSH import.

routeros_rfc99_gateway_wan_interface: sfp-sfpplus1
routeros_rfc99_gateway_wan_mode: dhcp
routeros_rfc99_gateway_wan_cidr: ""
routeros_rfc99_gateway_wan_gateway: ""
routeros_rfc99_gateway_wan_route_distance: 1
routeros_rfc99_gateway_wan_use_peer_dns: false
routeros_rfc99_gateway_lan_bridge: br-lan
routeros_rfc99_gateway_lan_uplink_interface: sfp-sfpplus2
routeros_rfc99_gateway_management_interface: ge1
routeros_rfc99_gateway_native_vlan_id: 1

routeros_rfc99_gateway_dns_servers:
  - 9.9.9.9
  - 8.8.8.8
routeros_rfc99_gateway_dns_allow_remote_requests: true

routeros_rfc99_gateway_management_cidrs:
  - 172.16.99.0/24
  - 10.9.8.0/24
  - 10.128.128.0/24

routeros_rfc99_gateway_interface_renames:
  - default_name: ether1
    name: ge1
  - default_name: ether2
    name: ge2
  - default_name: ether3
    name: ge3
  - default_name: ether4
    name: ge4
  - default_name: ether5
    name: ge5
  - default_name: ether6
    name: ge6
  - default_name: ether7
    name: ge7
  - default_name: ether8
    name: ge8
  - default_name: ether9
    name: ge9
  - default_name: ether10
    name: ge10
  - default_name: ether11
    name: ge11
  - default_name: ether12
    name: ge12
  - default_name: ether13
    name: ge13
  - default_name: ether14
    name: ge14
  - default_name: ether15
    name: ge15
  - default_name: ether16
    name: ge16

routeros_rfc99_gateway_interface_lists:
  - WAN
  - LAN
  - MGMT
  - VPN

routeros_rfc99_gateway_vlan_plan:
  - vlan_id: 1
    name: management-compat
    gateway_cidr: 172.16.99.1/24
    native: true
    status: active-transition
  - vlan_id: 98
    name: proxmox-sdn-lab
    gateway_cidr: 172.16.98.1/24
    status: active-local
  - vlan_id: 1098
    name: pathb-lab-services
    gateway_cidr: 10.9.8.1/24
    status: active-chr-backed
  - vlan_id: 1077
    name: container-management
    gateway_cidr: 10.77.0.1/24
    status: planned
  - vlan_id: 1078
    name: container-applications
    gateway_cidr: 10.77.1.1/24
    status: planned
  - vlan_id: 1200
    name: oob-power-management
    gateway_cidr: ""
    status: planned
  - vlan_id: 1300
    name: builder-farm
    gateway_cidr: ""
    status: planned
  - vlan_id: 1400
    name: roce-v2-control
    gateway_cidr: ""
    status: planned
  - vlan_id: 1500
    name: llm-rag-service-control
    gateway_cidr: ""
    status: planned
  - vlan_id: 1501
    name: llm-rag-inference-data
    gateway_cidr: ""
    status: planned

routeros_rfc99_gateway_legacy_bridge_addresses:
  - address: 10.128.128.1/24
    interface: ge1
