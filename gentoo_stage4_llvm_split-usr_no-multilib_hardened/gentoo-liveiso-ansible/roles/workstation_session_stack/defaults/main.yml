---
workstation_session_stack_default_enabled: false
workstation_session_stack_default_os_family: gentoo
workstation_session_stack_default_session_command: /usr/bin/startx
workstation_session_stack_default_create_skel_xinitrc: true
workstation_session_stack_default_create_root_xinitrc: true
workstation_session_stack_default_session_dir: /usr/share/xsessions
workstation_session_stack_default_slim_conf_path: /etc/slim.conf
workstation_session_stack_default_display_managers: []
workstation_session_stack_default_desktop_environments: []
workstation_session_stack_default_window_managers: []
workstation_session_stack_package_install_enabled: false
workstation_session_stack_supported_os_families:
  - gentoo
  - freebsd
  - debian
  - solaris
workstation_session_stack_os_family_aliases:
  gentoo: gentoo
  freebsd: freebsd
  freebsd14: freebsd
  freebsd-14: freebsd
  debian: debian
  devuan: debian
  ubuntu: debian
  solaris: solaris
  solaris11: solaris
  solaris-11: solaris
  solaris11-4: solaris
  solaris-11-4: solaris
  tribblix: solaris
  tribblix-ce: solaris
  omnios: solaris
  openindiana: solaris
