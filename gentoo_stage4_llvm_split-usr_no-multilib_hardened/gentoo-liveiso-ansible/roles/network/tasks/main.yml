---
- name: Enable NetworkManager service on OpenRC
  ansible.builtin.command: >-
    {{ liveiso_work_dir }}/chroot-runner.sh
    {{ item | quote }}
  loop:
    - rc-update add NetworkManager default
    - rc-update add dbus default
  when: install_networkmanager | bool

- name: Ensure NetworkManager system connection directory exists
  ansible.builtin.file:
    path: "{{ install_target_root }}/etc/NetworkManager/system-connections"
    state: directory
    mode: '0700'
  when:
    - install_networkmanager | bool
    - networkmanager_connections | default([]) | length > 0

- name: Render managed NetworkManager connections
  ansible.builtin.template:
    src: networkmanager-connection.nmconnection.j2
    dest: "{{ install_target_root }}/etc/NetworkManager/system-connections/{{ item.name }}.nmconnection"
    mode: '0600'
  loop: "{{ networkmanager_connections | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: install_networkmanager | bool

- name: Enable sshd on OpenRC
  ansible.builtin.command: >-
    {{ liveiso_work_dir }}/chroot-runner.sh
    {{ item | quote }}
  loop:
    - rc-update add sshd default
  when: install_openssh | bool

- name: Create root ssh directory
  ansible.builtin.file:
    path: "{{ install_target_root }}/root/.ssh"
    state: directory
    mode: '0700'
  when: root_authorized_keys | length > 0

- name: Install root authorized_keys
  ansible.builtin.copy:
    dest: "{{ install_target_root }}/root/.ssh/authorized_keys"
    content: "{{ root_authorized_keys | join('\n') }}\n"
    mode: '0600'
  when: root_authorized_keys | length > 0
