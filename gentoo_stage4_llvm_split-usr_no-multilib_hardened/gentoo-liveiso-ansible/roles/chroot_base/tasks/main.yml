---
- name: Copy resolv.conf into target
  ansible.builtin.copy:
    src: /etc/resolv.conf
    dest: "{{ install_target_root }}/etc/resolv.conf"
    remote_src: true
    mode: '0644'

- name: Ensure target ZFS child datasets are mounted before chroot writes
  ansible.builtin.shell: |
    set -euo pipefail
    if command -v zfs >/dev/null 2>&1 && zpool list -H {{ zpool_name | quote }} >/dev/null 2>&1; then
      zfs mount -a
    fi
  args:
    executable: /bin/bash
  changed_when: false
  when: zpool_name is defined

- name: Ensure chroot pseudo-filesystems are mounted
  ansible.builtin.shell: |
    set -euo pipefail
    target="{{ install_target_root }}{{ item.path }}"
    if mountpoint -q "${target}"; then
      exit 0
    fi
    mount {{ item.mount_flag }} "{{ item.src }}" "${target}"
    echo mounted
  args:
    executable: /bin/bash
  register: chroot_mount_result
  changed_when: "'mounted' in chroot_mount_result.stdout"
  loop:
    - { src: /proc, path: /proc, mount_flag: '--bind' }
    - { src: /sys, path: /sys, mount_flag: '--rbind' }
    - { src: /dev, path: /dev, mount_flag: '--rbind' }
    - { src: /run, path: /run, mount_flag: '--rbind' }

- name: Create chroot helper script
  ansible.builtin.template:
    src: chroot-runner.sh.j2
    dest: "{{ liveiso_work_dir }}/chroot-runner.sh"
    mode: '0755'

- name: Initialize Portage binary package trust in target
  ansible.builtin.command: "{{ liveiso_work_dir }}/chroot-runner.sh getuto"
  when: >-
    portage_initialize_binpkg_trust
    | default(portage_getbinpkg_enabled | default(false))
    | bool

- name: Check LiveISO Gentoo repository seed when requested
  ansible.builtin.stat:
    path: /var/db/repos/gentoo/profiles
  register: liveiso_gentoo_repo_profiles
  when: portage_seed_gentoo_repo_from_liveiso | default(false) | bool

- name: Fail when requested LiveISO Gentoo repository seed is unavailable
  ansible.builtin.fail:
    msg: "portage_seed_gentoo_repo_from_liveiso=true, but /var/db/repos/gentoo/profiles is unavailable on the LiveISO."
  when:
    - portage_seed_gentoo_repo_from_liveiso | default(false) | bool
    - not liveiso_gentoo_repo_profiles.stat.exists

- name: Ensure target repository parent exists for LiveISO seed
  ansible.builtin.file:
    path: "{{ install_target_root }}/var/db/repos"
    state: directory
    mode: '0755'
  when: portage_seed_gentoo_repo_from_liveiso | default(false) | bool

- name: Seed Gentoo repository from LiveISO when requested
  ansible.builtin.command: >-
    rsync -a --delete /var/db/repos/gentoo/
    {{ install_target_root }}/var/db/repos/gentoo/
  when: portage_seed_gentoo_repo_from_liveiso | default(false) | bool

- name: Sync Portage in target
  ansible.builtin.command: "{{ liveiso_work_dir }}/chroot-runner.sh {{ portage_sync_command | quote }}"

- name: Install eselect-repository in target
  ansible.builtin.command: >-
    {{ liveiso_work_dir }}/chroot-runner.sh
    {{ 'emerge --oneshot app-eselect/eselect-repository' | quote }}

- name: Enable configured repositories in target
  ansible.builtin.command: >-
    {{ liveiso_work_dir }}/chroot-runner.sh
    {{ ('eselect repository enable ' + portage_repository_name) | quote }}
  loop: "{{ resolved_portage_enable_repositories | default(['guru']) }}"
  loop_control:
    loop_var: portage_repository_name

- name: Sync configured repositories in target
  ansible.builtin.command: >-
    {{ liveiso_work_dir }}/chroot-runner.sh
    {{ ('emaint sync -r ' + portage_repository_name) | quote }}
  loop: "{{ resolved_portage_enable_repositories | default(['guru']) }}"
  loop_control:
    loop_var: portage_repository_name

- name: Refresh Portage after repository changes
  ansible.builtin.command: >-
    {{ liveiso_work_dir }}/chroot-runner.sh
    {{ 'emerge --oneshot sys-apps/portage' | quote }}

- name: Select combined local profile in target
  ansible.builtin.command: >-
    {{ liveiso_work_dir }}/chroot-runner.sh
    {{ ('eselect profile set ' + profile_overlay_name + ':' + profile_name) | quote }}

- name: Set timezone
  ansible.builtin.command: >-
    {{ liveiso_work_dir }}/chroot-runner.sh
    {{ ('ln -snf /usr/share/zoneinfo/' + install_timezone + ' /etc/localtime') | quote }}

- name: Write locale.gen
  ansible.builtin.copy:
    dest: "{{ install_target_root }}/etc/locale.gen"
    content: "{{ install_locale }}\n"
    mode: '0644'

- name: Generate locale
  ansible.builtin.command: "{{ liveiso_work_dir }}/chroot-runner.sh locale-gen"

- name: Write locale.conf
  ansible.builtin.copy:
    dest: "{{ install_target_root }}/etc/env.d/02locale"
    content: |
      LANG={{ install_locale.split(' ')[0] }}
    mode: '0644'

- name: Write hostname
  ansible.builtin.copy:
    dest: "{{ install_target_root }}/etc/hostname"
    content: "{{ install_hostname }}\n"
    mode: '0644'

- name: Write OpenRC hostname fallback
  ansible.builtin.copy:
    dest: "{{ install_target_root }}/etc/conf.d/hostname"
    content: |
      hostname="{{ install_hostname }}"
    mode: '0644'

- name: Write hosts file
  ansible.builtin.copy:
    dest: "{{ install_target_root }}/etc/hosts"
    content: |
      127.0.0.1 localhost
      ::1 localhost
      {% set target_fqdn = fqdn | default('', true) %}
      127.0.1.1 {{ target_fqdn if target_fqdn else install_hostname }}{% if target_fqdn and target_fqdn != install_hostname %} {{ install_hostname }}{% endif %}
    mode: '0644'

- name: Write keymap
  ansible.builtin.copy:
    dest: "{{ install_target_root }}/etc/conf.d/keymaps"
    content: |
      keymap="{{ install_keymap }}"
    mode: '0644'

- name: Ensure installkernel command line directory exists
  ansible.builtin.file:
    path: "{{ install_target_root }}/etc/kernel"
    state: directory
    mode: '0755'

- name: Write legacy kernel command line for installkernel/dracut
  ansible.builtin.copy:
    dest: "{{ install_target_root }}/etc/cmdline"
    mode: '0644'
    content: |
      {{ install_kernel_cmdline | default('root=ZFS=' + zpool_name + '/ROOT/gentoo ro console=tty0 console=ttyS0,115200') }}

- name: Write kernel command line for installkernel/dracut
  ansible.builtin.copy:
    dest: "{{ install_target_root }}/etc/kernel/cmdline"
    mode: '0644'
    content: |
      {{ install_kernel_cmdline | default('root=ZFS=' + zpool_name + '/ROOT/gentoo ro console=tty0 console=ttyS0,115200') }}
