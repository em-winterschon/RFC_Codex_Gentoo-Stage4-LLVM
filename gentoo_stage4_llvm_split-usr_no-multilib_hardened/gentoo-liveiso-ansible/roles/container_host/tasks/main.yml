---
- name: Resolve container host settings
  ansible.builtin.set_fact:
    container_services_enabled: >-
      {{
        resolved_profile_container_services.enabled
        | default(container_services_default_enabled)
        | bool
      }}
    resolved_container_runtime_root: >-
      {{
        resolved_profile_container_services.runtime_root
        | default(container_services_default_runtime_root)
      }}
    resolved_container_registries: >-
      {{
        resolved_profile_container_services.registries
        | default(container_services_default_registries)
      }}

- name: Ensure container host support directories exist
  ansible.builtin.file:
    path: "{{ install_target_root }}{{ container_host_dir }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/container-services
    - /etc/container-services/apps
    - /etc/container-services/ipam
    - /etc/containers
    - /etc/containers/registries.conf.d
    - /etc/sysctl.d
    - /usr/local/libexec/container-services
    - "{{ resolved_container_runtime_root }}"
    - "{{ resolved_container_runtime_root }}/data"
    - "{{ resolved_container_runtime_root }}/logs"
  loop_control:
    loop_var: container_host_dir
  when: container_services_enabled

- name: Render Podman containers.conf
  ansible.builtin.template:
    src: containers.conf.j2
    dest: "{{ install_target_root }}/etc/containers/containers.conf"
    mode: '0644'
  when: container_services_enabled

- name: Render Podman storage.conf
  ansible.builtin.template:
    src: storage.conf.j2
    dest: "{{ install_target_root }}/etc/containers/storage.conf"
    mode: '0644'
  when: container_services_enabled

- name: Render container registries configuration
  ansible.builtin.template:
    src: registries.conf.j2
    dest: "{{ install_target_root }}/etc/containers/registries.conf.d/10-container-services.conf"
    mode: '0644'
  when: container_services_enabled

- name: Render container host sysctl policy
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: "{{ install_target_root }}/etc/sysctl.d/90-container-services.conf"
    mode: '0644'
  when: container_services_enabled

- name: Query iptables frontend selected in target
  ansible.builtin.command: >-
    {{ liveiso_work_dir }}/chroot-runner.sh
    {{ "sh -c 'basename \"$(readlink -f /usr/sbin/iptables)\"'" | quote }}
  register: container_host_iptables_frontend
  changed_when: false
  when: container_services_enabled

- name: Select nft-backed iptables frontend for Podman networking
  ansible.builtin.command: >-
    {{ liveiso_work_dir }}/chroot-runner.sh
    {{ "eselect iptables set xtables-nft-multi" | quote }}
  when:
    - container_services_enabled
    - container_host_iptables_frontend.stdout | trim != 'xtables-nft-multi'
