---
- name: Ensure modules-load.d directory exists
  ansible.builtin.file:
    path: "{{ install_target_root }}/etc/modules-load.d"
    state: directory
    mode: '0755'

- name: Install profile modules-load fragments
  ansible.builtin.copy:
    dest: "{{ install_target_root }}/etc/modules-load.d/{{ profile_modules_load_file.key }}"
    mode: '0644'
    content: "{{ profile_modules_load_file.value | trim }}\n"
  loop: "{{ (resolved_profile_modules_load_files | default({})) | dict2items }}"
  loop_control:
    loop_var: profile_modules_load_file

- name: Ensure udev rules directory exists
  ansible.builtin.file:
    path: "{{ install_target_root }}/etc/udev/rules.d"
    state: directory
    mode: '0755'

- name: Install profile udev rule fragments
  ansible.builtin.copy:
    dest: "{{ install_target_root }}/etc/udev/rules.d/{{ profile_udev_rules_file.key }}"
    mode: '0644'
    content: "{{ profile_udev_rules_file.value | trim }}\n"
  loop: "{{ (resolved_profile_udev_rules_files | default({})) | dict2items }}"
  loop_control:
    loop_var: profile_udev_rules_file

- name: Check profile OpenRC service init scripts
  ansible.builtin.stat:
    path: "{{ install_target_root }}/etc/init.d/{{ openrc_service_name }}"
  loop: "{{ resolved_profile_openrc_services_enable | default([]) }}"
  loop_control:
    loop_var: openrc_service_name
  register: profile_openrc_service_init_scripts

- name: Deferring profile OpenRC service enable when init script is absent
  ansible.builtin.debug:
    msg: >-
      Deferring profile OpenRC service enable for
      {{ profile_openrc_service_init_script.openrc_service_name }} because
      {{ install_target_root }}/etc/init.d/{{ profile_openrc_service_init_script.openrc_service_name }}
      is not present yet.
  loop: >-
    {{
      profile_openrc_service_init_scripts.results | default([])
      | rejectattr('stat.exists')
      | list
    }}
  loop_control:
    loop_var: profile_openrc_service_init_script
    label: "{{ profile_openrc_service_init_script.openrc_service_name }}"

- name: Enable profile OpenRC services
  ansible.builtin.command: >-
    {{ liveiso_work_dir }}/chroot-runner.sh
    {{ ('rc-update add ' + openrc_service_name + ' default') | quote }}
  loop: >-
    {{
      profile_openrc_service_init_scripts.results | default([])
      | selectattr('stat.exists')
      | map(attribute='openrc_service_name')
      | list
    }}
  loop_control:
    loop_var: openrc_service_name
