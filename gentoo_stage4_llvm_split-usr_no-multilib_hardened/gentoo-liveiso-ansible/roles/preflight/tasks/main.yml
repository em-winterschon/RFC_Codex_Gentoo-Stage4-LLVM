- name: Resolve package atoms from selected profile package list files
  ansible.builtin.set_fact:
    resolved_profile_package_atoms: >-
      {{
        (
          resolved_profile_package_atoms
          + (
            lookup('ansible.builtin.file', playbook_dir ~ '/../' ~ resolved_profile_package_list_file)
            .splitlines()
            | map('trim')
            | reject('equalto', '')
            | reject('match', '^#')
            | list
          )
        ) | unique
      }}
  loop: "{{ resolved_profile_package_list_files | default([]) }}"
  loop_control:
    loop_var: resolved_profile_package_list_file

- name: Ensure storage device list is present
  ansible.builtin.assert:
    that:
      - storage_devices | length > 0
    fail_msg: "storage_devices must contain at least one disk or partition path."
