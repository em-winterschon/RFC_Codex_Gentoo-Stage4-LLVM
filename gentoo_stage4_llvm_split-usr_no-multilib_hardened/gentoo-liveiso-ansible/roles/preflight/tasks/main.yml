---
- name: Assert installer runs as root
  ansible.builtin.assert:
    that:
      - ansible_user_id == 'root' or ansible_effective_user_id | int == 0
    fail_msg: "This playbook must run as root from the LiveISO or via root SSH."

- name: Assert destructive storage work is acknowledged
  ansible.builtin.assert:
    that:
      - storage_confirm_destroy | bool
    fail_msg: >-
      Set storage_confirm_destroy=true after reviewing the selected devices. This
      playbook will wipe partition tables and filesystems.

- name: Require explicit opt-in for mdadm under ZFS
  ansible.builtin.assert:
    that:
      - storage_layout not in ['raid-1', 'raid-10'] or storage_allow_mdadm_under_zfs | bool
    fail_msg: >-
      The mdadm-backed layouts place ZFS on top of mdraid and are intentionally
      gated. Set storage_allow_mdadm_under_zfs=true if you really want that.

- name: Assert UEFI mode when requested
  ansible.builtin.stat:
    path: /sys/firmware/efi/efivars
  register: efi_vars
  when:
    - install_boot_mode == 'uefi'
    - preflight_require_runtime_uefi | bool

- name: Fail if UEFI was requested but firmware is not in UEFI mode
  ansible.builtin.assert:
    that:
      - efi_vars.stat.exists
    fail_msg: "UEFI mode requested, but /sys/firmware/efi/efivars is missing."
  when:
    - install_boot_mode == 'uefi'
    - preflight_require_runtime_uefi | bool

- name: Create work directory
  ansible.builtin.file:
    path: "{{ liveiso_work_dir }}"
    state: directory
    mode: '0755'

- name: Assert selected CPU tuning profile exists
  ansible.builtin.assert:
    that:
      - portage_cpu_profile in portage_cpu_profiles
    fail_msg: "Unknown portage_cpu_profile={{ portage_cpu_profile }}"

- name: Assert selected GPU stack exists
  ansible.builtin.assert:
    that:
      - gpu_stack in gpu_profiles
    fail_msg: "Unknown gpu_stack={{ gpu_stack }}"

- name: Resolve selected CPU tuning profile
  ansible.builtin.set_fact:
    selected_cpu_profile: "{{ portage_cpu_profiles[portage_cpu_profile] }}"
    selected_gpu_profile: "{{ gpu_profiles[gpu_stack] }}"
    resolved_portage_enable_repositories: "{{ portage_enable_repositories | default(['guru']) }}"
    resolved_portage_make_conf_append: "{{ portage_make_conf_append | default('') }}"
    resolved_portage_package_use_files: "{{ portage_package_use_files | default({}) }}"
    resolved_portage_package_mask_files: "{{ portage_package_mask_files | default({}) }}"
    resolved_portage_package_unmask_files: "{{ portage_package_unmask_files | default({}) }}"
    resolved_portage_package_mask_symlinks: "{{ portage_package_mask_symlinks | default([]) }}"
    resolved_portage_package_accept_keywords_files: "{{ portage_package_accept_keywords_files | default({}) }}"
    resolved_portage_package_license_files: "{{ portage_package_license_files | default({}) }}"
    resolved_portage_env_files: "{{ portage_env_files | default({}) }}"
    resolved_portage_package_env_files: "{{ portage_package_env_files | default({}) }}"
    resolved_portage_config_files: "{{ portage_config_files | default({}) }}"
    resolved_kernel_config_fragment_files: "{{ kernel_config_fragment_files | default({}) }}"
    resolved_portage_patch_files: "{{ portage_patch_files | default({}) }}"
    resolved_profile_parents: "{{ profile_parents | default([]) }}"
    resolved_profile_package_atoms: "{{ profile_package_atoms | default([]) }}"
    resolved_profile_package_list_files: "{{ profile_package_list_files | default([]) }}"
    resolved_profile_openrc_services_enable: "{{ profile_openrc_services_enable | default([]) }}"
    resolved_profile_modules_load_files: "{{ profile_modules_load_files | default({}) }}"
    resolved_profile_local_user_accounts: "{{ profile_local_user_accounts | default([]) }}"
    resolved_profile_cloud_init: "{{ profile_cloud_init | default({}) }}"
    resolved_profile_aaa_policy_files: "{{ profile_aaa_policy_files | default([]) }}"
    resolved_profile_aaa_policy: "{{ profile_aaa_policy | default({}) }}"
    resolved_profile_freeipa_controller: "{{ profile_freeipa_controller | default({}) }}"
    resolved_profile_ipa_client: "{{ profile_ipa_client | default({}) }}"
    resolved_profile_freeradius_bridge: "{{ profile_freeradius_bridge | default({}) }}"
    resolved_profile_rsyslog: "{{ profile_rsyslog | default({}) }}"
    resolved_profile_elasticsearch_cluster: "{{ profile_elasticsearch_cluster | default({}) }}"
    resolved_profile_kibana: "{{ profile_kibana | default({}) }}"
    resolved_profile_netbox_connector: "{{ profile_netbox_connector | default({}) }}"
    resolved_profile_netbox_essentials: "{{ profile_netbox_essentials | default({}) }}"
    resolved_profile_vm_redfish_emulator: "{{ profile_vm_redfish_emulator | default({}) }}"
    resolved_profile_zerotier: "{{ profile_zerotier | default({}) }}"
    resolved_profile_telemetry: "{{ profile_telemetry | default({}) }}"
    resolved_profile_nfs_storage_client: "{{ profile_nfs_storage_client | default({}) }}"
    resolved_profile_binpkg_repo: "{{ profile_binpkg_repo | default({}) }}"
    resolved_profile_nexus_repo: "{{ profile_nexus_repo | default({}) }}"
    resolved_profile_nscde_workstation: "{{ profile_nscde_workstation | default({}) }}"
    resolved_profile_workstation_session_stack: "{{ profile_workstation_session_stack | default({}) }}"
    resolved_profile_haproxy_service_types: "{{ profile_haproxy_service_types | default([]) }}"
    resolved_profile_service_readiness: "{{ profile_service_readiness | default({}) }}"
    resolved_profile_container_base_image: "{{ profile_container_base_image | default({}) }}"
    resolved_profile_container_app_build_defaults: "{{ profile_container_app_build_defaults | default({}) }}"
    resolved_profile_container_services: "{{ profile_container_services | default({}) }}"
    resolved_profile_container_app_profiles: "{{ profile_container_app_profiles | default({}) }}"
    resolved_profile_container_service_segments: "{{ profile_container_service_segments | default([]) }}"
    resolved_profile_site_security_profile: "{{ profile_site_security_profile | default({}) }}"
    resolved_profile_memory_storage: "{{ profile_memory_storage | default({}) }}"
    resolved_profile_jenkins_controller: "{{ profile_jenkins_controller | default({}) }}"
    resolved_profile_distcc_farm: "{{ profile_distcc_farm | default({}) }}"

- name: Load selected profile definition files
  ansible.builtin.include_tasks: load_profile_definition.yml
  loop: "{{ profile_definition_files | default([]) }}"
  loop_control:
    loop_var: profile_definition_file

- name: Reapply explicit inventory-level AAA policy file overrides after definition layering
  ansible.builtin.set_fact:
    resolved_profile_aaa_policy_files: >-
      {{
        (
          resolved_profile_aaa_policy_files
          + (profile_aaa_policy_files | default([]))
        ) | unique
      }}

- name: Load selected AAA policy definition files
  ansible.builtin.include_tasks: load_aaa_policy_definition.yml
  loop: "{{ resolved_profile_aaa_policy_files | default([]) }}"
  loop_control:
    loop_var: aaa_policy_definition_file

- name: Reapply explicit inventory-level profile overrides after definition layering
  ansible.builtin.set_fact:
    resolved_profile_cloud_init: >-
      {{
        resolved_profile_cloud_init
        | combine(profile_cloud_init | default({}), recursive=True)
      }}
    resolved_profile_aaa_policy: >-
      {{
        resolved_profile_aaa_policy
        | combine(profile_aaa_policy | default({}), recursive=True)
