    resolved_portage_package_mask_symlinks: >-
      {{
        resolved_portage_package_mask_symlinks
        + (loaded_profile_definition_file.gentoo_profile_definition.package_mask_symlinks | default([]))
      }}
    resolved_profile_parents: >-
      {{
        loaded_profile_definition_file.gentoo_profile_definition.profile_parents
        if loaded_profile_definition_file.gentoo_profile_definition.profile_parents is defined
        else resolved_profile_parents
