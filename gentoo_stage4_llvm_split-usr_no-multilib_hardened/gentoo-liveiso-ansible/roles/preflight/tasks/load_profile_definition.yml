---
- name: Load profile definition data
  ansible.builtin.include_vars:
    file: "{{ profile_definition_file }}"
    name: loaded_profile_definition_file

- name: Assert profile definition schema
  ansible.builtin.assert:
    that:
      - loaded_profile_definition_file.gentoo_profile_definition is defined
      - loaded_profile_definition_file.gentoo_profile_definition is mapping
    fail_msg: >-
      Profile definition {{ profile_definition_file }} must define a top-level
      gentoo_profile_definition mapping.

- name: Merge loaded profile definition into resolved installer settings
  ansible.builtin.set_fact:
    resolved_portage_enable_repositories: >-
      {{
        (
          resolved_portage_enable_repositories
          + (loaded_profile_definition_file.gentoo_profile_definition.repository_enable | default([]))
        ) | unique
      }}
    resolved_portage_make_conf_append: >-
      {{
        [
          resolved_portage_make_conf_append,
          loaded_profile_definition_file.gentoo_profile_definition.make_conf_append | default('')
        ]
        | reject('equalto', '')
        | join('\n\n')
      }}
    resolved_portage_package_use_files: >-
      {{
        resolved_portage_package_use_files
        | combine(
            loaded_profile_definition_file.gentoo_profile_definition.package_use_files | default({}),
            recursive=True
          )
      }}
    resolved_portage_package_mask_files: >-
      {{
        resolved_portage_package_mask_files
        | combine(
            loaded_profile_definition_file.gentoo_profile_definition.package_mask_files | default({}),
            recursive=True
          )
      }}
    resolved_portage_package_accept_keywords_files: >-
      {{
        resolved_portage_package_accept_keywords_files
        | combine(
            loaded_profile_definition_file.gentoo_profile_definition.package_accept_keywords_files | default({}),
            recursive=True
          )
      }}
    resolved_portage_env_files: >-
      {{
        resolved_portage_env_files
        | combine(
            loaded_profile_definition_file.gentoo_profile_definition.env_files | default({}),
            recursive=True
          )
      }}
    resolved_portage_package_env_files: >-
      {{
        resolved_portage_package_env_files
        | combine(
            loaded_profile_definition_file.gentoo_profile_definition.package_env_files | default({}),
            recursive=True
          )
      }}
    resolved_portage_package_mask_symlinks: >-
      {{
        resolved_portage_package_mask_symlinks
        + (loaded_profile_definition_file.gentoo_profile_definition.package_mask_symlinks | default([]))
      }}
    resolved_profile_package_atoms: >-
      {{
        (
          resolved_profile_package_atoms
          + (loaded_profile_definition_file.gentoo_profile_definition.package_atoms | default([]))
        ) | unique
      }}
    resolved_profile_openrc_services_enable: >-
      {{
        (
          resolved_profile_openrc_services_enable
          + (loaded_profile_definition_file.gentoo_profile_definition.openrc_services_enable | default([]))
        ) | unique
      }}
    resolved_profile_modules_load_files: >-
      {{
        resolved_profile_modules_load_files
        | combine(
            loaded_profile_definition_file.gentoo_profile_definition.modules_load_files | default({}),
            recursive=True
          )
      }}
    resolved_profile_local_user_accounts: >-
      {{
        resolved_profile_local_user_accounts
        + (loaded_profile_definition_file.gentoo_profile_definition.local_user_accounts | default([]))
      }}
    resolved_profile_cloud_init: >-
      {{
        resolved_profile_cloud_init
        | combine(
            loaded_profile_definition_file.gentoo_profile_definition.cloud_init | default({}),
            recursive=True
          )
      }}
    resolved_profile_container_services: >-
      {{
        resolved_profile_container_services
        | combine(
            loaded_profile_definition_file.gentoo_profile_definition.container_services | default({}),
            recursive=True
          )
      }}
    resolved_profile_container_app_profiles: >-
      {{
        resolved_profile_container_app_profiles
        | combine(
            loaded_profile_definition_file.gentoo_profile_definition.container_app_profiles | default({}),
            recursive=True
          )
      }}
    resolved_profile_container_service_segments: >-
      {{
        resolved_profile_container_service_segments
        + (loaded_profile_definition_file.gentoo_profile_definition.container_service_segments | default([]))
      }}
    resolved_profile_site_security_profile: >-
      {{
        resolved_profile_site_security_profile
        | combine(
            loaded_profile_definition_file.gentoo_profile_definition.site_security_profile | default({}),
            recursive=True
          )
      }}
