---
nvidia_doca_ofed_enabled: false
nvidia_doca_ofed_apply: false
nvidia_doca_ofed_supported_doca_host_version: 3.3.0
nvidia_doca_ofed_repo_package_type: auto
nvidia_doca_ofed_repo_deb_url: ""
nvidia_doca_ofed_repo_deb_path: ""
nvidia_doca_ofed_repo_deb_checksum: ""
nvidia_doca_ofed_repo_deb_dest: /tmp/nvidia-doca-ofed-repo.deb
nvidia_doca_ofed_repo_rpm_url: ""
nvidia_doca_ofed_repo_rpm_path: ""
nvidia_doca_ofed_repo_rpm_checksum: ""
nvidia_doca_ofed_repo_rpm_dest: /tmp/nvidia-doca-ofed-repo.rpm
nvidia_doca_ofed_install_packages:
  - doca-ofed
nvidia_doca_ofed_kernel_headers_required: true
nvidia_doca_ofed_allow_custom_kernel: false
nvidia_doca_ofed_custom_kernel_ack: ""
nvidia_doca_ofed_apt_update_after_repo: true
nvidia_doca_ofed_skip_device_detection: false
nvidia_doca_ofed_supported_pci_vendor_ids:
  - "15b3"
nvidia_doca_ofed_supported_device_markers:
  - BlueField
  - BlueField-2
  - ConnectX-4
  - ConnectX-5
  - ConnectX-6
  - ConnectX-7
nvidia_doca_ofed_legacy_connectx4_policy: legacy-doca-2.9-lts-build-lane
nvidia_doca_ofed_artifact_root: /srv/stage/doca-host
nvidia_doca_ofed_supported_kernel_targets:
  rocky9.6-doca-2.9.4-connectx4:
    operating_system: Rocky Linux 9.6
    kernel: 5.14.0-570.12.1.el9_6.x86_64
    repository_package_type: rpm
    support_class: legacy-doca-2.9-lts-build-lane
    install_profiles:
      - doca-ofed
      - doca-roce
  rocky10-doca-3.3.0:
    operating_system: Rocky Linux 10
    kernel: 6.12.0-124.8.1.el10_1.x86_64
    repository_package_type: rpm
    support_class: current-doca-host
    install_profiles:
      - doca-all
      - doca-ofed
      - doca-roce
  rocky9-doca-3.3.0:
    operating_system: Rocky Linux 9
    kernel: 5.14.0-611.5.1.el9_7.x86_64
    repository_package_type: rpm
    support_class: current-doca-host
    install_profiles:
      - doca-all
      - doca-ofed
      - doca-roce
  kernel.org-6.18-doca-ofed-only:
    operating_system: kernel.org
    kernel: 6.18
    repository_package_type: rpm
    support_class: doca-ofed-only
    install_profiles:
      - doca-ofed
nvidia_doca_ofed_required_kernel_modules:
  - mlx5_core
  - mlx5_ib
  - ib_uverbs
  - rdma_cm
nvidia_doca_ofed_vendor_driver_required: true
nvidia_doca_ofed_forbidden_steady_state:
  - in-kernel mlx5_core only
  - missing ofed_info
nvidia_doca_ofed_roce_validation_commands:
  - ofed_info -s
  - ibv_devinfo
  - rdma link show
  - rdma resource show
  - ethtool -i <rdma-netdev>
