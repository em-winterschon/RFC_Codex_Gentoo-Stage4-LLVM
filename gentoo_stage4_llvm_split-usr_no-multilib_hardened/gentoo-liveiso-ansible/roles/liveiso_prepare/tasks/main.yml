---
- name: Install LiveISO installer prerequisites
  ansible.builtin.command: >-
    emerge --verbose --noreplace --oneshot {{ installer_prerequisites | default([]) | join(' ') }}
  changed_when: "'>>> Emerging' in liveiso_prerequisites_install.stdout"
  when: (installer_prerequisites | default([]) | length) > 0
  register: liveiso_prerequisites_install

- name: Check required commands exist on the LiveISO
  ansible.builtin.shell: "command -v {{ item }} >/dev/null"
  args:
    executable: /bin/bash
  changed_when: false
  loop:
    - awk
    - curl
    - gpg
    - gpgv
    - lsblk
    - mount
    - partprobe
    - sgdisk
    - tar
    - wipefs
    - zpool
    - zfs

- name: Create target root directory
  ansible.builtin.file:
    path: "{{ install_target_root }}"
    state: directory
    mode: '0755'
