---
apiVersion: rfc-codex/v1alpha1
kind: NetbootImageManifest
metadata:
  name: k10-stage5-workstation
  description: Reproducible Path B boot-image manifest for GMKtek K10 Stage5 validation.
target:
  inventory_name: gmktek_nucbox_k10_stage5_candidate
  hostname: gmktek-k10-stage5
  machine_type: metal
  architecture: amd64
  platform: uefi
  protocol_flow: pxe-to-ipxe
network:
  interface_name: eth0
  mac_address: "84:47:09:5F:21:64"
  static_address: 172.16.99.156
  gateway: 172.16.99.1
  netmask: 255.255.255.0
  nameserver: 172.16.99.1
artifacts:
  publish_root: /var/lib/netboot/path-b
  public_base_url: http://172.16.99.88:8080
  tftp_first_stage: k10-ipxe.efi
  host_script: hosts/gmktek-k10-stage5.ipxe
  role_script: roles/installer-k10.ipxe
  kernel_url: http://172.16.99.88:8080/g/vmlinuz
  initramfs_url: http://172.16.99.88:8080/g/initramfs-gz.img
  initramfs_boot_name: initrd.magic
  rootfs_url: http://172.16.99.88:8080/g/rootfs.img
  hash_strategy: sha256sum sidecar files generated during Jenkins rebuilds
builder:
  script: gentoo-liveiso-ansible/scripts/build-path-b-netboot-artifacts.sh
  profile_definition_requirements:
    - profile-definitions/aaa-domain-client.yml
    - profile-definitions/secure-firstboot-enrollment.yml
  rootfs_package_list_requirements:
    - profile-package-lists/stage5-domain-client.packages
    - profile-package-lists/stage5-secure-firstboot-enrollment.packages
  rootfs_package_use_requirements:
    - sys-auth/sssd samba
    - net-fs/samba winbind
  package_requirements:
    - sys-kernel/linux-firmware
    - sys-auth/sssd
    - net-fs/samba
    - app-crypt/mit-krb5
    - net-nds/openldap
    - app-crypt/age
    - net-misc/curl
    - app-misc/jq
    - sys-apps/gptfdisk
  dracut_modules:
    add:
      - network
      - dmsquash-live
    omit: []
  kernel_modules:
    require:
      - r8169
  firmware:
    require:
      - rtl_nic/rtl8125b-2.fw
cmdline:
  console:
    - console=tty0
    - console=ttyS0,115200
  initrd: initrd=initrd.magic
  network:
    - ifname=eth0:84:47:09:5f:21:64
    - ip=172.16.99.156::172.16.99.1:255.255.255.0:gmktek-k10-stage5:eth0:none
    - nameserver=172.16.99.1
    - nameserver=9.9.9.9
    - rd.neednet=1
    - rd.net.timeout.carrier=60
  root:
    - rd.live.image
    - root=live:http://172.16.99.88:8080/g/rootfs.img
validation:
  expected_result: Gentoo live login prompt on PiKVM video or serial-visible console.
  last_validated: "2026-05-11"
  transient_live_aaa_gate: passed before reboot with repo-managed apply playbook.
  reboot_durable_aaa_gate: blocked on disk install or secure first-boot age-encrypted FreeIPA OTP bundle apply; /etc/krb5.keytab must be generated on the target, never embedded in HTTP netboot artifacts.
  last_reboot_observation: AP7901 outlet 6 reboot returned the promoted rootfs with SSSD, Samba, Kerberos, OpenLDAP, and libsss_ipa.so present; post-boot FreeIPA live apply and codex-admin SSH validation passed.
  backout: Remove K10 DHCP option 67 and leave CSS326 ge16 disconnected.
