---
- name: Rapid Gentoo installer from a booted LiveISO
  hosts: install_targets
  gather_facts: true
  become: true
  vars_files:
    - ../vars/cpu_profiles.yml
    - ../vars/gpu_profiles.yml
  vars:
    default_install_roles:
      - preflight
      - liveiso_prepare
      - storage
      - stage3
      - profile
      - portage
      - chroot_base
      - system_packages
      - boot
      - network
      - services

  tasks:
    - name: Include selected roles
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop: "{{ selected_roles | default(default_install_roles) }}"
      loop_control:
        label: "Running role {{ item }}"
