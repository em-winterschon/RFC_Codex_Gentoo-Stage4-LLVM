---
- name: Rapid Gentoo installer from a booted LiveISO
  hosts: install_targets
  gather_facts: true
  become: true
  vars_files:
    - ../vars/cpu_profiles.yml
    - ../vars/gpu_profiles.yml
    - ../vars/install_sequences.yml
  vars:
    default_install_roles:
      - preflight
      - liveiso_prepare
      - storage
      - stage3
      - profile
      - portage
      - chroot_base
      - system_packages
      - boot
      - network
      - platform_profile
      - identity
      - memory_storage
      - jenkins_controller
      - distcc_farm
      - container_host
      - container_app_ntfy
      - container_app_nginx
      - container_app_haproxy
      - container_net_policy
      - container_service_segments
      - services

  tasks:
    - name: Validate requested install sequence
      ansible.builtin.assert:
        that:
          - selected_roles is defined or install_sequence in install_role_sequences
        fail_msg: >-
          Unknown install_sequence={{ install_sequence }}.
          Supported values: {{ install_role_sequences.keys() | sort | join(', ') }}

    - name: Resolve install stages from selected_roles override or install_sequence
      ansible.builtin.set_fact:
        resolved_install_sequence_name: "{{ 'selected-roles' if selected_roles is defined else install_sequence }}"
        resolved_install_stages: >-
          {{
            (
              [{
                'id': 'selected-roles',
                'summary': 'Custom role override supplied through selected_roles',
                'roles': selected_roles
              }]
            )
            if selected_roles is defined
            else install_role_sequences[install_sequence].stages
          }}
        resolved_install_roles_flat: >-
          {{
            (
              selected_roles
              if selected_roles is defined
              else install_role_sequences[install_sequence].stages
                | map(attribute='roles')
                | flatten
                | unique
                | list
            )
          }}

    - name: Filter install stages when install_stage_filter is provided
      ansible.builtin.set_fact:
        resolved_install_stages: >-
          {{
            resolved_install_stages
            | selectattr('id', 'in', install_stage_filter)
            | list
          }}
        resolved_install_roles_flat: >-
          {{
            (
              resolved_install_stages
              | selectattr('id', 'in', install_stage_filter)
              | map(attribute='roles')
              | flatten
              | unique
              | list
            )
          }}
      when: install_stage_filter | length > 0

    - name: Assert at least one install stage remains after filtering
      ansible.builtin.assert:
        that:
          - resolved_install_stages | length > 0
        fail_msg: >-
          No install stages remain after applying install_stage_filter={{ install_stage_filter }}.

    - name: Execute install stages
      ansible.builtin.include_tasks: tasks/run_install_stage.yml
      loop: "{{ resolved_install_stages }}"
      loop_control:
        loop_var: install_stage
        label: "{{ resolved_install_sequence_name }} :: {{ install_stage.id }}"
