---
- name: Sync FreeIPA SSH keys and access metadata
  hosts: "{{ identity_freeipa_ssh_sync_hosts | default('identity_controllers') }}"
  gather_facts: false
  vars:
    identity_freeipa_ssh_sync_local_repo_root: "{{ playbook_dir }}/../../.."
    identity_freeipa_ssh_sync_local_source: "{{ playbook_dir }}/../identity-source-definitions/local-rfc1918.yml"
    identity_freeipa_ssh_sync_enabled: false
    identity_freeipa_ssh_sync_validate_live: false
    identity_freeipa_ssh_sync_format: json
    identity_freeipa_ssh_sync_freeipa_command: ipa
    identity_freeipa_ssh_sync_audit_log: /var/log/identity-sync/freeipa-ssh-sync.jsonl
    identity_freeipa_ssh_sync_kinit_enabled: >-
      {{ (identity_freeipa_ssh_sync_enabled | bool) or
         (identity_freeipa_ssh_sync_validate_live | bool) }}
    identity_freeipa_ssh_sync_kinit_env_file: /root/stage5-identity/bootstrap.env
    identity_freeipa_ssh_sync_environment_effective: >-
      {{
        identity_freeipa_ssh_sync_environment | default({}) |
        combine(
          {
            'IDENTITY_SYNC_APPLY': '1',
            'IDENTITY_SYNC_APPLY_FREEIPA': '1'
          } if identity_freeipa_ssh_sync_enabled | bool else {}
        )
      }}

  tasks:
    - name: Stage FreeIPA SSH sync tooling and run selected checks
      block:
        - name: Create remote FreeIPA SSH sync staging directory
          ansible.builtin.tempfile:
            state: directory
            suffix: freeipa-ssh-sync
          register: identity_freeipa_ssh_sync_tempdir

        - name: Stage FreeIPA SSH sync scripts
          ansible.builtin.copy:
            src: "{{ identity_freeipa_ssh_sync_local_repo_root }}/scripts/{{ item }}"
            dest: "{{ identity_freeipa_ssh_sync_tempdir.path }}/{{ item }}"
            mode: "0755"
          loop:
            - apply_identity_sync_plan.py
            - render_freeipa_ssh_sync_checks.py
            - render_identity_sync_plan.py
            - validate_identity_source.py

        - name: Stage identity source definition
          ansible.builtin.copy:
            src: "{{ identity_freeipa_ssh_sync_local_source }}"
            dest: "{{ identity_freeipa_ssh_sync_tempdir.path }}/identity-source.yml"
            mode: "0644"

        - name: Build FreeIPA SSH sync argv
          ansible.builtin.set_fact:
            identity_freeipa_ssh_sync_argv: >-
              {{
                [
                  'python3',
                  identity_freeipa_ssh_sync_tempdir.path + '/apply_identity_sync_plan.py',
                  identity_freeipa_ssh_sync_tempdir.path + '/identity-source.yml',
                  '--provider', 'freeipa',
                  '--format', identity_freeipa_ssh_sync_format,
                  '--freeipa-command', identity_freeipa_ssh_sync_freeipa_command
                ]
                + (['--apply'] if identity_freeipa_ssh_sync_enabled | bool else [])
                + (['--audit-log', identity_freeipa_ssh_sync_audit_log] if identity_freeipa_ssh_sync_audit_log | length > 0 else [])
              }}

        - name: Acquire FreeIPA admin Kerberos ticket for sync or live checks
          ansible.builtin.shell: |
            set -euo pipefail
            source "{{ identity_freeipa_ssh_sync_kinit_env_file }}"
            printf '%s\n' "${IPA_ADMIN_PASSWORD}" | kinit admin
          args:
            executable: /bin/bash
          changed_when: false
          no_log: true
          when: identity_freeipa_ssh_sync_kinit_enabled | bool

        - name: Plan or apply FreeIPA SSH key sync
          ansible.builtin.command:
            argv: "{{ identity_freeipa_ssh_sync_argv }}"
          environment: "{{ identity_freeipa_ssh_sync_environment_effective }}"
          register: identity_freeipa_ssh_sync_result
          changed_when: identity_freeipa_ssh_sync_enabled | bool
          no_log: "{{ identity_freeipa_ssh_sync_enabled | bool }}"

        - name: Render FreeIPA SSH sync validation plan
          ansible.builtin.command:
            argv:
              - python3
              - "{{ identity_freeipa_ssh_sync_tempdir.path }}/render_freeipa_ssh_sync_checks.py"
              - "{{ identity_freeipa_ssh_sync_tempdir.path }}/identity-source.yml"
              - "--format"
              - json
          register: identity_freeipa_ssh_sync_checks_result
          changed_when: false

        - name: Parse FreeIPA SSH sync validation plan
          ansible.builtin.set_fact:
            identity_freeipa_ssh_sync_checks: "{{ identity_freeipa_ssh_sync_checks_result.stdout | from_json }}"

        - name: Report FreeIPA SSH sync dry-run output
          ansible.builtin.debug:
            msg:
              sync_result: "{{ identity_freeipa_ssh_sync_result.stdout }}"
              validation_plan: "{{ identity_freeipa_ssh_sync_checks }}"
          when: not identity_freeipa_ssh_sync_enabled | bool

        - name: Run live FreeIPA controller validation checks
          ansible.builtin.command:
            argv: "{{ item.argv }}"
          loop: "{{ identity_freeipa_ssh_sync_checks.freeipa_controller_checks }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: false
          when: identity_freeipa_ssh_sync_validate_live | bool

      always:
        - name: Remove remote FreeIPA SSH sync staging directory
          ansible.builtin.file:
            path: "{{ identity_freeipa_ssh_sync_tempdir.path | default('') }}"
            state: absent
          when: identity_freeipa_ssh_sync_tempdir.path is defined
