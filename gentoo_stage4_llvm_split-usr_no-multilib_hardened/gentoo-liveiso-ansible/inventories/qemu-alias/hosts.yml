---
all:
  children:
    install_targets:
      hosts:
        target_system_local:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
        target_system_remote:
          # Alias-mode QEMU access goes through the host-side slirp listener.
          # The guest itself obtains 10.9.8.7/24 internally, but Ansible
          # connects to the host alias and forwarded SSH port.
          ansible_host: 10.9.8.108
          ansible_port: 2222
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3
