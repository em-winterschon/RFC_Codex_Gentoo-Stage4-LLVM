---
storage_confirm_destroy: true
storage_allow_mdadm_under_zfs: false

liveiso_work_dir: /root/gentoo-liveiso-work
install_target_root: /mnt/gentoo
install_arch: amd64
install_boot_mode: uefi
preflight_require_runtime_uefi: false

install_hostname: vm-elasticsearch-test
install_timezone: America/Los_Angeles
install_keymap: us
install_locale: en_US.UTF-8 UTF-8
install_root_password_hash: ""

storage_layout: single-drive
storage_devices:
  - /dev/disk/by-id/ata-QEMU_HARDDISK_stage4-root
esp_size_mib: 1024
swap_size_gib: 16
zpool_name: rpool
zpool_compatibility: 'off'
zpool_altroot: "{{ install_target_root }}"

stage3_flavor: llvm-openrc
stage3_base_url: https://mirrors.kernel.org/gentoo/releases/amd64/autobuilds
stage3_verify_checksum: true
portage_sync_command: "true"
portage_enable_repositories: []

profile_overlay_name: local-install-profile
profile_name: install-target
profile_parents:
  - gentoo:default/linux/amd64/23.0/llvm

portage_cpu_profile: x86_64_v2_generic
gpu_stack: none

kernel_strategy: gentoo-kernel-bin
boot_strategy: zfsbootmenu
boot_create_efi_nvram_entry: false
zfsbootmenu_prefer: "{{ zpool_name }}/ROOT/gentoo"
zfsbootmenu_timeout: 0
zfsbootmenu_import_policy: force
install_kernel_cmdline: "root=ZFS={{ zpool_name }}/ROOT/gentoo ro console=tty0 console=ttyS0,115200 ip=10.9.8.91::10.9.8.1:255.255.255.0:vm-elasticsearch-test:eth0:none"

install_openssh: true
install_networkmanager: true
networkmanager_connections:
  - name: pathb-static
    type: ethernet
    mac_address: "52:54:00:12:34:91"
    ipv4_method: manual
    addresses:
      - 10.9.8.91/24
    gateway4: 10.9.8.1
    dns4:
      - 9.9.9.9
      - 8.8.8.8
    ipv6_method: ignore
root_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICGaGcRcmW6vcZqb3lqUHxoHdc5kLf3PKV3RdtBeZdYn eva@null.ed25519
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB18sYCCsAYkwctlHZpbZYGcwZ7WCrP1xrHpi5KCtbD7 root@x12again
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILBdCx793g3Ij9Eo1mUCve41JM9W/eIf4JcJPaEoJMHJ codex@x12again
finalize_unmount_target: false
finalize_reboot_host: false

portage_accept_license: "* *.*"
portage_features:
  - buildpkg
  - parallel-install
  - merge-sync
portage_global_use:
  - bindist
  - bzip2
  - cli
  - ipv6
  - lld
  - zstd
portage_extra_use:
  - "-systemd"
portage_package_mask_files:
  00-no-systemd: |
    sys-apps/systemd
portage_package_use_files:
  10-no-systemd-openrc: |
    sys-auth/pambase elogind
    net-misc/networkmanager elogind
portage_makeopts_jobs: 16
portage_emerge_jobs: 4
portage_load_average: 16
portage_gpg_key_refresh: false
portage_buildpkg_enabled: true
portage_usepkg_enabled: true
portage_getbinpkg_enabled: true
portage_binhost: http://10.9.8.90:8088/stage4-hardened-llvm-merged_usr__stage5-service_container-gentoo_stage4_llvm_clang_hardened__amd64__x86_64_v2_generic
portage_binrepos:
  - name: stage4-hardened-llvm-merged_usr__stage5-service_container-gentoo_stage4_llvm_clang_hardened__amd64__x86_64_v2_generic
    priority: 10
    sync_uri: http://10.9.8.90:8088/stage4-hardened-llvm-merged_usr__stage5-service_container-gentoo_stage4_llvm_clang_hardened__amd64__x86_64_v2_generic
