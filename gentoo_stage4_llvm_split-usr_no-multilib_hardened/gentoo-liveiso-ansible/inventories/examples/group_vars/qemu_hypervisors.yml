---
qemu_memory_drives_enabled: false
qemu_memory_drives_mount_root: /dev/shm/qemu-memory-drives
qemu_memory_drives_tmpfs_size: 256G
qemu_memory_drives_instance_name: stage4-devvm
qemu_memory_drives:
  - name: portage-cache
    size_gib: 64
    format: qcow2
    serial: mem-portage-cache
    device_model: virtio-blk-pci
    purpose_tags:
      - portage
      - cache
  - name: container-ephemeral
    size_gib: 64
    format: qcow2
    serial: mem-container-ephemeral
    device_model: virtio-blk-pci
    purpose_tags:
      - containers
      - ephemeral
