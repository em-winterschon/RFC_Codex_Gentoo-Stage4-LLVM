---
profile_definition_files:
  - "{{ playbook_dir }}/../profile-definitions/llvm-clang-hardened-portage.yml"
  - "{{ playbook_dir }}/../profile-definitions/cloud-init-baremetal.yml"
  - "{{ playbook_dir }}/../profile-definitions/metal-builder-farm-node.yml"

install_networkmanager: false
install_openssh: true

profile_cloud_init:
  enabled: true
  disable_root: false
  ssh_pwauth: false

profile_local_user_accounts:
  - name: ops
    comment: Builder farm operator
    groups:
      - wheel
    sudo_nopasswd: true
    ssh_authorized_keys: []

profile_distcc_farm:
  builder_fabric_name: bluefield-builder-fabric
  builder_fabric_cidr: 10.66.40.0/24
  allowed_client_cidrs:
    - 10.66.40.0/24
