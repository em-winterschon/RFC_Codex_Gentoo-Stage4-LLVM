---
# Safety rails
storage_confirm_destroy: true
storage_allow_mdadm_under_zfs: false

# LiveISO and target root
liveiso_work_dir: /root/gentoo-liveiso-work
install_target_root: /mnt/gentoo
install_arch: amd64
install_boot_mode: uefi

# Target identity
install_hostname: gentoo
install_timezone: America/Los_Angeles
install_keymap: us
install_locale: en_US.UTF-8 UTF-8
install_root_password_hash: ""

# Storage model
# Supported values:
#   single-drive
#   raid-1
#   raid-10
#   zfs-mirror
#   zfs-boot-root-mirror
#   zraid1
#   zraid2
#   zraid3
#   draid
storage_layout: zfs-boot-root-mirror
storage_devices:
  - /dev/disk/by-id/ata-SATADOM-SL_3IE3_V2_BCA11708020382305
  - /dev/disk/by-id/ata-SATADOM-SL_3IE3_V2_BCA11708020382932
  - /dev/disk/by-id/ata-HBS3A1919A7E6B1_A03A5659
  - /dev/disk/by-id/ata-HBS3A1919A7E6B1_A03A58E2
zfs_boot_pool_devices:
  - /dev/disk/by-id/ata-SATADOM-SL_3IE3_V2_BCA11708020382305
  - /dev/disk/by-id/ata-SATADOM-SL_3IE3_V2_BCA11708020382932
zfs_root_pool_devices:
  - /dev/disk/by-id/ata-HBS3A1919A7E6B1_A03A5659
  - /dev/disk/by-id/ata-HBS3A1919A7E6B1_A03A58E2
esp_size_mib: 1024
swap_size_gib: 16
zpool_name: rpool
zpool_compatibility: 'off'
zpool_altroot: "{{ install_target_root }}"

# dRAID tuning (only used when storage_layout == draid)
draid_parity: 1
# Example explicit draid syntax override:
# draid_vdev_spec_override: "draid1:8d:1s:24c /dev/disk/by-id/..."

# Gentoo base
# Current official stage3 directories include llvm-openrc, nomultilib-openrc,
# hardened-openrc, musl-llvm, and others. This scaffold defaults to llvm-openrc,
# then layers a custom local profile for split-usr + no-multilib + hardened.
stage3_flavor: llvm-openrc
stage3_base_url: https://distfiles.gentoo.org/releases/amd64/autobuilds
stage3_verify_checksum: true
portage_sync_command: emerge-webrsync

# Local profile overlay for combined stable profile axes
profile_overlay_name: local-install-profile
profile_name: install-target
profile_parents:
  - gentoo:default/linux/amd64/23.0/llvm
  - gentoo:default/linux/amd64/23.0/split-usr/no-multilib/hardened
# Optional repo-local YAML profile definitions. These can add overlay repository
# enable/sync operations plus extra make.conf, package.use, and package.mask
# fragments without editing the roles themselves.
profile_definition_files: []
# Example:
# profile_definition_files:
#   - "{{ playbook_dir }}/../profile-definitions/llvm-clang-hardened-portage.yml"
#   - "{{ playbook_dir }}/../profile-definitions/vm-guest-simple-ipxe.yml"
#
# Optional host-specific local users and matching NoCloud seed data for VM images:
# profile_local_user_accounts:
#   - name: deploy
#     groups:
#       - wheel
#     sudo_nopasswd: true
#     ssh_authorized_keys: []
#
# profile_cloud_init:
#   enabled: true
#   instance_id: vm-guest-simple
#   local_hostname: ipxe-test

# Toolchain and tuning
portage_cpu_profile: x86_64_v2_generic
# GPU stack values:
#   amdgpu
#   nvidia
#   intel
#   none
gpu_stack: amdgpu

# Package strategy
kernel_strategy: gentoo-kernel-bin
kernel_package_map:
  gentoo-kernel-bin: sys-kernel/gentoo-kernel-bin
  gentoo-kernel: sys-kernel/gentoo-kernel
  gentoo-sources: sys-kernel/gentoo-sources

# Boot loader values: zfsbootmenu or efistub
boot_strategy: zfsbootmenu
zfsbootmenu_efi_url: https://get.zfsbootmenu.org/efi
zfsbootmenu_boot_label: ZFSBootMenu
zfsbootmenu_prefer: "{{ zpool_name }}/ROOT/gentoo"
zfsbootmenu_timeout: 0
install_kernel_cmdline: "root=ZFS={{ zpool_name }}/ROOT/gentoo ro console=tty0 console=ttyS0,115200"

# Installed services and finalization
install_openssh: true
install_networkmanager: true
root_authorized_keys: []
finalize_unmount_target: false
finalize_reboot_host: false

# Optional managed OpenRC services. Each item installs:
#   /usr/local/libexec/<name>
#   /etc/conf.d/<name>
#   /etc/init.d/<name>
# and enables the service with rc-update when enabled=true.
# openrc_action_services:
#   - name: stage4-example
#     description: Example managed daemon action
#     command: /usr/sbin/crond -f
#     runlevel: default
#     user: root
#     group: root
#     enabled: false
#
# Or load a repo-managed definition file at runtime:
# ansible-playbook ... -e @service-definitions/stage4-heartbeat.yml

# Optional explicit CPU_FLAGS_X86 override. Leave empty to omit from make.conf.
cpu_flags_x86_override: []

# Optional custom make.conf additions
portage_accept_license: "-* @FREE @BINARY-REDISTRIBUTABLE"
portage_features:
  - parallel-install
  - merge-sync
portage_global_use:
  - bindist
  - bzip2
  - cli
  - ipv6
  - lld
  - zstd
portage_extra_use: []
portage_makeopts_jobs: "{{ ansible_processor_vcpus | default(8) }}"
portage_emerge_jobs: 4
portage_load_average: 0
portage_gpg_key_refresh: false

# Optional role override. Leave undefined to run the default role sequence.
# Preferred staged execution path:
# install_sequence: full-default
# install_stage_filter: []
# install_debug_checkpoints: false
#
# Sequence enum values:
#   full-default
#   full-modular-zfs
#   storage-foundation
#   chroot-bootstrap
#   target-integration
#   repair-boot
#   repair-services
#
# Optional stage filter example:
# install_stage_filter:
#   - target-integration
#
# The run-install-sequence.sh wrapper also enables a structured JSONL
# control-flow pipeline via ANSIBLE_CONTROL_FLOW_PATH so long-running
# installs can be tailed remotely.
#
# Default sequence:
# selected_roles:
#   - preflight
#   - liveiso_prepare
#   - storage
#   - stage3
#   - profile
#   - portage
#   - chroot_base
#   - system_packages
#   - boot
#   - network
#   - services
#
# Alternate modular sequence translated from the external /opt scaffolding:
# selected_roles:
#   - preflight
#   - liveiso_prepare
#   - storage
#   - zfs
#   - stage3
#   - profile
#   - portage
#   - chroot_base
#   - kernel
#   - bootloader
#   - finalize
#
# Do not mix the compatibility wrapper roles with their underlying roles in the same list:
#   kernel <-> system_packages
#   bootloader <-> boot
#   finalize <-> network, services
