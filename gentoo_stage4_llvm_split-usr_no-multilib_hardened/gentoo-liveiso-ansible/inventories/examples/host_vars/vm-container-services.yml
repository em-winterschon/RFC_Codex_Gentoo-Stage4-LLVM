---
profile_definition_files:
  - "{{ playbook_dir }}/../profile-definitions/llvm-clang-hardened-portage.yml"
  - "{{ playbook_dir }}/../profile-definitions/hardened-llvm-stage4-merged-usr.yml"
  - "{{ playbook_dir }}/../profile-definitions/cloud-init-vm.yml"
  - "{{ playbook_dir }}/../profile-definitions/logging-rsyslog-client.yml"
  - "{{ playbook_dir }}/../profile-definitions/telemetry-node-exporter-client.yml"
  - "{{ playbook_dir }}/../profile-definitions/telemetry-podman-exporter.yml"
  - "{{ playbook_dir }}/../profile-definitions/netbox-managed-inventory.yml"
  - "{{ playbook_dir }}/../profile-definitions/container-service-base-image.yml"
  - "{{ playbook_dir }}/../profile-definitions/container-rsyslog-collector.yml"
  - "{{ playbook_dir }}/../profile-definitions/container-ipmi-exporter.yml"
  - "{{ playbook_dir }}/../profile-definitions/container-redfish-exporter.yml"
  - "{{ playbook_dir }}/../profile-definitions/vm-guest-simple-ipxe.yml"
  - "{{ playbook_dir }}/../profile-definitions/vm-container-services.yml"

install_networkmanager: true
install_openssh: true
install_hostname: container-services

portage_buildpkg_enabled: true
portage_usepkg_enabled: true
portage_getbinpkg_enabled: true
portage_pkgdir: /var/lib/container-services-ephemeral/binpkgs
portage_makeopts_jobs: 64
portage_emerge_jobs: 16
portage_load_average: 60
portage_binhost: http://10.9.8.90:8088/stage4-hardened-llvm-merged_usr__stage5-service_container-gentoo_stage4_llvm_clang_hardened__amd64__x86_64_v2_generic
portage_emerge_default_opts_extra:
  - --autounmask=y
  - --autounmask-backtrack=y
  - --autounmask-continue=y
  - --autounmask-unrestricted-atoms=y
  - --autounmask-use=y
  - --autounmask-write=y
portage_binrepos:
  - name: stage4-hardened-llvm-merged_usr__stage5-service_container-gentoo_stage4_llvm_clang_hardened__amd64__x86_64_v2_generic
    priority: 10
    sync_uri: http://10.9.8.90:8088/stage4-hardened-llvm-merged_usr__stage5-service_container-gentoo_stage4_llvm_clang_hardened__amd64__x86_64_v2_generic

profile_cloud_init:
  enabled: true
  instance_id: vm-container-services
  local_hostname: container-services
  disable_root: false
  ssh_pwauth: false

profile_local_user_accounts:
  - name: deploy
    comment: Container deployment operator
    groups:
      - wheel
    sudo_nopasswd: true
    ssh_authorized_keys: []

profile_container_app_profiles:
  ntfy:
    enabled: true
  nginx:
    enabled: true
  haproxy:
    enabled: true
  ipmi_exporter:
    enabled: true
  redfish_exporter:
    enabled: true

profile_container_services:
  runtime_root: /var/lib/container-services-ephemeral

profile_memory_storage:
  enabled: true
  mounts:
    - path: /var/lib/container-services-ephemeral
      size: 32G
      mode: "0755"
      options:
        - noatime
    - path: /var/tmp/portage-tmpfs
      size: 48G
      mode: "1777"
      options:
        - noatime

profile_site_security_profile:
  compliance_mode: strict
  firewall:
    allowed_management_cidrs:
      - 10.9.8.0/24
      - 172.16.99.0/24
  ipam:
    source: flat-file-json
    flat_file_json:
      site: example-lab
      networks:
        apps:
          gateway: 10.77.1.1
          subnet: 10.77.1.0/24
        mgmt:
          gateway: 10.77.0.1
          subnet: 10.77.0.0/24

profile_rsyslog:
  forward_enabled: true
  forward_hostname: log-vip.example.internal
  forward_protocol: tcp
  forward_port: 514
