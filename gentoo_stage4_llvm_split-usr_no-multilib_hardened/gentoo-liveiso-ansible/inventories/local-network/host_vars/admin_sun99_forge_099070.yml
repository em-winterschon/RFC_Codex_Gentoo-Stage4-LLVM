      chipset: Intel X553
      mac_address: "00:07:32:78:65:C8"
      target_driver: vfio-pci
      target_switch: gw_rfc99_mkccr2004_16g
      target_switch_port: ge3
      cutover_note: Move cable from CSS326 ge18 to CCR2004 ge3 after bond0 no longer uses eno1.
    - name: eno2
      pci_address: "0000:06:00.1"
      driver_before_binding: ixgbe
      chipset: Intel X553
      mac_address: "00:07:32:78:65:C9"
      target_driver: vfio-pci
      target_switch: gw_rfc99_mkccr2004_16g
      target_switch_port: ge4
      cutover_note: 10.64.64.70/24 was removed; keep unnumbered for OVS-DPDK/VPP.
    - name: eno3
