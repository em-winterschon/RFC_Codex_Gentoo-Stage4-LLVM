  backout:
    - Restore CSS326 LACP group 2 to ge17/ge18.
    - Restore /etc/conf.d/net with config_netboot0 and routes_netboot0 for 172.16.99.70/24.
    - Restart net.netboot0, then validate SSH to 172.16.99.70 before stopping net.bond0.
