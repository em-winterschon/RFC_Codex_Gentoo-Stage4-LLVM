---
ansible_host: 172.16.99.70
ansible_user: root
ansible_python_interpreter: /usr/bin/python3
local_network_role: automation-admin

profile_definition_files:
  - "{{ playbook_dir }}/../profile-definitions/aaa-domain-client.yml"
  - "{{ playbook_dir }}/../profile-definitions/secure-firstboot-enrollment.yml"
  - "{{ playbook_dir }}/../profile-definitions/metal-forge-automation-admin.yml"

install_target_root: /
install_hostname: admin-sun99-forge-099070
install_storage_layout:
  efi_boot_disk: /dev/sda
  efi_boot_role: local-ipxe-chainloader-only
  zfs_pool_name: zroot
  zfs_pool_topology: mirror
  zfs_mirror_disks:
    - /dev/nvme0n1
    - /dev/nvme1n1
  destructive_wipe_approved: true
  wipe_scope:
    - /dev/sda
    - /dev/nvme0n1
    - /dev/nvme1n1
  firmware_probe:
    fwupd_candidate: true
    expected_likely_result: vendor-bios-update-required
hardware_acceleration:
  intel_qat:
    enabled: true
    generation: c3000
    pci_address: "0000:01:00.0"
    pci_id: "8086:19e2"
    kernel_driver_observed: c3xxx
    kernel_modules:
      - intel_qat
      - qat_c3xxx
    required_firmware:
      - qat_c3xxx.bin
      - qat_c3xxx_mmp.bin
    consumer_enablement_status:
      openssl: planned
      haproxy_tls: planned
      nginx_tls: planned
      openzfs: ci_cd_required
    validation_policy:
      production_default: disabled_until_benchmarked
      required_gates:
        - kernel_module_load
        - firmware_present
        - qat_service_or_userspace_runtime
        - openssl_provider_or_engine_smoke_test
        - haproxy_tls_rps_baseline
        - nginx_tls_rps_baseline
        - openzfs_qat_build_pipeline
        - zfs_compression_encryption_checksum_benchmark
freeipa_client_apply_required: false
freeipa_client_fqdn: admin-sun99-forge-099070.rfc1918.host
freeipa_client_short_hostname: admin-sun99-forge-099070
freeipa_client_realm: RFC1918.HOST
freeipa_client_domain: rfc1918.host
freeipa_client_server: ipa01.rfc1918.host
freeipa_client_server_ip: 172.16.99.63
freeipa_client_controller_inventory_host: svc_identity_ipa01
freeipa_client_validate_user: codex-admin
freeipa_client_pam_validate_user: codex-admin
freeipa_client_manage_hostname: true
freeipa_client_manage_hosts_fallback: true
freeipa_client_install_packages: false
freeipa_client_build_binary_packages: true
freeipa_client_package_atoms:
  - sys-auth/sssd
  - net-fs/samba
  - app-crypt/mit-krb5
  - net-nds/openldap
  - app-misc/ca-certificates

secure_firstboot_enrollment_enabled: false
secure_firstboot_enrollment_expected_fqdn: admin-sun99-forge-099070.rfc1918.host
secure_firstboot_enrollment_command: >-
  ipa-client-install
  --unattended
  --domain="${STAGE5_ENROLL_DOMAIN}"
  --realm="${STAGE5_ENROLL_REALM}"
  --server="${STAGE5_ENROLL_IPA_SERVER}"
  --hostname="${STAGE5_ENROLL_FQDN}"
  --password="${STAGE5_ENROLL_OTP}"
  --mkhomedir
