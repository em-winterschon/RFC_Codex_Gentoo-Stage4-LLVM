m70_network_target:
  approved_at: "2026-05-24T16:24:11Z"
  live_cutover_at: "2026-05-24T17:27:32Z"
  coordinator: LTC Forge
  status: live-temporary-active-backup
  service_address: 172.16.99.70/24
  gateway: 172.16.99.1
  initramfs_netboot_interface: netboot0
  persistent_management_interface: bond0
  persistent_management_service: net.bond0
  openrc_network_config: /etc/conf.d/net
  bond0:
    live_mode: active-backup
    desired_future_mode: 802.3ad
    desired_future_lacp_rate: fast
    desired_future_xmit_hash_policy: layer3+4
    miimon: 100
    primary: netboot0
    members:
      - name: netboot0
        pci_address: "0000:02:00.0"
        driver: igb
        chipset: Intel i211
        mac_address: "00:07:32:78:65:C6"
        switch: sw_mgmt_css326
        switch_port: ge14
        live_role: active-slave
      - name: enp3s0
        pci_address: "0000:03:00.0"
        driver: igb
        chipset: Intel i211
        mac_address: "00:07:32:78:65:C7"
        switch: sw_mgmt_css326
        switch_port: ge17
        live_role: backup-slave
    notes:
      - The initramfs still names and uses netboot0 for iPXE/ZFS-root bootstrapping.
      - The persistent root now owns 172.16.99.70/24 and the default route on bond0.
      - Active-backup was selected live because CSS326 SwOS LACP mutation is not yet tested automation.
      - Future 802.3ad requires CSS326 LACP group membership on ge14/ge17 before changing M70 bond mode.
    openrc_fragment:
      - config_bond0="172.16.99.70/24"
      - routes_bond0="default via 172.16.99.1"
      - dns_servers_bond0="172.16.99.1 9.9.9.9"
      - slaves_bond0="netboot0 enp3s0"
      - mode_bond0="active-backup"
      - miimon_bond0="100"
      - primary_bond0="netboot0"
      - config_netboot0="null"
      - config_enp3s0="null"
      - config_eno1="null"
      - config_eno2="null"
      - config_eno3="null"
      - config_eno4="null"
  live_state_as_of_2026_05_24:
    bond0: owns 172.16.99.70/24 and default route via 172.16.99.1.
    active_slave: netboot0
    backup_slave: enp3s0
    openvpn_fmt2: restarted after network bounce; FMT2 routes restored through tun-fmt2.
    net_netboot0_runlevel: removed from default runlevel after cutover; service was not stopped live.
    eno2: 10.64.64.70/24 was removed live; do not persist host addressing on eno2.
  reserved_ovs_dpdk_sriov_ports:
    - name: eno1
      pci_address: "0000:06:00.0"
      driver_before_binding: ixgbe
      chipset: Intel X553
      mac_address: "00:07:32:78:65:C8"
      target_driver: vfio-pci
      target_switch: gw_rfc99_mkccr2004_16g
      target_switch_port: ge3
      live_validation: CCR2004 bridge FDB learned C8 on ge3 after L2 probe.
    - name: eno2
      pci_address: "0000:06:00.1"
      driver_before_binding: ixgbe
      chipset: Intel X553
      mac_address: "00:07:32:78:65:C9"
      target_driver: vfio-pci
      target_switch: gw_rfc99_mkccr2004_16g
      target_switch_port: ge4
      live_validation: CCR2004 bridge FDB learned C9 on ge4 after L2 probe; no host IPv4 address remains.
    - name: eno3
      pci_address: "0000:07:00.0"
      driver_before_binding: ixgbe
      chipset: Intel X553
      mac_address: "00:07:32:78:65:CA"
      target_driver: vfio-pci
      target_switch: gw_rfc99_mkccr2004_16g
      target_switch_port: ge5
      live_validation: CCR2004 bridge FDB learned CA on ge5 after L2 probe.
    - name: eno4
      pci_address: "0000:07:00.1"
      driver_before_binding: ixgbe
      chipset: Intel X553
      mac_address: "00:07:32:78:65:CB"
      target_driver: vfio-pci
      target_switch: gw_rfc99_mkccr2004_16g
      target_switch_port: ge6
      live_validation: CCR2004 bridge FDB learned CB on ge6 after L2 probe.
  backout:
    - Restore /root/m70-net-pre-bond0-cutover.conf.<timestamp> to /etc/conf.d/net.
    - Stop net.bond0 and start net.netboot0.
    - Validate SSH to 172.16.99.70 before changing or stopping any other network service.
    - CSS326 LACP backout is only required after a future 802.3ad switch-side LACP mutation.
  usb_serial_console_gateway:
    captured_at: "2026-05-17T18:59:00Z"
    status: active
    purpose: Host SUN99 RouterOS serial consoles and CyberPower USB UPS telemetry after migration off Hasslehoff.
    upstream_host_controller: "0000:00:15.0"
    interim_hub:
      manufacturer: VIA Labs, Inc.
      usb2_root_path: "1-2"
      usb2_vid_pid: "2109:2811"
      usb3_root_path: "2-2"
      usb3_vid_pid: "2109:8110"
      notes:
        - Generic hub has no per-port power control.
        - Replace with Coolgear CG-4PU3MGD managed hub after replacement power supply is available.
    console_links:
      - device: gw_rfc99_mkccr2004_16g
        prompt: "[admin@gw-rfc99-mkccr2004-16g] >"
        hub_port: 1
        adapter: FTDI FT232R USB UART
        adapter_serial: A9888PID
        by_id: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A9888PID-if00-port0
        by_path: /dev/serial/by-path/pci-0000:00:15.0-usb-0:2.1:1.0-port0
