        observed_kernel_driver: usbhid
        usb_path: "1-2.4.3.1"
        hidraw: /dev/hidraw0
        telemetry_preference: nut_usbhid_ups
    target_state:
      - Replace generic hub with Coolgear CG-4PU3MGD managed hub when power supply is available.
      - Move console access into a dedicated serial gateway VM after USB passthrough policy is implemented.
      - Attach a separate external OOB adapter before relying on M70 serial console recovery.

