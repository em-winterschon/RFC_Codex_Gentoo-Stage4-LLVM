      - device: sw_spine_crs309_rfc99
        prompt: "[admin@sw-spine-crs309-rfc99] >"
        hub_port: 2
        adapter: FTDI FT232R USB UART via dual-RS232 internal hub
        adapter_serial: AB0MRY3X
