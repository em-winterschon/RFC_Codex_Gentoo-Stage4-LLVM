  status: approved-pending-gated-cutover
  service_address: 172.16.99.70/24
  gateway: 172.16.99.1
  initramfs_netboot_interface: netboot0
  persistent_management_interface: bond0
  persistent_management_service: net.bond0
  openrc_network_config: /etc/conf.d/net
  bond0:
    mode: 802.3ad
    lacp_rate: fast
    miimon: 100
    xmit_hash_policy: layer3+4
    members:
      - name: netboot0
        pci_address: "0000:02:00.0"
        driver: igb
        chipset: Intel i211
        mac_address: "00:07:32:78:65:C6"
        switch: sw_mgmt_css326
        switch_port: ge14
      - name: enp3s0
        pci_address: "0000:03:00.0"
        driver: igb
        chipset: Intel i211
        mac_address: "00:07:32:78:65:C7"
        switch: sw_mgmt_css326
        switch_port: ge17
    notes:
      - The initramfs still names and uses netboot0 for iPXE/ZFS-root bootstrapping.
      - The persistent root should move 172.16.99.70/24 and the default route from netboot0 to bond0 during the gated cutover.
      - CSS326 LACP group 2 must move from ge17/ge18 to ge14/ge17 before restarting M70 networking.
    openrc_fragment:
      - config_bond0="172.16.99.70/24"
      - routes_bond0="default via 172.16.99.1"
      - slaves_bond0="netboot0 enp3s0"
      - mode_bond0="802.3ad"
      - lacp_rate_bond0="fast"
      - miimon_bond0="100"
      - xmit_hash_policy_bond0="layer3+4"
  current_live_delta_as_of_2026_05_24:
    netboot0: owns 172.16.99.70/24 and the default route.
    bond0: currently contains enp3s0 plus eno1 and is unnumbered.
    eno2: 10.64.64.70/24 was removed live; do not persist host addressing on eno2.
