---
# Thor AGX is an Ubuntu/L4T inference host. Current service deployment is
# Podman plus NVIDIA CDI; Docker remains a legacy compatibility wrapper only.
inference_service_architecture: arm64
inference_service_accelerator: nvidia
inference_service_container_engine: podman
inference_service_manager: systemd
inference_service_network: host
inference_service_cdi_devices:
  - nvidia.com/gpu=all

inference_service_deferred_backends:
  - vllm
  - sglang

inference_service_live_audit:
  observed_at: "2026-05-26T16:56:00-07:00"
  os: Ubuntu 24.04.4 LTS
  kernel: 6.8.12-tegra
  l4t: R38.4.0
  nvidia_driver: "580.00"
  cuda_runtime: "13.0"
  podman_present: true
  podman_version: "4.9.3"
  docker_active: false
  docker_masked: true
  nvidia_cdi:
    path: /etc/cdi/nvidia.yaml
    devices:
      - nvidia.com/gpu=0
      - nvidia.com/gpu=all
  failed_units:
    - openipmi.service
  notes:
    - Ollama and Open WebUI are the first validated services.
    - Keep vLLM and SGLang deferred until arm64/L4T/CUDA 13 images are validated.
