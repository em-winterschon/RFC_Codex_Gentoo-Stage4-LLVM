---
ansible_host: 172.16.99.22
ansible_user: root
ansible_python_interpreter: /usr/bin/python3
local_network_role: m70-canary-validation
stage5_profile: m70-canary-gentoo-stage4
fqdn: sbsoc-accel-int64-m70n2.rfc1918.host
dns_aliases:
  - m70n2.rfc1918.host
  - m70-canary.rfc1918.host
observed_service_ip: 172.16.99.22

# Netboot is an installer/rescue path only. The persistent OS boots locally from
# the mirrored NVMe ZFS install.
netboot_enabled: true
netboot_host_alias: m70-canary
netboot_script_name: m70-canary.ipxe
netboot_interface_name: netboot0
netboot_mac_address: "00:07:32:58:73:34"
netboot_static_address: 172.16.99.22
netboot_gateway: 172.16.99.1
netboot_next_server: 172.16.99.88
netboot_type: static
netboot_protocol_flow: pxe-to-ipxe
netboot_os_type: linux
netboot_os_name: gentoo
netboot_os_version: stage4-llvm-openrc-m70-canary
netboot_machine_type: metal
netboot_arch: amd64
netboot_platform: uefi
netboot_firmware_policy: uefi-pxe-efi-only
netboot_role: m70-canary-install
netboot_status: persistent-install-pending

# Safety rails
storage_confirm_destroy: true
storage_allow_mdadm_under_zfs: false

# LiveISO and target root
liveiso_work_dir: /root/gentoo-liveiso-work
install_target_root: /mnt/gentoo
install_arch: amd64
install_boot_mode: uefi

# Target identity
install_hostname: sbsoc-accel-int64-m70n2
install_timezone: America/Los_Angeles
install_keymap: us
install_locale: en_US.UTF-8 UTF-8
install_root_password_hash: ""

# Storage model. These two KIOXIA NVMe devices were discovered over the canary
# serial console from the old HBSD/FreeBSD shell on 2026-05-22. The SATA-DOM is
# intentionally excluded from the install target set.
storage_layout: zfs-mirror
storage_devices:
  - /dev/disk/by-id/nvme-eui.8ce38e0403ef1a38
  - /dev/disk/by-id/nvme-eui.8ce38e0403ef1adf
m70_canary_excluded_storage_devices:
  - freebsd_name: ada0
    linux_expected_by_id: /dev/disk/by-id/ata-SATADOM-SH_3ME3_20180915AA9241033080
    model: SATADOM-SH 3ME3
    serial: "20180915AA9241033080"
    reason: Existing SATA-DOM boot media must not be used for the persistent Gentoo install.
m70_canary_discovered_nvme_devices:
  - freebsd_name: nda0
    linux_expected_by_id: /dev/disk/by-id/nvme-eui.8ce38e0403ef1a38
    model: KBG50ZNS256G NVMe KIOXIA 256GB
    serial: 82HPG1DLQEKK
    size_gib: 238
  - freebsd_name: nda1
    linux_expected_by_id: /dev/disk/by-id/nvme-eui.8ce38e0403ef1adf
    model: KBG50ZNS256G NVMe KIOXIA 256GB
    serial: 82HPG1I8QEKK
    size_gib: 238
esp_size_mib: 1024
swap_size_gib: 16
zpool_name: rpool
zpool_compatibility: "off"
zpool_altroot: "{{ install_target_root }}"

# Gentoo base
stage3_flavor: llvm-openrc
stage3_base_url: https://distfiles.gentoo.org/releases/amd64/autobuilds
stage3_verify_checksum: true
portage_sync_command: emerge-webrsync

# Local profile overlay for combined stable profile axes
profile_overlay_name: local-install-profile
profile_name: install-target
profile_parents:
  - gentoo:default/linux/amd64/23.0/llvm
  - gentoo:default/linux/amd64/23.0/split-usr/no-multilib/hardened
profile_definition_files:
  - "{{ playbook_dir }}/../profile-definitions/llvm-clang-hardened-portage.yml"
  - "{{ playbook_dir }}/../profile-definitions/aaa-domain-client.yml"
  - "{{ playbook_dir }}/../profile-definitions/secure-firstboot-enrollment.yml"
  - "{{ playbook_dir }}/../profile-definitions/base-hypervisor-qemu-libvirt.yml"
  - "{{ playbook_dir }}/../profile-definitions/slurm-worker-node.yml"
  - "{{ playbook_dir }}/../profile-definitions/metal-builder-farm-node.yml"
profile_package_atoms:
  - sys-firmware/intel-microcode
  - sys-firmware/amd-ucode

# Toolchain and tuning
portage_cpu_profile: intel_atom_c3758_goldmont
gpu_stack: none
cpu_flags_x86_override: []

# Package strategy
kernel_strategy: gentoo-kernel
kernel_package_map:
  gentoo-kernel-bin: sys-kernel/gentoo-kernel-bin
  gentoo-kernel: sys-kernel/gentoo-kernel
  gentoo-sources: sys-kernel/gentoo-sources
kernel_package_atom_override: =sys-kernel/gentoo-kernel-6.18.18
zfs_package_atom: =sys-fs/zfs-2.3.6
zfs_kmod_package_atom: =sys-fs/zfs-kmod-2.3.6

# Boot loader values: zfsbootmenu or efistub
boot_strategy: zfsbootmenu
zfsbootmenu_efi_url: https://get.zfsbootmenu.org/efi
zfsbootmenu_boot_label: ZFSBootMenu
zfsbootmenu_prefer: "{{ zpool_name }}/ROOT/gentoo"
zfsbootmenu_timeout: 0
install_kernel_cmdline: >-
  root=ZFS={{ zpool_name }}/ROOT/gentoo ro
  console=tty0 console=ttyS0,115200
  intel_iommu=on iommu=pt

# Installed services and finalization
install_openssh: true
install_networkmanager: true
root_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB18sYCCsAYkwctlHZpbZYGcwZ7WCrP1xrHpi5KCtbD7 root@livecd
finalize_unmount_target: false
finalize_reboot_host: false

# FreeIPA/AAA enrollment target
freeipa_client_fqdn: sbsoc-accel-int64-m70n2.rfc1918.host
freeipa_client_short_hostname: sbsoc-accel-int64-m70n2
freeipa_client_realm: RFC1918.HOST
freeipa_client_domain: rfc1918.host
freeipa_client_server: ipa01.rfc1918.host
freeipa_client_server_ip: 172.16.99.63
freeipa_client_controller_inventory_host: svc_identity_ipa01
freeipa_client_validate_user: codex-admin
freeipa_client_pam_validate_user: codex-admin
freeipa_client_manage_hostname: true
freeipa_client_manage_hosts_fallback: true
freeipa_client_install_packages: true
freeipa_client_build_binary_packages: true
freeipa_client_package_atoms:
  - sys-auth/sssd
  - net-fs/samba
  - app-crypt/mit-krb5
  - net-nds/openldap
  - app-misc/ca-certificates

# M70 network target state:
# - i211 pair is management only and stays outside OVS.
# - X553 ports are the OVS/LACP workload blast zone.
networkmanager_connections:
  - name: bond-mgmt
    type: bond
    interface_name: bond-mgmt
    autoconnect: true
    bond_options:
      mode: active-backup
      miimon: 100
      primary: netboot0
    ipv4_method: manual
    addresses:
      - 172.16.99.22/24
    gateway4: 172.16.99.1
    dns4:
      - 172.16.99.1
      - 9.9.9.9
    ipv6_method: ignore
  - name: bond-mgmt-netboot0
    type: ethernet
    interface_name: netboot0
    mac_address: "00:07:32:58:73:34"
    master: bond-mgmt
    slave_type: bond
    autoconnect: true
    ipv4_method: disabled
    ipv6_method: ignore
  - name: bond-mgmt-enp3s0
    type: ethernet
    interface_name: enp3s0
    mac_address: "00:07:32:58:73:35"
    master: bond-mgmt
    slave_type: bond
    autoconnect: true
    ipv4_method: disabled
    ipv6_method: ignore
  - name: br-ovs0
    type: ovs-bridge
    interface_name: br-ovs0
    autoconnect: true
    ipv4_method: disabled
    ipv6_method: ignore
  - name: ovs-workload0
    type: ovs-port
    interface_name: ovs-workload0
    master: br-ovs0
    slave_type: ovs-bridge
    autoconnect: true
    ovs_port_options:
      lacp: active
      bond-mode: balance-tcp
    ipv4_method: disabled
    ipv6_method: ignore
  - name: ovs-workload0-eno1
    type: ethernet
    interface_name: eno1
    mac_address: "00:07:32:58:73:36"
    master: ovs-workload0
    slave_type: ovs-port
    autoconnect: true
    ipv4_method: disabled
    ipv6_method: ignore
  - name: ovs-workload0-eno2
    type: ethernet
    interface_name: eno2
    mac_address: "00:07:32:58:73:37"
    master: ovs-workload0
    slave_type: ovs-port
    autoconnect: true
    ipv4_method: disabled
    ipv6_method: ignore
  - name: ovs-workload0-eno3
    type: ethernet
    interface_name: eno3
    mac_address: "00:07:32:58:73:38"
    master: ovs-workload0
    slave_type: ovs-port
    autoconnect: true
    ipv4_method: disabled
    ipv6_method: ignore
  - name: ovs-workload0-eno4
    type: ethernet
    interface_name: eno4
    mac_address: "00:07:32:58:73:39"
    master: ovs-workload0
    slave_type: ovs-port
    autoconnect: true
    ipv4_method: disabled
    ipv6_method: ignore

slurm_cluster_role: canary-worker
slurm_node_name: sbsoc-accel-int64-m70n2
slurm_node_cpus: 8
slurm_node_real_memory_mb: 32000
slurm_node_features:
  - m70
  - atom-c3758
  - canary
  - build
  - validation

m70_canary_serial_console_host: admin_sun99_forge_099070
m70_canary_serial_console: /dev/serial/by-id/usb-FTDI_FT2232H_device_FT5W5FZH-if01-port0
m70_canary_serial_baud: 115200
