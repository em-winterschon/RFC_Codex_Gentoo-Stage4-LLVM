---
all:
  vars:
    ansible_python_interpreter: auto_silent
  children:
    local_management:
      children:
        proxmox_hypervisors:
        netbox_services:
        identity_controllers:
        container_service_hosts:
        workstation_hosts:
        aaa_domain_clients:
        ipxe_validation_hosts:
        mikrotik_routeros:
        mikrotik_swos:
        gpu_compute:
        bmc_managed:
        dell_idrac:
        roce_hosts:

    proxmox_hypervisors:
      hosts:
        hasslehoff:
          ansible_host: 172.16.99.9
          ansible_user: root
          local_network_role: proxmox-hypervisor
          proxmox_api_host: 172.16.99.9
          proxmox_api_port: 8006
          proxmox_api_validate_certs: false
          proxmox_api_token_id: "{{ vault_hasslehoff_proxmox_api_token_id }}"
          proxmox_api_token_secret: "{{ vault_hasslehoff_proxmox_api_token_secret }}"

    gpu_compute:
      hosts:
        hasslehoff:

    roce_hosts:
      hosts:
        hasslehoff:
          nvidia_doca_ofed_enabled: false
          nvidia_doca_ofed_apply: false
          nvidia_doca_ofed_allow_custom_kernel: false

    bmc_managed:
      hosts:
        hasslehoff:
          bmc_redfish_enabled: false
          bmc_redfish_host: ipmi-verwalterin.rfc1918.host
          bmc_redfish_validate_certs: false
          bmc_redfish_username: "{{ vault_hasslehoff_ipmi_username | default('') }}"
          bmc_redfish_password: "{{ vault_hasslehoff_ipmi_password | default('') }}"
          bmc_redfish_allow_mutation: false

    dell_idrac:
      hosts: {}

    netbox_services:
      hosts:
        svc_netbox_stage4:
          ansible_host: 172.16.99.62
          ansible_user: root
          local_network_role: ipam-dcim
          parent_proxmox_host: hasslehoff
          parent_proxmox_vmid: 1062
          stage4_source_image: /opt/gentoo-virt-qemu/stage3/images/gentoo-stage4-testvm.qcow2
          stage5_profile: vm-netbox-service
          netbox_api_url: http://172.16.99.62
          netbox_validate_certs: false
          netbox_api_token: "{{ vault_netbox_api_token | default('') }}"
          target_netbox_version: 4.5.9
          observed_service_ip: 172.16.99.62

    identity_controllers:
      hosts:
        svc_identity_ipa01:
          ansible_host: 172.16.99.63
          ansible_user: codex
          ansible_become: true
          local_network_role: identity-controller
          parent_proxmox_host: hasslehoff
          parent_proxmox_vmid: 1063
          freeipa_fqdn: ipa01.rfc1918.host
          identity_realm: RFC1918.HOST
          identity_domain: rfc1918.host
          radius_auth_port: 1812
          radius_acct_port: 1813

    container_service_hosts:
      hosts:
        svc_container_services_safe_move_01:
          ansible_host: 172.16.99.89
          ansible_user: root
          local_network_role: container-services
          parent_proxmox_host: hasslehoff
          parent_proxmox_vmid: 1089
          stage5_profile: vm-container-services
          ntfy_vip: 172.16.99.96
          ntfy_hostname: msg-sun99-ntfysys-099096.rfc1918.host

    workstation_hosts:
      hosts:
        vm_workstation_nscde_gpu01:
          ansible_host: 172.16.99.94
          ansible_user: root
          local_network_role: workstation-nscde
          parent_proxmox_host: hasslehoff
          parent_proxmox_vmid: 1094
          stage5_profile: vm-workstation-nscde
          workstation_gpu_passthrough: true
          workstation_gpu_model: NVIDIA Quadro K1200
          workstation_binpkg_repo_id: stage4-lox__stage5-workstation-nscde__amd64__gpu-universal-xorg

    aaa_domain_clients:
      hosts:
        svc_netbox_stage4:
        svc_container_services_safe_move_01:
        vm_workstation_nscde_gpu01:

    ipxe_validation_hosts:
      hosts:
        gmktek_nucbox_k10_stage5_candidate:
          local_network_role: ipxe-stage5-validation-host
          hardware_model: GMKtek NucBox K10
          cpu_model: Intel Core i9-13900HK
          gpu_model: Intel Iris Xe
          expected_nic_speed: 2.5GbE
          observed_ipxe_nic_slot: "04:00:00"
          netboot_mac_address: "84:47:09:5F:21:64"
          connected_switch: sw_mgmt_css326
          connected_switch_port: ge16
          netboot_arch: amd64
          netboot_platform: uefi
          netboot_role: workstation-validation
          netboot_status: pending-ipxe-validation

    mikrotik_routeros:
      hosts:
        sw_mgmt_mkcrs354:
          ansible_host: 172.16.99.7
          ansible_user: admin
          ansible_password: "{{ vault_crs354_admin_password }}"
          ansible_ssh_common_args: -o StrictHostKeyChecking=no
          local_network_role: distribution-switch
          routeros_identity: sw-mgmt-mkcrs354
          routeros_model: CRS354-48G-4S+2Q+
          routeros_observed_serial_number: HJV0AWTYBCD
          routeros_transport: serial
          routeros_serial_console: /dev/ttyUSB1
          routeros_management_interface: ether49
          routeros_version_target: 7.22.2
          routeros_state_snapshot_enabled: false
          routeros_state_snapshot_reason: Prefer serial snapshots until CRS354 SSH command execution is normalized.
        sw_spine_crs309_rfc99:
          ansible_host: 172.16.99.8
          ansible_connection: local
          ansible_user: "{{ vault_rfc99_ccr2004_16g_admin_user }}"
          ansible_password: "{{ vault_rfc99_ccr2004_16g_admin_password }}"
          local_network_role: spine-aggregation-switch
          routeros_identity: sw-spine-crs309-rfc99
          routeros_model: CRS309-1G-8S+
          routeros_transport: serial
          routeros_serial_console: /dev/ttyUSB0
          routeros_management_interface: br-spine
          routeros_observed_version: 7.22.2
          routeros_observed_routerboard_firmware: 7.22.2
          routeros_version_target: 7.22.2
          routeros_state_snapshot_enabled: true
        rtr_mgmt_ccr2004:
          ansible_host: 172.16.99.120
          ansible_user: admin
          ansible_ssh_common_args: -o StrictHostKeyChecking=no
          local_network_role: routeros-gateway-candidate
          routeros_model: CCR2004-1G-2XS-PCIe
        gw_rfc99_mkccr2004_16g:
          ansible_connection: local
          ansible_user: "{{ vault_rfc99_ccr2004_16g_admin_user }}"
          ansible_password: "{{ vault_rfc99_ccr2004_16g_admin_password }}"
          ansible_ssh_common_args: -o StrictHostKeyChecking=no
          local_network_role: routeros-gateway-replacement
          routeros_identity: gw-rfc99-mkccr2004-16g
          routeros_model: CCR2004-16G-2S+PC
          routeros_observed_board_name: CCR2004-16G-2S+
          routeros_observed_version: 7.19.6
          routeros_observed_architecture: arm64
          routeros_replaces: gw_rfc99_mkcrs309
          routeros_transport: serial
          routeros_serial_console: /dev/ttyUSB2
          routeros_management_state: serial-discovered
          routeros_factory_default_ip: 192.168.88.1/24
          routeros_factory_default_interface: ether15
          routeros_version_target: 7.22.2

    mikrotik_swos:
      hosts:
        sw_mgmt_css326:
          ansible_host: 172.16.99.6
          ansible_connection: local
          local_network_role: access-switch
          swos_username: admin
          swos_password: "{{ vault_css326_admin_password }}"
          swos_model: CSS326-24G-2S+
          swos_identity: sw-mgmt-mkcss326
          swos_serial_number: HHD0AERY8JN
          swos_observed_version: 2.18.1751448030
          swos_version_target: 2.18.1751448030
          swos_management_protocol: http-digest
          swos_syslog_supported: false
          swos_snmp_enabled: true

    routeros_rfc99_gateways:
      hosts:
        gw_rfc99_mkccr2004_16g:
