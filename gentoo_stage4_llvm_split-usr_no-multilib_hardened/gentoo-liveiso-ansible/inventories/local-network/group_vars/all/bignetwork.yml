---
bignetwork_portal_accounts:
  codexian:
    provider: BigNetwork
    account_name: "{{ vault_bignetwork_codexian_account_name | default('codexian') }}"
    token_name: "{{ vault_bignetwork_codexian_token_name | default('BIGNETWORK_TOKEN_CODEXIAN') }}"
    api_token: "{{ vault_bignetwork_codexian_api_token | default('') }}"
    token_owner: "{{ vault_bignetwork_codexian_token_owner | default('Forge') }}"
    purpose: "{{ vault_bignetwork_codexian_purpose | default('FMT2/SFO200 SD-WAN transport validation') }}"

bignetwork_fmt2_transport:
  preferred_path: nanopi-r6s-transparent-l2-bridge
  interim_path: disposable-devuan-bn-client-smoketest
  network_id: "607daa3a01933028"
  network_name: SDWAN_NET
  edge_lite_node_id: "ab4af90f44"
  created_at: "2022-06-10T05:45:09"
  intentionally_isolated: true
  fmt2_primary_carp_vip: "10.200.99.1"
  target_sites:
    - FMT2
    - SFO200
  local_sites:
    - RFC99
    - SUN99
  notes:
    - Use the NanoPi R6S Edge Lite path when it has been re-onboarded in the BigNetwork portal.
    - Use per-host bn client tests only as interim reachability evidence.
    - SDWAN_NET was intentionally isolated from the FMT2 OPNsense router pair and should not be routed into 10.200.99.0/24 without an explicit change.

resolved_profile_bignetwork_edge:
  enabled: false
  auth_token: "{{ vault_bignetwork_codexian_api_token | default('') }}"
  orbit_enabled: true
  orbit_worlds:
    - world_id: 6aaf7fee5a
      seed: 6aaf7fee5a
  join_networks:
    - network_id: "607daa3a01933028"
      name: SDWAN_NET
  join_network_settings:
    allowDNS: false
    allowDefault: false
    allowGlobal: false
    allowManaged: true
  service_enabled: false
  service_started: false
