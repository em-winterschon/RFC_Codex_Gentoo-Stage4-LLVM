    endpoint_b:
      device: sw_mgmt_mkcrs354
      interface: sfp-sfpplus2
    purpose: crs309-crs354-lacp-member
    lag: crs309-crs354-lag
    media: 10G-SR
    fiber: MMF
    optics:
      endpoint_a:
        vendor: FS.com
        sku: SFP-10GSR-85
      endpoint_b:
        vendor: FS.com
        sku: SFP-10GSR-85
    status: active
    validation:
      status: link-ok
      rate: 10Gbps
      observed_at: 2026-05-04
  - endpoint_a:
