    name: container-applications
    prefix: 10.77.1.0/24
    status: planned
  - vlan_id: 1200
    name: oob-power-management
    prefix: operator-assigned
    status: planned
  - vlan_id: 1300
    name: builder-farm
    prefix: operator-assigned
