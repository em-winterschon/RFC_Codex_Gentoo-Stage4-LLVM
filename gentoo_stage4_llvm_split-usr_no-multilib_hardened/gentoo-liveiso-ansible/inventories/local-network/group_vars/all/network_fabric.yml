---
network_fabric_site: local-rfc1918-lab

network_fabric_management_prefix: 172.16.99.0/24
network_fabric_management_gateway: 172.16.99.1

network_fabric_media_defaults:
  sfp_plus_10g_default:
    media: 10G-SR
    fiber: MMF
    single_mode_fiber_in_use: false
    optic_vendors:
      - FS.com
      - 10Gtek
    reference_skus:
      fs_com_10g_sr: SFP-10GSR-85
      ten_gtek_10g_sr: AXS85-192-M3
  sfp_plus_10g_dac:
    media: 10G-DAC
    vendors:
      - generic-compatible
      - arista-compatible
      - intel-compatible
      - juniper-compatible

network_fabric_devices:
  hasslehoff:
    role: proxmox-hypervisor
    management_ip: 172.16.99.9
    management_interface: vmbr0
    notes:
      - Proxmox 8.4 host.
      - Management bridge rides bond0 over CSS326 ge5/ge6.
      - ConnectX-5 ports are reserved for RoCE-v2 and must not join vmbr0.
  sw_mgmt_css326:
    role: access-switch
    management_ip: 172.16.99.6
    management_protocol: swos-http
    model: CSS326-24G-2S+
    manufacturer: MikroTik
    serial_number: HHD0AERY8JN
    observed_swos_version: 2.18.1751448030
    swos_version_target: 2.18.1751448030
    observed_mac: f4:1e:57:89:af:be
    snmp:
      enabled: true
      community: rfc1918.read
      contact: toor@rfc1918.host
      location: RFC99-25U-WHT
    syslog:
      supported: false
      reason: SwOS CSS326 exposes SNMP and HTTP backup/state endpoints but no syslog destination controls in the observed 2.18 UI/API.
    notes:
      - Live SwOS snapshot archived under /root/operator-private/swos/css326.
      - Identity is sw-mgmt-mkcss326.
      - Static management IP is 172.16.99.6.
      - Address acquisition mode is static.
      - ge5 and ge6 are active LACP members for Hasslehoff bond0.
      - ge7 is assigned to Thor AGX RJ45 management for agx-rfc99-bunnydev at 172.16.99.34/24.
      - sfp1 and sfp2 currently contain Intel FTLX8571D3BCV-IT 10G-SR MMF optics.
  sw_mgmt_mkcrs354:
    role: distribution-switch
    management_ip: 172.16.99.7
    management_interface: ether49
    serial_console_host: hasslehoff
    serial_console: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AB0MRY3W-if00-port0
    serial_console_by_path: /dev/serial/by-path/pci-0000:00:14.0-usb-0:11.2.1:1.0-port0
    serial_console_current_tty: /dev/ttyUSB1
    serial_adapter_serial: AB0MRY3W
    serial_baud: 115200
    model: CRS354-48G-4S+2Q+
    serial_number: HJV0AWTYBCD
    observed_routeros_version: 7.22.2
    observed_routerboard_firmware: 7.22.2
    observed_architecture: mipsbe
    observed_memory: 128MiB
    observed_cpu_count: 1
    routeros_version_target: 7.22.2
    notes:
      - Live serial snapshot archived under /root/operator-private/routeros/crs354/20260504T194533Z.
      - Management currently rides ether49 at 172.16.99.7/24.
      - Stale sfp-sfpplus1 OPNsense address 172.16.254.7/24 was disabled during CRS309 spine cutover.
      - sfp-sfpplus1 and sfp-sfpplus2 are active LACP members toward CRS309 using 10G-SR over MMF.
      - sfp-sfpplus3 and sfp-sfpplus4 are already bond-qnap members for the QNAP TS435XEU archive server over 10G DAC.
      - QSFP 40G ports are disconnected and reserved for future RoCE-v2 RDMA fabric.
      - Serial console was moved from X12AGAIN to the Hasslehoff generic USB hub on 2026-05-10 and validated with prompt [admin@sw-mgmt-mkcrs354] >.
  sw_spine_crs309_rfc99:
    role: spine-aggregation-switch
    management_ip: 172.16.99.8
    management_interface: br-spine
    serial_console_host: hasslehoff
    serial_console: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AB0MRY3X-if00-port0
    serial_console_by_path: /dev/serial/by-path/pci-0000:00:14.0-usb-0:11.2.4:1.0-port0
    serial_console_current_tty: /dev/ttyUSB2
    serial_adapter_serial: AB0MRY3X
    serial_baud: 115200
    model: CRS309-1G-8S+
    observed_routeros_version: 7.22.2
    observed_routerboard_firmware: 7.22.2
    routeros_version_target: 7.22.2
    status: active
    notes:
      - Rebuilt from factory reset as sw-spine-crs309-rfc99.
      - Upgraded to RouterOS package and RouterBOARD firmware 7.22.2 on 2026-05-04.
      - Optional RouterOS container and zerotier packages were removed before upgrade to recover flash space.
      - CCR2004 gateway uplink is active on CRS309 sfp-sfpplus1 using FS.com SFP-10GSR-85 10G-SR optics over MMF.
      - CRS354 LACP is active on CRS309 sfp-sfpplus2 plus sfp-sfpplus3.
      - Hasslehoff QLogic QL41232HOCU LACP target is CRS309 sfp-sfpplus4 plus sfp-sfpplus5.
      - CSS326 10G aggregation target is CRS309 sfp-sfpplus8.
      - Serial console was moved from X12AGAIN to the Hasslehoff generic USB hub on 2026-05-10 and validated with prompt [admin@sw-spine-crs309-rfc99] >.
  qnap_archive_ts435xeu:
    role: archive-storage
    model: TS435XEU
    manufacturer: QNAP
    status: active
    notes:
      - 1U QNAP archive server.
      - Connected to CRS354 sfp-sfpplus3 plus sfp-sfpplus4 as bond-qnap over 10G DAC.
  agx_rfc99_bunnydev:
    role: edge-ai-gpu-host
    manufacturer: NVIDIA
    model: Jetson AGX Thor
    status: active
    management_ip: 172.16.99.34
    management_interface: enP2p1s0
    fqdn: agx-rfc99-bunnydev.rfc1918.host
    notes:
      - Thor AGX development host with RJ45 Realtek r8126 management on CSS326 ge7.
      - RJ45 management is statically configured as 172.16.99.34/24 on enP2p1s0.
      - QSFP28 data-plane cabling target is CRS354 qsfpplus2 with four 10G lanes for OVS/VM allocation.
  inf_rfc99_noctosultris_099165:
    role: inference-gpu-host
    manufacturer: Supermicro
    model: X12SPA-TF
    status: planned
    management_ip: 172.16.99.165
    management_interface: pending-live-validate
    fqdn: inf-rfc99-noctosultris-099165.rfc1918.host
    bmc_ip: 172.16.199.111
    notes:
      - 64-thread Xeon inference host with 4x NVIDIA A4000 and Optane-backed memory configuration.
      - Management IP moved from legacy 172.16.99.65 notation to 172.16.99.165 to avoid conflict with obs-sun99-vmetrics-099065.
      - BMC endpoint is reachable on 172.16.199.111 (Supermicro IPMI 2.0, firmware 1.05).
      - Switch port and cable mapping should be confirmed in NetBox before link-level policy automation is applied.
  rtr_mgmt_ccr2004:
    role: routeros-gateway-candidate
    management_ip: 172.16.99.120
    model: CCR2004-1G-2XS-PCIe
  gw_rfc99_mkccr2004_16g:
    role: routeros-gateway-replacement
    model: CCR2004-16G-2S+PC
    manufacturer: MikroTik
    status: planned
    replaces: gw_rfc99_mkcrs309
    serial_console_host: hasslehoff
    serial_console: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A9888PID-if00-port0
    serial_console_by_path: /dev/serial/by-path/pci-0000:00:14.0-usb-0:11.1:1.0-port0
    serial_console_current_tty: /dev/ttyUSB0
    serial_adapter_serial: A9888PID
    serial_baud: 115200
    observed_board_name: CCR2004-16G-2S+
    observed_routeros_version: 7.19.6
    observed_architecture: arm64
    observed_cpu_count: 4
    observed_memory: 4096MiB
    factory_default_ip: 192.168.88.1/24
    factory_default_interface: ether15
    notes:
      - Rackable replacement target for the CRS309 RouterOS gateway plan.
      - Management IP is intentionally unassigned until management-only bootstrap is rendered and applied.
      - Admin bootstrap credential is stored only in Ansible Vault.
      - Serial discovery archive is stored outside the repo under /root/operator-private/routeros/ccr2004-16g.
      - Factory default config has 192.168.88.1/24 on ether15 and broad management services enabled; do not expose it to production L2 before hardening.
      - Serial console was moved from X12AGAIN to the Hasslehoff generic USB hub on 2026-05-10 and validated with prompt [admin@gw-rfc99-mkccr2004-16g] >.
  ctbsd_rfc99_jailerprime_099099:
    role: retired-freebsd-jail-host
    hypervisor: hasslehoff
    proxmox_vmid: 1011
    status: stopped-retired
    notes:
      - Former NetBox jail host.
      - Superseded by svc_netbox_stage4 after repeated FreeBSD jail path instability.
  svc_netbox_stage4:
    role: ipam-dcim
    hypervisor: hasslehoff
    proxmox_vmid: 1062
    runtime: gentoo-stage4-vm
    status: active
    management_ip: 172.16.99.62
    api_url: http://172.16.99.62
    target_version: 4.5.9
    notes:
      - Stage4 Gentoo VM imported from the populated LLVM OpenRC QCOW image.
      - VM disk was expanded to 80 GiB before NetBox dependency bootstrap.
      - NetBox API validation passes with the root-only bootstrap token.
      - Essential NetBox operational integrations are installed under /opt/netbox-essentials.
      - Repo-safe local fabric seed created baseline site, VLAN, prefix, device, and management IP records.
  svc_identity_ipa01:
    role: identity-controller
    hypervisor: hasslehoff
    proxmox_vmid: 1063
    runtime: rocky-freeipa-vm
    status: active
    management_ip: 172.16.99.63
    fqdn: ipa01.rfc1918.host
    realm: RFC1918.HOST
    domain: rfc1918.host
    notes:
      - Rocky 9 FreeIPA controller candidate for centralized RBAC and AAA.
      - FreeRADIUS bridge is co-located initially for switch, router, firewall, WAP, and VPN AAA.
      - DNS remains external/static until RouterOS or NetBox-backed DNS is normalized.
      - FreeIPA, SSSD, and FreeRADIUS are validated; recovery snapshot is codex-freeipa-radius-live.
  obs_sun99_prometheus_099064:
    role: observability-prometheus
    hypervisor: hasslehoff
    proxmox_vmid: 1064
    runtime: gentoo-stage4-vm
    status: planned
    management_ip: 172.16.99.64
    fqdn: obs-sun99-prometheus-099064.rfc1918.host
    dns_aliases:
      - obs-sun99-prometheus.rfc1918.host
    notes:
      - Prometheus scrape scheduler for the SUN99 observability pipeline.
      - Remote-write target is VictoriaMetrics on obs-sun99-vmetrics-099065.
      - HTTPS access is intended behind the local HA-Proxy/private-CA path.
  obs_sun99_vmetrics_099065:
    role: observability-victoriametrics
    hypervisor: hasslehoff
    proxmox_vmid: 1065
    runtime: gentoo-stage4-vm
    status: planned
    management_ip: 172.16.99.65
    fqdn: obs-sun99-vmetrics-099065.rfc1918.host
    dns_aliases:
      - obs-sun99-vmetrics.rfc1918.host
    metrics_storage:
      provider: hasslehoff
      export: hasslehoff.rfc1918.host:/srv/exports/metrics/victoriametrics
      mountpoint: /srv/metrics/victoriametrics
      protocol_default: nfsv3_tcp
    notes:
      - VictoriaMetrics single-node retention store for Prometheus remote_write and collectd Graphite ingress.
      - Metrics persistence is intentionally modeled as a Hasslehoff NFS export before live VM provisioning.
      - Future storage upgrades should preserve the same client mountpoint to avoid service config churn.
  obs_sun99_grafana_099066:
    role: observability-grafana
    hypervisor: hasslehoff
    proxmox_vmid: 1066
    runtime: gentoo-stage4-vm
    status: planned
    management_ip: 172.16.99.66
    fqdn: obs-sun99-grafana-099066.rfc1918.host
    dns_aliases:
      - obs-sun99-grafana.rfc1918.host
    notes:
      - Grafana dashboard VM for SUN99 metrics visibility.
      - Default datasource is VictoriaMetrics with Prometheus kept as secondary.
  obs_sun99_kibana_099067:
    role: observability-kibana
    hypervisor: hasslehoff
    proxmox_vmid: 1067
    runtime: gentoo-stage4-vm
    status: planned
    management_ip: 172.16.99.67
    fqdn: obs-sun99-kibana-099067.rfc1918.host
    dns_aliases:
      - obs-sun99-kibana.rfc1918.host
    elasticsearch_endpoint: http://172.16.99.92:9200
    notes:
      - Kibana web interface for full-text infrastructure log search.
      - Initial target is the live CCR2004 SUN99 Elasticsearch VIP until the multi-node Elasticsearch service VIP is promoted.

