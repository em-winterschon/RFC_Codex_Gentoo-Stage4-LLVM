network_fabric_lags:
  hasslehoff-bond0:
    mode: 802.3ad
    switch: sw_mgmt_css326
    switch_ports:
      - ge5
      - ge6
    host: hasslehoff
    host_ports:
      - eno1
      - eno2
    validated: true
  crs309-crs354-lag:
    mode: 802.3ad
    switch_a: sw_spine_crs309_rfc99
    switch_a_ports:
      - sfp-sfpplus2
      - sfp-sfpplus3
    switch_b: sw_mgmt_mkcrs354
    switch_b_ports:
      - sfp-sfpplus1
      - sfp-sfpplus2
    media: 10G-SR
    fiber: MMF
    status: active
    validation:
      crs309_bond: bond-crs354
      crs354_bond: bond-crs309
      active_ports:
        crs309:
          - sfp-sfpplus2
          - sfp-sfpplus3
        crs354:
          - sfp-sfpplus1
          - sfp-sfpplus2
      observed_at: 2026-05-04
  qnap-ts435xeu-bond0:
    mode: 802.3ad
    switch: sw_mgmt_mkcrs354
    switch_ports:
      - sfp-sfpplus3
      - sfp-sfpplus4
    host: qnap_archive_ts435xeu
    host_ports:
      - sfpplus1
      - sfpplus2
    media: 10G-DAC
    observed_routeros_bond: bond-qnap
    status: observed
  hasslehoff-qlogic-bond0:
    mode: 802.3ad
    switch: sw_spine_crs309_rfc99
    switch_ports:
      - sfp-sfpplus4
      - sfp-sfpplus5
    host: hasslehoff
    host_ports:
      - enp4s0f0
      - enp4s0f1
    media: 10G-DAC
    observed_routeros_bond: bond-hasslehoff-qlogic
    linux_recommendation:
      bond_mode: 802.3ad
      lacp_rate: fast
      miimon: 100
      xmit_hash_policy: layer3+4
      initial_mtu: 1500
      future_mtu_after_path_validation: 9000
    status: planned

