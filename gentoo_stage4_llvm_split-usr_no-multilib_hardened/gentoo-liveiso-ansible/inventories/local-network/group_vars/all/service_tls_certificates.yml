      - ntfy.local
    service_ports:
      - "443/tcp"
      - "80/tcp"
    certificate_profile: server-auth
    certificate_authority: rfc1918_private_ca
    deploy_paths:
      haproxy_pem: /etc/container-services/apps/haproxy/tls/msg-sun99-ntfysys.pem
      trust_anchor: /usr/local/share/ca-certificates/rfc1918-private-ca.crt
    secret_refs:
