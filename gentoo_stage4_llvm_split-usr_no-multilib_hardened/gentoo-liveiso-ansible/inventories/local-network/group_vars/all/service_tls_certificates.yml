---
service_tls_certificate_policy:
  default_certificate_authority: "{{ service_tls_certificate_authority_default | default('rfc1918_private_ca') }}"
  secret_namespace: vault_service_tls_certificates
  deploy_enabled_default: false
  mutation_required: true
  leaf_key_mode: "0600"
  leaf_cert_mode: "0644"
  leaf_chain_mode: "0644"
  trust_anchor_mode: "0644"
  trust_anchor_targets:
    gentoo_openrc:
      anchors_dir: /usr/local/share/ca-certificates
      refresh_command: update-ca-certificates
      bundle_path: /etc/ssl/certs/ca-certificates.crt
    rocky_rhel:
      anchors_dir: /etc/pki/ca-trust/source/anchors
      refresh_command: update-ca-trust
      bundle_path: /etc/pki/tls/certs/ca-bundle.crt
    freebsd:
      anchors_dir: /usr/local/share/certs
      refresh_command: certctl rehash
      bundle_path: /usr/local/share/certs/ca-root-nss.crt

