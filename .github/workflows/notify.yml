name: Notify

on:
  push:
  create:
  delete:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - closed
      - ready_for_review
      - converted_to_draft
  release:
    types:
      - published
      - edited
      - prereleased
      - released
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send ntfy repository notification
        env:
          NTFY_URL: ${{ secrets.NTFY_URL || vars.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          NTFY_TOPIC_SUCCESS: ${{ secrets.NTFY_TOPIC_SUCCESS || vars.NTFY_TOPIC_SUCCESS }}
          NTFY_TOPIC_FAIL: ${{ secrets.NTFY_TOPIC_FAIL || vars.NTFY_TOPIC_FAIL }}
          NTFY_TOPIC_ERROR: ${{ secrets.NTFY_TOPIC_ERROR || vars.NTFY_TOPIC_ERROR }}
          NTFY_TOPIC_WARNING: ${{ secrets.NTFY_TOPIC_WARNING || vars.NTFY_TOPIC_WARNING }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          python .github/scripts/ntfy_repo_event.py \
            --allow-missing-config \
            --event-name "${GITHUB_EVENT_NAME}" \
            --event-path "${GITHUB_EVENT_PATH}"
